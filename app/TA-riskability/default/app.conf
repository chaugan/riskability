# Riskability Add-on: deploy to universal forwarders (inputs) and to indexers
# (index-time parsing). The search-head app "riskability" does the correlation.
[install]
is_configured = 1
state = enabled
build = 1

[package]
id = TA-riskability

[ui]
is_visible = 0
label = Riskability Add-on

[launcher]
author = chaugan
description = Collects swinv software inventory for the Riskability app. Deploy to forwarders (inputs) and indexers (parsing). Index definitions ship separately in TA-riskability-indexes, which must NOT go to forwarders.
version = 0.1.0
