# swinv writes one NDJSON file per scan plus a "<host>-latest.ndjson" symlink.
# Monitor the real files, not the symlink: re-pointing a symlink does not
# reliably produce a new-file event, and the symlink target changes name every
# run, so following it would re-read the whole inventory each scan.
#
# Disabled by default. AppInspect and good manners both require that installing
# an add-on does not silently start reading a customer's filesystem.
[monitor:///var/lib/swinv/*.ndjson]
disabled = 1
sourcetype = riskability:swinv
index = riskability_inventory
crcSalt = <SOURCE>
# swinv output is deterministic apart from timestamps, so two scans of an
# unchanged host share a long identical prefix. Without a source-based CRC salt
# Splunk would treat the new file as an already-seen one and skip it.
blacklist = -latest\.ndjson$
