# Index-time parsing for swinv NDJSON, applied on the forwarder itself.
#
# The line below this stanza header is what makes that true. Without it a
# universal forwarder does not parse, and these settings would have to be
# installed on the indexers as well.
[riskability:swinv]
# Parse on the forwarder, so none of the settings below depend on anybody
# configuring the indexers.
#
# A universal forwarder normally ships bytes and lets the first full Splunk
# instance parse them, which is why this add-on's settings historically had to be
# installed on the indexing tier as well. That is a requirement on infrastructure
# the person installing this app often does not own, and when it is missed
# nothing reports it: Splunk merges the NDJSON into blobs of a few hundred lines,
# each stops being valid JSON, and TRUNCATE discards most of the rest. A host
# reporting 3,993 components arrives as 15 and the fleet reads as clean.
#
# force_local_processing runs the linebreaker and aggregator on the forwarder
# instead. It costs the endpoint some CPU and memory, which for one scan an hour
# is a fair trade for removing a silent failure from every deployment that has a
# separate indexing tier. Ignored anywhere that is not a universal forwarder, so
# it is safe in this file.
force_local_processing = true
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
# One inventory line per component; the scan timestamp is repeated on each line.
TIME_PREFIX = "scanned_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
category = Structured
description = swinv software inventory (NDJSON, one component per line)
