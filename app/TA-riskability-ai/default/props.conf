# Parsing for the AI pipeline's three sourcetypes.
#
# riskability:ai:candidate is written by the queue search via "collect", which
# emits stash-format key="value" pairs, not JSON — the same situation as
# riskability:findings, and the same KV_MODE=auto answer. KV_MODE=json here
# would extract nothing and the GPU box would read an empty queue forever,
# reporting success, which is the worst kind of empty.
[riskability:ai:candidate]
KV_MODE = auto
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = Riskability AI candidate queue (one row per open finding per host)

# The two HEC-written sourcetypes arrive as one JSON object per event from the
# GPU box's orchestrator. Search-time JSON extraction makes every object key a
# field, including the nested arrays (recommended_mitigations,
# attck_techniques) that the prioritization schema defines.
[riskability:ai:prioritized]
# Written by the analyze search via "collect" (stash key=value), like the
# candidates sourcetype — so auto, not json, which extracts nothing from
# stash events. Should a HEC-JSON writer ever feed this index, auto still
# extracts its JSON: auto decides per event.
KV_MODE = auto
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
category = Structured
description = Riskability AI prioritization results written back by the GPU pipeline

[riskability:ai:alert]
KV_MODE = auto
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
category = Structured
description = Riskability AI P0/P1 alert events written back by the GPU pipeline
