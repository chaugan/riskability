# Deploy to indexers only. See indexes.conf for why this is not part of
# TA-riskability.
[install]
is_configured = 0
state = enabled
build = 1

# AppInspect requires an [id] stanza with a name for app installation, and
# reads the version from here when checking semantic versioning. It has to
# agree with [package] id and with the app's directory name.
[id]
name = TA-riskability-ai
version = 1.3.0

[package]
id = TA-riskability-ai

[ui]
is_visible = 0
label = Riskability AI Indexes

[launcher]
author = chaugan
description = Index definitions and parsing for the Riskability AI analysis pipeline. Indexers only.
version = 1.3.0
