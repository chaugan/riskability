# TA-riskability-ai: index definitions and parsing for the AI analysis
# pipeline. INDEXERS ONLY.
#
# Like TA-riskability-indexes, this must not be deployed to a universal
# forwarder: a UF does not index, and loading index definitions there
# produces errors on every start.
#
# This add-on is separate from TA-riskability-indexes because the pipeline it
# serves is optional. A site that never switches AI analysis on should not
# carry three indexes nobody writes to, and a site that does switch it on
# wants the retention decision separately: results are advisory, derived
# data, reproducible by re-running the pipeline, so they age out far sooner
# than the finding history in TA-riskability-indexes.
#
# Names here must match the riskability_index_ai_* macros in the main app.

[riskability_ai_candidates]
homePath   = $SPLUNK_DB/riskability_ai_candidates/db
coldPath   = $SPLUNK_DB/riskability_ai_candidates/colddb
thawedPath = $SPLUNK_DB/riskability_ai_candidates/thaweddb
# The queue is rebuilt on every run and each run is stamped with its own
# run_id, so old queues have no value once a newer one exists. Seven days is
# enough for the orchestrator to catch up after an outage and still lets an
# operator diff last Tuesday's queue against what was analysed.
frozenTimePeriodInSecs = 604800

[riskability_ai_prioritized]
homePath   = $SPLUNK_DB/riskability_ai_prioritized/db
coldPath   = $SPLUNK_DB/riskability_ai_prioritized/colddb
thawedPath = $SPLUNK_DB/riskability_ai_prioritized/thaweddb
# Fourteen days, not a year. Rows are per-run snapshots (every hourly run
# rewrites the full prioritised set for the analysed slice), and the
# dashboards read only the newest run per CVE per asset - so age here is
# pure index bulk, and the advisory history question is answered by the
# findings index, which keeps a year.
frozenTimePeriodInSecs = 1210000

[riskability_ai_alerts]
homePath   = $SPLUNK_DB/riskability_ai_alerts/db
coldPath   = $SPLUNK_DB/riskability_ai_alerts/colddb
thawedPath = $SPLUNK_DB/riskability_ai_alerts/thaweddb
# P0/P1 events feed alerting downstream (SOAR, chat). Alert histories are
# kept as long as the results they derive from, so a correlation between an
# alert that fired and the result that caused it always resolves.
frozenTimePeriodInSecs = 31536000
