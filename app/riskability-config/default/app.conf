# Riskability Configuration. Administrators only.
#
# This app is deliberately separate from the main riskability app, the same
# way Splunk ES separates the product from its configuration surface: the
# dashboards analysts live in stay free of anything that changes how the app
# works, and everything that does -- vulnerability feeds, index names, the AI
# analysis pipeline, its endpoint and its secret -- lives here, in an app
# whose metadata grants read access to admin and sc_admin and nobody else.
#
# is_configured = 1: this app has no setup flow of its own; every page here
# IS the setup flow. Telling Splunk it is unconfigured would make Splunk
# prompt for a setup view that does not exist.
[install]
is_configured = 1
state = enabled
build = 122

# AppInspect requires an [id] stanza with a name for app installation, and
# reads the version from here when checking semantic versioning. It has to
# agree with [package] id and with the app's directory name.
[id]
name = riskability-config
version = 1.3.0

[package]
id = riskability-config

[ui]
is_visible = 1
label = Riskability Configuration

[launcher]
author = chaugan
description = Administrative configuration for Riskability: vulnerability feeds, index names and the AI analysis pipeline. Administrators only.
version = 1.3.0
