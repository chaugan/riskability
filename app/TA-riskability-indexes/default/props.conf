# Index-time parsing, kept here as the second line of defence.
#
# From 0.1.30 the forwarder add-on parses locally (force_local_processing), so
# data arriving through a universal forwarder is already split by the time it
# gets here and this stanza changes nothing for it. It still matters for
# anything that reaches the indexers another way: a heavy forwarder, HEC, a
# file monitored on the indexer itself, or a forwarder running an older version
# of the add-on. Harmless where it is redundant, and the difference between a
# silent 97% data loss and none where it is not.
#
# It was once in TA-riskability only, which made the obvious deployment wrong:
# an operator installs the add-on named for indexers, the indexes exist, data
# arrives, and nothing complains. But without these settings Splunk merges the
# NDJSON lines into blobs of a few hundred, each blob is no longer valid JSON,
# and TRUNCATE discards about 97% of it. A host reporting 3,993 components
# surfaced as 15, with no error at any layer.
[riskability:swinv]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
# One inventory line per component; the scan timestamp is repeated on each line.
TIME_PREFIX = "scanned_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
category = Structured
description = swinv software inventory (NDJSON, one component per line)
