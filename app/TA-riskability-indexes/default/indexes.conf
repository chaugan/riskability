# Index definitions for Riskability. INDEXERS ONLY.
#
# indexes.conf must not be deployed to a universal forwarder: a UF does not
# index, and loading index definitions there produces errors on every start.
# That is why this is a separate package from TA-riskability, which does go to
# forwarders.
#
# No tstatsHomePath here. Splunk's own system/default/indexes.conf already sets
# tstatsHomePath = volume:_splunk_summaries/$_index_name/datamodel_summary for
# every index, so naming it per stanza only restated the default - and Splunk
# Cloud refuses the property outright, and refuses a volume: path for not
# containing $SPLUNK_DB.
#
# Two indexes: raw inventory is high volume with short retention, materialised
# findings are low volume with long retention. Keeping them apart lets an
# operator age out inventory aggressively without losing vulnerability history.
[riskability_inventory]
homePath   = $SPLUNK_DB/riskability_inventory/db
coldPath   = $SPLUNK_DB/riskability_inventory/colddb
thawedPath = $SPLUNK_DB/riskability_inventory/thaweddb
frozenTimePeriodInSecs = 2592000

[riskability_findings]
homePath   = $SPLUNK_DB/riskability_findings/db
coldPath   = $SPLUNK_DB/riskability_findings/colddb
thawedPath = $SPLUNK_DB/riskability_findings/thaweddb
frozenTimePeriodInSecs = 31536000

# Closed findings, aged out of the KV Store state collection.
#
# History has to live somewhere, and it should not be the collection dashboards
# read on every load: Splunk treats a KV collection over 25GB as a search-head
# stability risk, and closed findings are the part that grows without bound.
# An index is the right home for a write-once audit trail.
[riskability_findings_archive]
homePath   = $SPLUNK_DB/riskability_findings_archive/db
coldPath   = $SPLUNK_DB/riskability_findings_archive/colddb
thawedPath = $SPLUNK_DB/riskability_findings_archive/thaweddb
# Two years by default. This is the record of what was found and when it was
# fixed, which is exactly what an audit asks for long after the finding is gone.
frozenTimePeriodInSecs = 63072000

# The exception audit trail. Append-only, and deliberately not in the KV Store:
# a register that can be rewritten by whoever can write the register is not an
# audit trail. Five years, because "who accepted this risk, when, and what did
# they say they had done instead" is the question asked long after the finding
# itself is gone.
[riskability_audit]
homePath   = $SPLUNK_DB/riskability_audit/db
coldPath   = $SPLUNK_DB/riskability_audit/colddb
thawedPath = $SPLUNK_DB/riskability_audit/thaweddb
frozenTimePeriodInSecs = 157680000

# The collector's non component records: heartbeats, listening ports, containers
# and library links. Routed here at index time by TRANSFORMS in props.conf.
#
# Kept for a year, against thirty days for inventory, and that asymmetry is the
# point. A host whose software has not changed sends no exposure, container or
# link records at all, so the newest record describing what it is listening on
# can be arbitrarily old and still be current. Ageing these out on the inventory
# schedule would delete the only evidence of a stable host's open ports.
# It stays small in spite of the retention: those four record types are about
# one percent of what the collector emits, and only on scans that changed.
[riskability_meta]
homePath   = $SPLUNK_DB/riskability_meta/db
coldPath   = $SPLUNK_DB/riskability_meta/colddb
thawedPath = $SPLUNK_DB/riskability_meta/thaweddb
frozenTimePeriodInSecs = 31536000
