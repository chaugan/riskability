# Deploy to indexers only. See indexes.conf for why this is not part of
# TA-riskability.
[install]
is_configured = 0
state = enabled
build = 1

# AppInspect requires an [id] stanza with a name for app installation, and
# reads the version from here when checking semantic versioning. It has to
# agree with [package] id and with the app's directory name.
[id]
name = TA-riskability-indexes
version = 0.1.26

[package]
id = TA-riskability-indexes

[ui]
is_visible = 0
label = Riskability Indexes

[launcher]
author = chaugan
description = Index definitions for Riskability. Indexers only.
version = 0.1.26
