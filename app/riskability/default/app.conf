# Riskability: offline software vulnerability correlation for Splunk.
[install]
is_configured = 0
state = enabled
build = 1

[package]
id = riskability

[ui]
is_visible = 1
label = Riskability
setup_view = riskability_admin

[launcher]
author = chaugan
description = Correlates swinv software inventory against operator-supplied offline vulnerability feeds. No outbound network access.
version = 0.1.0

[triggers]
reload.riskability_feeds = simple
reload.collections = simple
