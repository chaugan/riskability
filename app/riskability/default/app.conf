# Riskability: offline software vulnerability correlation for Splunk.
[install]
# Shipped CONFIGURED, and the reason is a circular dependency, not laziness.
# While this is 0, Splunk puts its own "this app has not been fully configured
# yet" interstitial in front of EVERY view in the app -- including Feed
# administration, which is the only page that can import a feed, and importing a
# feed is the only thing that sets this flag. Verified on a clean install: that
# page returned the interstitial with no file input anywhere in the DOM, so the
# upload control the setup view links to could not be reached at all. A first
# run therefore had no way out except the shell. The app already says it has no
# feed, on this view's own first-run banner and in the empty state of every
# panel that depends on one, so nothing is lost by letting the operator in.
is_configured = 1
state = enabled
# Bump on every change to appserver/static, or browsers keep serving the old
# JavaScript from cache and a fix appears not to have deployed.
build = 162

# AppInspect requires an [id] stanza with a name for app installation, and
# reads the version from here when checking semantic versioning. It has to
# agree with [package] id and with the app's directory name.
[id]
name = riskability
version = 1.4.0

[package]
id = riskability

[ui]
is_visible = 1
label = Riskability
# Configuration lives in four admin-only views of this app, under the
# Administration menu. This view points at them. It is no longer a gate (see
# is_configured above); with the app shipped configured Splunk offers it as a
# "Set up" link in Manage Apps, which is a way in rather than a wall.
setup_view = riskability_setup

[launcher]
author = chaugan
description = Correlates swinv software inventory against operator-supplied offline vulnerability feeds. No outbound network access. AI analysis, when an administrator switches it on, runs on a separate GPU server the admin configures.
version = 1.4.0

[triggers]
reload.riskability_feeds = simple
reload.collections = simple
