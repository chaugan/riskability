# Riskability: offline software vulnerability correlation for Splunk.
[install]
# 0, and it has to be. Splunk Cloud vetting fails an app that ships
# is_configured = 1 (check_that_setup_has_not_been_performed), so the setup gate
# cannot simply be switched off. It could not be left as it was either: while
# this is 0 Splunk puts its own "not fully configured" page in front of EVERY
# view in the app, and on a fresh install that included Feed administration,
# which is the only page that can import a feed, and importing a feed is the
# only thing that clears this flag. A first run had no way out except the shell.
# The answer is the one Splunk's gate was designed for: setup_view below now
# points at a view that PERFORMS the setup rather than describing where it
# lives, so the gate leads to the page that clears it.
is_configured = 0
state = enabled
# Bump on every change to appserver/static, or browsers keep serving the old
# JavaScript from cache and a fix appears not to have deployed.
build = 162

# AppInspect requires an [id] stanza with a name for app installation, and
# reads the version from here when checking semantic versioning. It has to
# agree with [package] id and with the app's directory name.
[id]
name = riskability
version = 1.4.1

[package]
id = riskability

[ui]
is_visible = 1
label = Riskability
# Configuration lives in four admin-only views of this app, under the
# Administration menu. This view points at them. It is no longer a gate (see
# is_configured above); with the app shipped configured Splunk offers it as a
# "Set up" link in Manage Apps, which is a way in rather than a wall.
setup_view = riskability_setup

[launcher]
author = chaugan
description = Correlates swinv software inventory against operator-supplied offline vulnerability feeds. No outbound network access. AI analysis, when an administrator switches it on, runs on a separate GPU server the admin configures.
version = 1.4.1

# One reload trigger per custom conf this app ships, or Splunk asks for a
# restart on every change to them and AppInspect fails the app
# (check_reload_trigger_for_all_custom_confs). riskability_feeds was listed here
# and no such conf exists; collections.conf is Splunk's own, not a custom conf,
# and does not belong in this stanza.
[triggers]
reload.riskability_ai = simple
reload.riskability_escalations = simple
reload.riskability_firewall = simple
