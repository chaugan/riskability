# Firewall data source for the network evidence pipeline. Edited from the
# Riskability Configuration app, never by hand on a cluster: the admin page
# writes this stanza through splunkd's conf API and regenerates the five
# riskability_fw_* macros from it. An empty index means "not configured", and
# every network evidence row reads unknown, which is correct.
[settings]
mode = index
index =
sourcetype =
extra_filter =
src_field = src_ip
dest_field = dest_ip
port_field = dest_port
proto_field = transport
action_field = action
action_allowed = allowed
datamodel = Network_Traffic
dm_object = All_Traffic
dm_src_field = All_Traffic.src
dm_dest_field = All_Traffic.dest
dm_port_field = All_Traffic.dest_port
dm_proto_field = All_Traffic.transport
dm_action_field = All_Traffic.action
dm_where =
entry_points =
fresh_days = 7
stale_days = 2
identity_grace_days = 7
