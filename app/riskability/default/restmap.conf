# Admin-only endpoint that receives an uploaded feed bundle and imports it.
# Splunk Web's own lookup-upload path caps at 500 MB and lands a CSV in the
# knowledge bundle; this instead streams into the KV Store.
[script:riskability_feed_admin]
match = /riskability/feed
script = riskability_feed_rest.py
scripttype = persist
handler = riskability_feed_rest.FeedAdminHandler
requireAuthentication = true
capability.post = admin_all_objects
capability.get = admin_all_objects
output_modes = json
passPayload = true
passHttpHeaders = true
passSession = true
python.version = python3
python.required = 3.9, 3.13

# AI analysis pipeline configuration. Gated on its own capability,
# riskability_ai_admin, and NOT on admin_all_objects: pointing the pipeline
# at a GPU box and storing its secret is a different duty from importing
# feeds or from generic administration, and the dedicated capability lets a
# site hand exactly that duty to the person who runs the GPU box. The secret
# itself is read and written only here, and only through Splunk's encrypted
# storage-password store.
[script:riskability_ai_admin]
match = /riskability/ai
script = riskability_ai_rest.py
scripttype = persist
handler = riskability_ai_rest.AIAdminHandler
requireAuthentication = true
capability.post = riskability_ai_admin
capability.get = riskability_ai_admin
output_modes = json
passPayload = true
passHttpHeaders = true
passSession = true
python.version = python3
python.required = 3.9, 3.13

# One bit for the user-facing app: whether AI prioritisation is switched on.
# The AI overview page asks exactly this question so that it can remove
# itself entirely when the answer is no -- an instance where an admin never
# configured AI must give a normal user nothing to see and nothing to learn
# from asking. Readable with list_settings, the same gate the exceptions
# endpoint grants its read path: the answer is already implied by whether the
# page appears in the nav at all.
[script:riskability_ai_status]
match = /riskability/ai_status
script = riskability_ai_status_rest.py
scripttype = persist
handler = riskability_ai_status_rest.AIStatusHandler
requireAuthentication = true
capability.get = list_settings
output_modes = json
passPayload = true
passHttpHeaders = true
passSession = true
python.version = python3
python.required = 3.9, 3.13

# The risk-exception register. Gated on its own capability rather than on
# admin_all_objects; see authorize.conf.
[script:riskability_exceptions]
match = /riskability/exceptions
script = riskability_exceptions_rest.py
scripttype = persist
handler = riskability_exceptions_rest.ExceptionsHandler
requireAuthentication = true
capability.post = riskability_accept_risk
capability.get = list_settings
output_modes = json
passPayload = true
passHttpHeaders = true
passSession = true
python.version = python3
python.required = 3.9, 3.13
