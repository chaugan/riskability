# Accepting a risk is not the same job as importing a feed.
#
# The feed endpoint requires admin_all_objects, which is right for "parse a
# hostile tarball into the KV Store" and wrong for this: they are different
# duties and a site may well want different people doing them. A dedicated
# capability also means the answer to "how do I stop an analyst excepting
# findings" is simply that they never hold it -- the endpoint returns 403 and
# the collection is not writable from the browser at all.
[capability::riskability_accept_risk]

# Switching AI analysis on or off, pointing it at a GPU box, storing its
# secret, editing the command that dispatches analysis runs. Deliberately its
# own capability rather than admin_all_objects, like the accept-risk one
# above: the person who owns the GPU server is not necessarily the person who
# imports vulnerability feeds, and "who can turn data egress on" should be a
# question with a one-word answer in the role config.
# Explicitly NOT granted to power. Enabling the pipeline is the decision that
# lets vulnerability data leave for the GPU box; an analyst role never holds
# that decision.
[capability::riskability_ai_admin]

# Explicitly NOT granted to power. power is the ordinary analyst role, and an
# analyst being able to remove findings from every risk number in the app is
# precisely the thing this capability exists to prevent.
[role_admin]
riskability_accept_risk = enabled
riskability_ai_admin = enabled
riskability_ai_explain = enabled

[role_sc_admin]
riskability_accept_risk = enabled
riskability_ai_admin = enabled
riskability_ai_explain = enabled

# Asking the model to explain ONE CVE that has already been analysed, on a
# person's click. Its own capability so that a site can withhold it without
# switching the whole pipeline off.
#
# READ THIS BEFORE GRANTING IT TO AN ANALYST ROLE. An earlier version of this
# comment argued it was safe to do so. It is not, and the reason is not in this
# file: the endpoint reads the model endpoint's stored secret using the
# CALLER's own session, because a persistent REST handler has no other token.
# So granting this capability alone does not work (the storage-password read
# returns nothing and the call goes out unauthenticated or fails), and granting
# what would make it work means granting list_storage_passwords, which lets
# that role read every stored secret on the search head, for every app. The
# same applies to the verdict cache: it is admin-write, so a non-admin never
# populates it and every click is a fresh model call, for ever, silently.
#
# So this is an admin-tier capability in practice, and it is granted below to
# exactly the roles that already hold admin rights. Making an analyst-safe
# version needs a different design, not a different grant: the explanation
# would have to be produced by the scheduled pipeline, which runs with the
# search owner's context, rather than by a handler running as whoever clicked.
[capability::riskability_ai_explain]
