# Splunk Web's /splunkd/__raw/ proxy will not forward an arbitrary splunkd
# endpoint: each one must be whitelisted with an [expose] stanza. Without this
# the admin page's own REST calls come back as a bare "Not Found" XML error
# even though the endpoint answers perfectly well on port 8089, which makes it
# look like the handler is broken rather than simply unexposed.
[expose:riskability_feed]
pattern = riskability/feed
methods = GET,POST

[expose:riskability_feed_sub]
pattern = riskability/feed/*
methods = GET,POST

[expose:riskability_exceptions]
pattern = riskability/exceptions
methods = GET,POST

[expose:riskability_exceptions_sub]
pattern = riskability/exceptions/*
methods = GET,POST

[expose:riskability_ai]
pattern = riskability/ai
methods = GET,POST

[expose:riskability_ai_status]
pattern = riskability/ai_status
methods = GET

# Read-only, and only view metadata: the landing and overview pages check
# whether the current user may read the feed-administration view before showing
# the Admin link, and this is the check. View metadata is labels and sharing --
# nothing secret -- and the method is pinned to GET so this cannot become a
# write path to anyone else's view permissions.
#
# Named, not wildcarded. splunkd still applies the caller's own ACLs either
# way, so a wildcard was never an authorisation hole, but "data/ui/views/*"
# opens every view endpoint of every app on the instance through the web tier
# to serve one probe of one view. The probe is riskability_adminlink.js asking
# whether it may show the Admin link; riskability_admin is the only view it
# asks about.
[expose:riskability_ui_read]
pattern = data/ui/views/riskability_admin
methods = GET

[expose:riskability_ai_explain]
pattern = riskability/ai_explain
methods = POST

# The escalation rules switch, called from the admin app through Splunk Web's
# proxy. An endpoint that is not listed here answers 404 from the browser and
# 200 from splunkd directly, which is precisely how this one first failed.
[expose:riskability_escalations]
pattern = riskability/escalations
methods = GET,POST

[expose:riskability_firewall]
pattern = riskability/firewall
methods = GET,POST
