# Splunk Web's /splunkd/__raw/ proxy will not forward an arbitrary splunkd
# endpoint: each one must be whitelisted with an [expose] stanza. Without this
# the admin page's own REST calls come back as a bare "Not Found" XML error
# even though the endpoint answers perfectly well on port 8089, which makes it
# look like the handler is broken rather than simply unexposed.
[expose:riskability_feed]
pattern = riskability/feed
methods = GET,POST

[expose:riskability_feed_sub]
pattern = riskability/feed/*
methods = GET,POST
