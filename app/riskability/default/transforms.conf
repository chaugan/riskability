# Route the collector's non component records to their own index.
#
# swinv writes one JSON object per line and LINE_BREAKER guarantees one line per
# event, so this regex sees exactly one whole record. A component record has no
# record_type key at all; the four types named here are the only ones that do.
#
# Anchored at the start of the line on purpose. An unanchored match would also
# fire on a component whose file path happened to contain the text, and misfiling
# a component is the one error that would lose inventory. Anchoring means the
# worst case is the opposite: a record this fails to match keeps the index the
# input assigned it, so it stays where it is today and the only cost is that the
# snapshot jobs go on reading the large index for it. Nothing is ever dropped.
#
# If a future collector emits record_type somewhere other than first in the
# object, routing silently stops and those records stay in the inventory index.
# Coverage is what catches that: the scan manifest compares what the collector
# said it produced against what arrived.
[riskability_route_meta]
REGEX = ^\{"record_type"\s*:\s*"(?:heartbeat|exposure|container|link|config)"
DEST_KEY = _MetaData:Index
FORMAT = riskability_meta

