    reason_kind, control, notes, created_by, created_at, updated_by, updated_at, \
    expires_at, revoked_at, revoked_by

# The same collection, keyed for joining. A finding builds three candidate keys
# -- its own, its host-and-CVE, and the CVE fleet-wide -- and the reconciler
# takes the most specific match, so scope never has to be branched on inside a
# search.
# Keyed on active_match_key, NOT match_key. match_key is deliberately not
# unique -- a scope can be accepted, withdrawn and accepted again, and keeping
# all three on one key is what makes the history readable -- but a Splunk lookup
# matching two documents returns every output field as a MULTIVALUE, and the
# guards the reconciler applies then all collapse to false. The exception reads
# active in the register, covers zero findings, and the findings stay in the
# risk pool: accepted, confirmed, and nothing happens. active_match_key is the
# same value, carried only while the decision is in force, so revoked and
# expired rows are simply not found by a search asking what applies now.
[riskability_exception_match_lookup]
external_type = kvstore
collection = riskability_exceptions
fields_list = active_match_key, exception_key, expires_at, revoked_at, reason_kind

