# Which host held which address, and over what interval. The join key firewall
# evidence needs, and the only table in this app that can supply it.
#
# Field names match what riskability_host_addresses already emits (address,
# family, addr_source), deliberately and not by coincidence. outputlookup writes
# only the fields a definition declares and says nothing about the ones it does
# not recognise, so a writer emitting "address" into a definition that declared
# "host_address" writes the column away in silence. That is the failure this
# branch has now hit six times, and matching the producer is the cheapest guard
# against a seventh.
#
# addr_source is prefixed because the bare name source is already the inventory
# origin on riskability_invstate. addr_scope is prefixed because scope is
# package-or-container on a finding. A lookup that OUTPUTs either unrenamed
# overwrites a field from a different vocabulary and nothing anywhere reports
# that it happened, which is the failure written up on
# riskability_eolstate_lookup below. family and address are NOT prefixed,
# because the producer's names win over the collision rule: family is also the
# socket address family on an exposure record, and address is also a socket bind
# address there, so anything reading exposure events beside this collection must
# rename on OUTPUT rather than assume.
#
# addr_first_seen and addr_last_seen rather than first_seen and last_seen. Those
# two bare names are the finding lifecycle's own, on riskability_findings_state,
# and evidence built from this table is attached to findings, so the unprefixed
# pair would land on a pipeline that already has them and silently redate every
# finding it touched.
#
# addr_scope is the private-or-public answer, and it is an enum rather than a
# flag because the two-value version is wrong at the edges that matter:
# 100.64.0.0/10 is neither, and a link-local or loopback address is not
# something a firewall on another segment could ever have logged. Vocabulary:
# private, public, cgnat, link-local, loopback, unknown.
#
# addr_source records WHICH collector surface asserted the address, because they
# are not equally good and a reader must be able to tell them apart.
# riskability_host_addresses writes "listening-bind": an address recovered from
# a socket bound specifically to it. That surface is much the weaker of the two.
# It sees an address only while some process is bound to that address alone, so
# a host binding only wildcards contributes nothing at all, and its absence from
# this table says nothing whatever about the addresses it holds. A future
# "host-inventory" source, from a collector that emits host addresses or from a
# site's own CMDB, is a different quality of fact. Anything grading identity
# must read this field rather than treat a row as a row.
#
# machine_id is carried deliberately, and it is the one field here that is a
# copy of another collection's. riskability_hoststate holds it for display only;
# here it is a second opinion on identity. A hostname is a mutable label and two
# machines can wear it in sequence, so an address whose claimant kept one
# hostname across a machine_id change has not stayed with one machine.
#
# observations, max_gap and claimants are the drift guards described on the
# collection. A reader that takes the interval without them will attribute an
# address to a host across a gap in which it did not hold it.
[riskability_hostaddr_lookup]
external_type = kvstore
collection = riskability_hostaddr
fields_list = _key, hostname, address, family, addr_scope, addr_source, \
    addr_first_seen, addr_last_seen, observations, max_gap, claimants, \
    machine_id, last_scan_id, rolled_at

# The same collection, read the other way round: address in, host out. Mirrors
# riskability_exception_match_lookup above, which exists for the same reason --
# one collection, two directions, and the dangerous direction gets its own name
# so the hazard has somewhere to be written down. This definition enforces
# nothing on its own; naming the direction is what gives the warning a home.
#
# The hazard: this is matched on address ALONE, and a contested address matches
# more than one document. A Splunk lookup that matches several documents returns
# every output field as MULTIVALUE, so hostname comes back multivalue, an eval
# comparing it to a string is false, and concatenating it into a key yields null
# outright.
#
# That is not a defect to design around here. It IS the signal, and it is the
# exact moment the join would otherwise launder an address into a host. A reader
# must test mvcount(hostname) before using anything this returns and grade the
# evidence unknown when it is greater than one. Taking mvindex(hostname, 0)
# instead picks whichever host the KV Store happened to return first, which is
# an answer with no meaning attached to it, delivered with the app's own
# credibility lent to it.
#
# _key and rolled_at are omitted: neither means anything in this direction, and
# a narrower list is one fewer field to OUTPUT unrenamed by accident.
[riskability_hostaddr_owner_lookup]
external_type = kvstore
collection = riskability_hostaddr
fields_list = address, hostname, machine_id, addr_first_seen, addr_last_seen, \
    observations, max_gap, claimants, family, addr_scope, addr_source

# Whether a host reported addresses at all, and whether its collector can. Read
# beside riskability_hostaddr_lookup the way riskability_links_hoststate_lookup
# is read beside riskability_loaded_lookup: no row means never assessed, and
# never assessed must never render as "holds no addresses" or grade as "not
# observed".
#
# contested_addresses is this host's count of addresses another host also
# claims. It belongs on the per-host row and not only on the address rows
# because it answers the question an operator asks before trusting any of this:
# is this machine's identity stable enough for the join to mean anything.
[riskability_hostaddr_hoststate_lookup]
external_type = kvstore
collection = riskability_hostaddr_hoststate
fields_list = _key, hostname, addresses, ipv4_addresses, ipv6_addresses, \
    contested_addresses, addr_source, swinv_version, schema_version, \
    assessed_at, rolled_at

# Observed permitted traffic evidence, one row per (hostname, port). Written by
# the evidence join job, read only through riskability_net_evidence_join, which
# matches it on hostname and port and derives observed_rank from the grade.
#
# The first nine names after the key are the contract that macro already reads
# -- observed_grade, observed_reason, sessions, edge_last_seen, hops, entry_text,
# identity_state, evidence_strength, coverage_state -- and they are listed here
# because a field absent from a fields_list is silently unavailable to SPL. The
# macro would still parse, the lookup would still succeed, and every output
# would be null, which reads downstream as "no evidence row for this host and
# port" and grades unknown. A whole feature would sit behind a green test suite
# saying nothing, which is what happened the last six times.
#
# observed_grade vocabulary: "confirmed observed", "historically observed",
# "not observed", "unknown", in descending strength. Two rules govern it and
# neither is negotiable. Unknown is never not exposed: no firewall data, a stale
# index, a segment no logging device covers, and an address that could not be
# tied to exactly one host all land in unknown, and unknown is an admission
# rather than a clean bill. And "not observed" is writable only when
# coverage_state says the segment is covered AND the firewall data is fresh,
# because on any other input the absence of an edge is the absence of a log, not
# the absence of a permission.
#
# observed_reason is not decoration and not optional. A grade on its own is not
# evidence, and an unknown row that does not say why it is unknown is a bug. The
# reason is what lets an operator disagree with the grade without re-deriving
# it, which is the only reason anyone will trust it.
#
# evidence_strength carries the boundary nuance: internet scan pressure is
# constant, so a permitted edge from a boundary entry point shows sessions
# within hours and its absence approaches meaning something, while east-west
# "nobody has tried yet" is the ordinary state of an internal segment. The
# evidence is strongest at the boundary hop and degrades with every hop inward,
# and hops records how far in this row sits. The vocabulary of the field itself
# belongs to the join job that writes it and is not fixed here.
#
# previous_grade, grade_changed_at and reappeared_at are the whole of the
# regression detector. Saying that a permitted route to a risky port from a
# sensitive entry point was observed for the first time, or has returned after
# an absence, is a statement about a change in the estate rather than an
# estimate of anything: it costs one comparison against the row already stored
# and it needs no model. reappeared_at separates a return from a first
# appearance, which edge_first_seen alone cannot. The signal fires on appearance
# and never on absence, so the under-claiming problem does not reach it.
#
# dest_address and the addr_ fields are copied from riskability_hostaddr at the
# moment the grade was decided, and the duplication is deliberate. The grade is
# a claim about identity as much as about traffic, and a claim that cannot be
# audited without re-deriving its inputs will not be audited. Carrying the
# address that matched, the interval it matched inside, the gap in that interval
# and the number of claimants means an operator can see WHY a row says confirmed
# rather than unknown, and can still see it later once the ledger has moved on.
#
# coverage_state is the requirement that missing firewall data may reduce
# confidence and must never reduce a score, made storable. fw_last_event sits
# beside it because a covered segment whose enforcement point stopped logging
# looks exactly like a covered segment where nothing happened, and telling those
# apart is the entire value of the word covered.
#
# srcs_text and n_srcs follow the endpoints_text and n_endpoints idiom on
# riskability_containers, and entry_text and protocols_text follow it too: the
# values behind a row are unbounded, so a capped rendered string beside a true
# count beats a multivalue field that breaks every concatenation it touches.
[riskability_netevidence_lookup]
external_type = kvstore
collection = riskability_netevidence
fields_list = _key, hostname, port, observed_grade, observed_reason, sessions, \
    edge_last_seen, hops, entry_text, identity_state, evidence_strength, \
    coverage_state, protocols_text, edge_first_seen, srcs_text, n_srcs, \
    entry_pressure, n_entries, dest_address, addr_first_seen, addr_last_seen, \
    addr_max_gap, addr_source, claimants, previous_grade, grade_changed_at, \
    reappeared_at, fw_last_event, assessed_at, rolled_at

# One CVE, by id. Descriptions are stored as text rather than compressed
