[riskability_ranges_lookup]
external_type = kvstore
collection = riskability_ranges
fields_list = _key, gen, ecosystem, package, advisory_id, cve_id, introduced, fixed, last_affected, distro, distro_release, distro_variant, source_package, status, feed_source

[riskability_advisories_lookup]
external_type = kvstore
collection = riskability_advisories
fields_list = _key, gen, advisory_id, cve_id, aliases, title, severity, cvss_score, cvss_vector, cwes, epss, epss_percentile, kev_added, kev_due, kev_ransomware, published, modified, feed_source, url

[riskability_notaffected_lookup]
external_type = kvstore
collection = riskability_notaffected
fields_list = _key, gen, ecosystem, package, advisory_id, distro, distro_release, distro_variant, status, reason

[riskability_feedstate_lookup]
external_type = kvstore
collection = riskability_feedstate
fields_list = _key, generation, bundle_id, bundle_version, imported_at, imported_by, sources, advisory_count, range_count, notaffected_count, previous_bundle_version, state, message, error, loaded_ranges, expected_ranges, attack_count

[riskability_suppressions_lookup]
external_type = kvstore
collection = riskability_suppressions
fields_list = _key, hostname, package, ecosystem, advisory_id, reason, created_by, created_at, expires_at

# Manual enrichment for ad-hoc searches over findings:
#   ... | lookup riskability_advisory_lookup cve_id OUTPUT severity epss kev_added
[riskability_advisory_lookup]
external_type = kvstore
collection = riskability_advisories
fields_list = gen, cve_id, advisory_id, title, severity, cwes, epss, epss_percentile, kev_added, kev_due, kev_ransomware, url

[riskability_attack_lookup]
external_type = kvstore
collection = riskability_attack
fields_list = _key, gen, cwe, technique, technique_name, via_capec, tactics

# Which ATT&CK tactic a technique belongs to, and the order tactics appear in
# on MITRE's matrix. Read straight from MITRE's matrix object rather than
# hardcoded, because ATT&CK reorders and renames tactics between versions.
[riskability_tactic_lookup]
external_type = kvstore
collection = riskability_tactics
fields_list = _key, gen, tactic, tactic_name, tactic_order

# Current version of a package at a path, for the paths findings reference.
# Written hourly by "Riskability - snapshot inventory state".
[riskability_invstate_lookup]
external_type = kvstore
collection = riskability_invstate
fields_list = _key, hostname, package, path, current_version, inv_time

# Distinct package count per ecosystem in the imported feed, written by the
# importer. Lets Coverage answer "is this ecosystem in the feed at all" without
# scanning the range table.
[riskability_feedeco_lookup]
external_type = kvstore
collection = riskability_feedeco
fields_list = _key, ecosystem, feed_packages, feed_ranges, gen

# Last time each host reported any inventory.
[riskability_hoststate_lookup]
external_type = kvstore
collection = riskability_hoststate
fields_list = _key, hostname, host_last_scan, os, release, arch, machine_id

# One row per finding with its lifecycle state. Written hourly by
# "Riskability - snapshot finding lifecycle"; every dashboard reads it.
[riskability_findings_state_lookup]
external_type = kvstore
collection = riskability_findings_state
fields_list = _key, finding_key, first_seen, last_seen, first_version, last_version, \
    cve_id, hostname, package, ecosystem, path, scope, scope_id, fixed_version, confidence, \
    match_authority, severity, epss, kev_added, kev_due, url, title, times_seen, \
    current_version, host_last_scan, host_last_matched, last_match_run, is_current, status, \
    mitigation, closure_reason, closed_at, archived, age_days, accepted, exception_key, \
    exception_expires_at

# Per-host match checkpoint: inventory digest, feed generation, matcher version.
[riskability_matchstate_lookup]
external_type = kvstore
collection = riskability_matchstate
fields_list = _key, hostname, digest, feed_gen, matcher_version, matched_at, n_components, \
    folded_run, folded_at, folded_findings

# The risk-exception register. scope_kind is an explicit enum rather than
# wildcards inferred from empty fields: a row whose hostname happens to be
# blank should never quietly become a fleet-wide exception.
[riskability_exceptions_lookup]
external_type = kvstore
collection = riskability_exceptions
fields_list = _key, exception_key, match_key, scope_kind, hostname, cve_id, finding_key, \
    reason_kind, control, notes, created_by, created_at, updated_by, updated_at, \
    expires_at, revoked_at, revoked_by

# The same collection, keyed for joining. A finding builds three candidate keys
# -- its own, its host-and-CVE, and the CVE fleet-wide -- and the reconciler
# takes the most specific match, so scope never has to be branched on inside a
# search.
[riskability_exception_match_lookup]
external_type = kvstore
collection = riskability_exceptions
fields_list = match_key, exception_key, expires_at, revoked_at, reason_kind

# Component counts per host per ecosystem. Written hourly by
# "Riskability - snapshot components by ecosystem".
[riskability_hostecostate_lookup]
external_type = kvstore
collection = riskability_hostecostate
fields_list = _key, hostname, type, components
