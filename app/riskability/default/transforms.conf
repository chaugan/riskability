# The host configuration surface, one row per (host, mechanism). Written hourly
# by "Riskability - snapshot configuration surface" and read by the Host and
# ATT&CK pages, which aggregate it at page load.
#
# Every field an escalation rule would want is declared (attack, user,
# world_writable, setuid, setgid, mode), and none of them is reachable from a
# finding. There is no key from a finding to a mechanism, and the only cheap
# join is hostname, which is accelerated but returns every mechanism on the
# host as a multivalue. What is missing is a per-host rollup reducing these to
# one row: no such collection exists, and this comment is here so the next
# person to look does not conclude from a complete fields_list that the fact is
# available.
[riskability_config_lookup]
external_type = kvstore
collection = riskability_config
fields_list = _key, hostname, kind, name, path, executable, attack, user, schedule, purl, mode, setuid, setgid, world_writable, n_evidence, scanned_at

# The AI pipeline's own state, and the only lookup here that has to carry two
# different row shapes. _key="ai_enabled" holds the master switch, mirrored out
# of riskability_ai.conf by the admin endpoint so an ordinary user's AI page can
# read it without admin rights. _key="overview" holds the hourly summary the
# expansion search writes from its appendpipe, which is where the dashboard's
# headline counts come from.
#
# Both shapes are named in fields_list because outputlookup writes only the
# fields a definition declares. Listing one shape would not fail loudly, it
# would write the summary row with most of its columns quietly missing.
#
# sea_0 to sea_4 are here because that is not a hypothetical. The expansion
# search's summary appendpipe has always computed them and written them to this
# collection, they were not declared, and outputlookup silently kept the nine
# columns it recognised and dropped the five it did not. The AI page's exploit
# likelihood bands were reading a row that had never carried them. Adding a
# field to a fields_list changes nothing for a writer that does not produce it,
# so the only cost of listing a column here is the line; the cost of omitting
# one is a number nobody can find the absence of.
[riskability_aistate_lookup]
external_type = kvstore
collection = riskability_aistate
fields_list = _key, enabled, findings, cves, assets, p0, p1, latest_at, run_id, computed_at, \
    sea_0, sea_1, sea_2, sea_3, sea_4

# Search-time access to the verdict cache. The expansion search joins open
# findings to their CVE verdicts through this definition; write access is
# only ever the queue consumer command itself.
#
# title through cwe_id are the finding context the analyse command already had
# in hand to build the prompt, kept on the verdict so the expansion search does
# not have to re-derive it. They are easy to leave out of this list and hard to
# notice missing: the AI dashboard queries the collection over REST and sees
# them, while any SPL reading them through this definition gets nothing back.
[riskability_aiverdicts_lookup]
external_type = kvstore
collection = riskability_aiverdicts
fields_list = _key, cve_id, sig, analysed_at, analysis_source, latency_ms, priority_tier, priority_score, confidence, rationale, exploitability_signal, exposure_signal, process_match_confidence, recommended_action, recommended_mitigations, attck_techniques, title, package, severity, epss, kev, exposure_zone, cwe_id

# Vendor by package name, for the AI page and anything else that needs to say
# whose software a finding is about. Written by the vendor rollup search.
[riskability_vendor_lookup]
external_type = kvstore
collection = riskability_vendor
fields_list = _key, package, vendor
