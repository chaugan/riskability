# Whether a host's exposure was assessed at all. Hourly.
[riskability_exposure_hoststate_lookup]
external_type = kvstore
collection = riskability_exposure_hoststate
fields_list = _key, hostname, listeners, wildcard_listeners, unattributed_listeners, \
    os_listeners, packages_behind_ports, containers, assessed_at, rolled_at

# One CVE, by id. Descriptions are stored as text rather than compressed
# blobs: the KV Store would need base64 to carry binary, which inflates by a
# third, and MongoDB already compresses at rest.
[riskability_cvedetail_lookup]
external_type = kvstore
collection = riskability_cvedetail
fields_list = _key, gen, cve_id, description, products, cwes, assigner, published
