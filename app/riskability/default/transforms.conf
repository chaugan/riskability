[riskability_ranges_lookup]
external_type = kvstore
collection = riskability_ranges
fields_list = _key, ecosystem, package, advisory_id, introduced, fixed, last_affected, distro, distro_release, source_package, status, feed_source

[riskability_advisories_lookup]
external_type = kvstore
collection = riskability_advisories
fields_list = _key, advisory_id, cve_id, aliases, title, severity, cvss_score, cvss_vector, epss, epss_percentile, kev_added, kev_due, kev_ransomware, published, modified, feed_source, url

[riskability_notaffected_lookup]
external_type = kvstore
collection = riskability_notaffected
fields_list = _key, ecosystem, package, advisory_id, distro, distro_release, status, reason

[riskability_feedstate_lookup]
external_type = kvstore
collection = riskability_feedstate
fields_list = _key, bundle_id, bundle_version, imported_at, imported_by, sources, advisory_count, range_count, sha256

[riskability_suppressions_lookup]
external_type = kvstore
collection = riskability_suppressions
fields_list = _key, hostname, package, ecosystem, advisory_id, reason, created_by, created_at, expires_at

# Manual enrichment for ad-hoc searches over findings:
#   ... | lookup riskability_advisory_lookup cve_id OUTPUT severity epss kev_added
[riskability_advisory_lookup]
external_type = kvstore
collection = riskability_advisories
fields_list = cve_id, advisory_id, title, severity, epss, epss_percentile, kev_added, kev_due, kev_ransomware, url
