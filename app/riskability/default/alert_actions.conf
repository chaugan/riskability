# The alert action that pokes the GPU box when a candidate queue is ready.
#
# The command it runs is NOT configured here. It lives in riskability_ai.conf
# [connection]/trigger_command, written only through the admin REST endpoint
# guarded by riskability_ai_admin. An execution setting must not be readable
# off disk by anyone who can read a conf file and writable by anyone who can
# write one: the capability gate on the endpoint is the whole control.
#
# The script itself is a no-op when AI is switched off or when no trigger
# command is configured (the GPU box polls the queue index in that mode), so
# shipping the action enabled costs nothing until an admin turns the
# pipeline on.
[riskability_ai_trigger]
label = Riskability AI: dispatch analysis run
description = Tell the GPU analysis pipeline that a candidate queue is ready. \
  Runs the command configured on the Riskability Configuration page, with \
  $run_id$ substituted. Does nothing when AI analysis is switched off or when \
  the GPU box is expected to poll for itself.
payload_format = json
is_custom = 1
