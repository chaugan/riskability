# ECharts-backed charts for the Riskability dashboards.
#
# One visualization covering a closed set of chart types rather than one per
# type: they share a single bundled ECharts core, which is what keeps the
# package small enough to carry across an air gap.
[riskability_chart]
label = Riskability chart
description = Treemap, Sankey, heatmap, boxplot and bar charts for vulnerability and ATT&CK data.
allow_user_selection = 1
default_height = 400
