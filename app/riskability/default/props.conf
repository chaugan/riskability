# Search-time only. Index-time parsing lives in TA-riskability on the indexers.
[riskability:swinv]
KV_MODE = json
# swinv already emits snake_case field names that match the data model, so no
# aliasing is needed for the common fields. Only the derived ones are built here.
# Splunk's JSON extraction names array fields with a "{}" suffix, so swinv's
# locations/licenses/cpes arrive as locations{}, licenses{} and cpes{}. Nothing
# errors if you refer to them by their unsuffixed names -- the field is simply
# always null, which silently disables root detection and CPE matching. Alias
# them once here rather than quoting braces at every call site.
FIELDALIAS-json_arrays = "locations{}" AS locations "licenses{}" AS licenses "cpes{}" AS cpes

EVAL-package_key = lower(coalesce('type',"unknown")) . ":" . lower('name')
EVAL-distro_key = coalesce(lower('os_id'),"") . ":" . coalesce('os_version_id',"")
FIELDALIAS-dest = hostname AS dest
# No automatic KEV/EPSS lookup here. Inventory events describe installed
# packages and carry no cve_id, so an automatic lookup keyed on one can never
# match and only produces "Could not load lookup" noise on every search.
# Advisory enrichment happens in riskabilitymatch, where a cve_id exists.

[riskability:findings]
# Written by the materialise search via "collect", which emits stash-format
# key="value" pairs, not JSON. KV_MODE=json here silently extracts nothing and
# every findings dashboard comes back empty with no error anywhere.
KV_MODE = auto
SHOULD_LINEMERGE = false
TRUNCATE = 0
