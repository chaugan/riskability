# Search-time only. Index-time parsing lives in TA-riskability on the indexers.
[riskability:swinv]
KV_MODE = json
# swinv already emits snake_case field names that match the data model, so no
# aliasing is needed for the common fields. Only the derived ones are built here.
EVAL-package_key = lower(coalesce('type',"unknown")) . ":" . lower('name')
EVAL-distro_key = coalesce(lower('os_id'),"") . ":" . coalesce('os_version_id',"")
FIELDALIAS-dest = hostname AS dest
LOOKUP-riskability_kev = riskability_kev_lookup cve_id OUTPUT kev_added, kev_due, kev_ransomware

[riskability:findings]
KV_MODE = json
