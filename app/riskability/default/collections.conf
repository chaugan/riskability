# Feed data lives in the KV Store, never in the app's default/ directory:
# default/ is replaced wholesale on upgrade, and a multi-hundred-MB lookup file
# would be pushed to every indexer in the knowledge bundle on every search.

# Rows carry a "gen" (generation) so an import can write a whole new feed
# alongside the live one and flip to it atomically. Every read filters on the
# live generation, so an interrupted import leaves the previous feed intact
# instead of truncating it. gen leads each acceleration for that reason.

# One row per (ecosystem, package, advisory) affected range.
[riskability_ranges]
enforceTypes = false
replicate = false
accelerated_fields.pkg = {"gen": 1, "ecosystem": 1, "package": 1}
accelerated_fields.advisory = {"gen": 1, "advisory_id": 1}

# One compact metadata row per advisory: severity, CVSS, title, source.
[riskability_advisories]
enforceTypes = false
replicate = false
# riskabilitymatch joins on advisory_id; the dashboards' enrichment lookup
# joins on cve_id. Both need an index. Accelerating only advisory_id left every
# cve_id lookup scanning the whole collection -- 810,428 rows -- which is what
# made the ATT&CK dashboard take two minutes while the others took nine
# seconds. An acceleration that does not match the join key is invisible: the
# lookup still works, just slowly.
accelerated_fields.id = {"gen": 1, "advisory_id": 1}
# cve_id LEADS this index deliberately. A compound index is only usable when
# the query includes its leading field, and the dashboards' enrichment lookup
# matches on cve_id alone -- so {"gen":1,"cve_id":1} is silently unusable for
# it and every lookup falls back to a full scan.
accelerated_fields.cve = {"cve_id": 1, "gen": 1}

# Vendor "not affected" / "will not fix" statements, which override a range hit.
[riskability_notaffected]
enforceTypes = false
replicate = false
accelerated_fields.pkg = {"gen": 1, "ecosystem": 1, "package": 1}

# Which feed bundle is live, when it was imported, and by whom.
# How many distinct packages the imported feed knows about, per ecosystem.
#
# Written by the importer, which is already walking every range row, so it costs
# nothing beyond the set it keeps while streaming. Computing it in SPL instead
# means "inputlookup riskability_ranges | stats dc(package) BY ecosystem" over
# the whole range table -- 36 seconds and five million rows on a two-host
# development fleet, and it grows with the feed rather than with the fleet, so
# it gets slower for everybody forever. Fifteen rows read instantly instead.
[riskability_feedeco]
enforceTypes = false
replicate = false

[riskability_feedstate]
enforceTypes = false
replicate = false

# Operator suppressions / accepted risk, keyed by finding identity.
[riskability_suppressions]
enforceTypes = false
replicate = false

# MITRE ATT&CK technique mapping, one row per (CWE, technique) edge. Small
# (a few hundred rows), but generation-tagged like everything else so an
# interrupted import cannot leave a half-written mapping live.
[riskability_attack]
enforceTypes = false
replicate = false
# cwe leads for the same reason: the ATT&CK lookup matches on cwe alone.
accelerated_fields.cwe = {"cwe": 1, "gen": 1}

# ATT&CK tactics: fifteen rows. No acceleration -- an index on a collection
# this small costs more to maintain than the scan it would save.
[riskability_tactics]
enforceTypes = false
replicate = false

# Current inventory state for the paths that findings care about.
#
# This replaces a "join type=left hostname package path" whose subsearch had to
# return one row per (host, package, path) in the whole fleet. Measured at
# 7,266 rows per host, so Splunk's 50,000-row join subsearch cap was breached at
# about SEVEN hosts -- and it truncates silently, leaving current_version null,
# which the lifecycle then reads as "removed". Open vulnerabilities would have
# disappeared from the dashboards on any real fleet.
#
# A KV Store lookup has no subsearch cap and is indexed on the join key.
[riskability_invstate]
enforceTypes = false
replicate = false
accelerated_fields.hostpkg = {"hostname": 1, "package": 1, "path": 1}

# When each host last reported inventory. One row per host, so this is small
# whatever the fleet size -- but it replaced a join for the same reason: the
# subsearch cap applies regardless of how few rows come back, and a lookup is
# cheaper than a subsearch every time.
[riskability_hoststate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

# The computed lifecycle of every finding, one row each.
#
# Dashboards read this rather than recomputing from the findings index, for two
# reasons. Cost: the computation is a stats over every finding event ever
# written, and paying for it on every panel load, for every user, is the thing
# this app was already getting wrong. Correctness: the lifecycle is only right
# when it sees ALL history -- first_seen and "mitigated" are meaningless over a
# 24-hour window -- and a dashboard panel inherits whatever time range the page
# has, which is not something a security number should depend on.
# Several fields on this collection are written only for findings in a
# particular state: kev_added, kev_due and kev_ransomware only for CVEs on the
# CISA KEV list, mitigation only where a fixed version was seen, archived only
# once a finding has aged out, and accepted, exception_key and
# exception_expires_at only for an accepted risk. A sample of ordinary rows will
# not contain them, which is not the same as them being unused. Said here so a
# future audit does not mistake a rare field for a dead one and remove it.
[riskability_findings_state]
enforceTypes = false
replicate = false
accelerated_fields.status = {"status": 1, "confidence": 1}
accelerated_fields.host = {"hostname": 1}
accelerated_fields.cve = {"cve_id": 1}

# What the matcher has already done, per host.
#
# The hourly match cost is O(fleet) whether or not anything changed, and on a
# fleet that is not being patched every hour almost nothing does. This holds a
# content digest of each host's inventory alongside the feed generation and
# matcher version it was last matched against; a host is re-matched only when
# one of those three differs. That turns the hourly cost into O(hosts that
# changed), which is the difference between a job that finishes and one that
# overruns its own schedule.
#
# The generation and matcher version are in the key deliberately: a new feed
# can make a previously clean package vulnerable without the host changing at
# all, and a comparator fix can change the verdict without either changing.
[riskability_matchstate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

# The risk-exception register: decisions people have made about findings.
#
# Deliberately separate from riskability_findings_state. That collection is a
# claim about the world -- what is installed, what the feed says, what the
# matcher concluded. This one is a claim about US: that a risk is understood
# and handled another way. Folding the two together loses the ability to say
# "this was accepted, and then they upgraded it anyway", which is the only
# interesting sentence in the pair.
#
# NOT the old riskability_suppressions, which is left dead on purpose: it keys
# on advisory_id, and which advisory wins the authority contest changes between
# feeds, so an exception written against a GHSA silently stops applying when a
# distro advisory takes over. Findings are identified by CVE for the same
# reason, and so are exceptions.
[riskability_exceptions]
enforceTypes = false
replicate = false
accelerated_fields.match = {"match_key": 1}
accelerated_fields.scope = {"cve_id": 1, "hostname": 1}
accelerated_fields.state = {"revoked_at": 1, "expires_at": 1}

# Component counts per host per ecosystem, refreshed hourly.
#
# The Hosts page draws this as a chart, and it defaults to the whole fleet. Read
# from the inventory index that chart costs one event per component per scan per
# host -- fine for two hosts, and the first thing to fall over at five thousand.
# One row per host per ecosystem is a few tens of thousands of rows at that size.
[riskability_hostecostate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

# One row per host: what its open findings add up to.
#
# The Hosts page and the exception register both used to compute these numbers
# in a `join` subsearch over the whole finding state. A join subsearch is
# bounded at 50,000 rows and 60 seconds, and neither bound announces itself --
# the Hosts grid then does `fillnull value=0`, so a host whose row was dropped
# renders as "0 open findings, 0 CVEs, 0 KEV". A clean bill of health for a
# machine nobody counted. These are read with a `lookup` now, which has no
# subsearch bound at all.
[riskability_openstate_host]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

# One row per exception: how many findings and hosts it actually covers.
#
# Written by the reconciler, which is already reading exactly these rows to
# decide which findings are accepted. Counting them there is free; counting them
# again at read time was a second full scan of the finding state inside a join.
[riskability_exception_counts]
enforceTypes = false
replicate = false
accelerated_fields.key = {"exception_key": 1}

# Open findings summarised along one dimension at a time.
#
# Fleet-wide dashboards aggregate over every open finding -- distinct CVEs by
# package, findings by confidence, age percentiles by severity. Each of those is
# a full read of the finding state, and an inputlookup is single-threaded on the
# search head, so at twelve million rows that is minutes per panel on any
# hardware. Reading a few thousand pre-computed rows instead is the only thing
# that changes the shape rather than the constant.
#
# One row per (dim, value). Written once an hour by a single pass over the
# collection, using multireport so all the dimensions come out of one read
# rather than one read each.
[riskability_openstate_dim]
enforceTypes = false
replicate = false
accelerated_fields.dim = {"dim": 1, "value": 1}

# Open findings per host, summarised along one dimension at a time.
#
# The fleet-wide version cannot answer a per-host question: distinct CVEs on one
# host is not derivable from a fleet total. One row per (hostname, dim, value),
# which is a few tens of rows per host rather than a few thousand findings.
[riskability_openstate_host_dim]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1, "dim": 1}

# One row per open CVE, with what carries it and how exposed it is.
#
# Distinct-CVE questions are the most common shape on these dashboards and the
# CVE catalogue is tens of thousands of rows where the finding state is
# millions. Note this stores a COUNT of hosts, not their names: a CVE on five
# thousand machines would otherwise carry five thousand values, and the
# collection would be larger than the thing it summarises.
[riskability_openstate_cve]
enforceTypes = false
replicate = false
accelerated_fields.cve = {"cve_id": 1}
accelerated_fields.kev = {"kev_added": 1}

# What is listening on each host, and which package answers it.
#
# One row per (host, port, package): a port served by three packages gets three
# rows, so a finding can be joined to it on package alone. A port with nothing
# attributed still gets a row -- an unattributed listener is a gap in what the
# app can see, not an absence of risk, and dropping it would hide it entirely.
[riskability_exposure]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}
accelerated_fields.pkg = {"package": 1}

# Containers seen on each host, running and stopped, with the image behind them.
[riskability_containers]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}
accelerated_fields.image = {"image_ref": 1}

# How far the network reaches each package, one row per (host, package).
#
# riskability_exposure holds one row per PORT, and a package bound to both
# 0.0.0.0:22/tcp and [::]:22/tcp6 matches two documents. A Splunk lookup that
# matches more than one document returns every output field as MULTIVALUE, and
# an eval comparing a multivalue field to a string is false -- so the finding
# would come back classified "no listening port" while the service answers the
# internet. That is the one direction this app must never fail in, so the
# collapse to one row happens here, once, where it can be seen and tested.
[riskability_reach]
enforceTypes = false
replicate = false
accelerated_fields.hostpkg = {"hostname": 1, "rk_key": 1}

# Per host: was exposure assessed at all. Without this, a host whose collector
# is too old to report exposure would have every finding land in the calmest
# row on the matrix purely because no data arrived.
[riskability_exposure_hoststate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

# The CVE encyclopaedia: one row per CVE, holding what the CVE Program's own
# record says. Description text and product names, which no distro advisory
# carries and which is the difference between an id with a score and a page a
# person can read.
#
# The largest collection by bytes and the smallest by rows read: a page renders
# exactly one row, and nothing aggregates over it. That shape argued for a
# local file, and a local file is why it is not one. var/ is replicated
# nowhere, so on a search head cluster every member would need its own copy,
# built by its own command, with nothing to reconcile them and no way to tell
# from a search which member answered. Here the KV Store distributes it the
# same way it distributes the rest of the feed: import once, replicated,
# consistent.
#
# _key is the CVE id, so a lookup is a primary key hit and a re-import cannot
# produce two rows for one CVE.
[riskability_cvedetail]
enforceTypes = false
replicate = false

# What each binary actually loads, from swinv's ELF DT_NEEDED reading (schema
# 1.11, --ndjson-include links). One row per (host, root, executable, library).
# Raw grain: the panel that names the loading executable reads this. Findings
# never join it directly -- a package loaded by two executables is two documents,
# and a Splunk lookup matching more than one returns multivalue, which is how
# riskability_exposure once reported a listening service as "no listening port".
# The collapsed form findings do join: one row per (host, scope, package), with
# the loaders capped and listening ones kept first. Same relationship to
# riskability_links that riskability_reach has to riskability_exposure.
[riskability_loaded]
enforceTypes = false
replicate = false
accelerated_fields.key = {"_key": 1}

# Whether link data was collected for a host at all. Link records are ELF only,
# absent on Windows, and suppressed by --heartbeat on an unchanged scan. Without
# this, a host nobody measured is indistinguishable from a host where nothing
# loads a vulnerable library, and the second reading is the calm one.
[riskability_links_hoststate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

# What the collector said it found, from swinv's heartbeat manifest. Kept so the
# app can compare the counts a host reported against the rows that actually
# reached the index. That comparison is the only thing that can catch a
# transport or parsing layer losing data: every layer reports success, and a
# host whose scan wrote 3,993 components arrives as 15 with nothing complaining.
[riskability_scanstate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

# One row per host: how many state rows the last fold wrote for that host's
# latest match run. Exists so the acknowledgement can read a thousand-host
# answer from a thousand-row collection. It used to derive the same numbers
# with a join whose subsearch read the whole findings state collection --
# 4M rows at a thousand hosts, ~120 seconds at the measured 30 microseconds
# a row, against a 60 second subsearch cap that finalises silently. The job
# that decides whether closing may proceed must not run on a partial count.
[riskability_foldstate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

# MITRE CTID's KEV to ATT&CK mapping: one row per known-exploited CVE and the
# technique that exploits it. Feed sized, not fleet sized: about 1,200 rows for
# the whole KEV catalogue regardless of how many hosts run. Replicated with the
# rest of the feed so a search head cluster serves it consistently.
[riskability_kevmap]
enforceTypes = false
replicate = false
accelerated_fields.cve = {"cve_id": 1}
accelerated_fields.tech = {"technique": 1}

# CAPEC prose: prerequisites, first execution step, likelihood and severity, one
# row per attack pattern. Feed sized, about 559 rows, joined to findings through
# the via_capec ids the attack rows already carry.
[riskability_capec]
enforceTypes = false
replicate = false
accelerated_fields.capec = {"capec": 1}

# ATT&CK mitigations: one row per (technique, mitigation) with MITRE's technique
# specific description. Feed sized, about 400 rows.
# Microsoft's statement of the current Windows build, one row per (KB, branch,
# edition). Feed sized rather than fleet sized: about twenty rows a month, so a
# two year history is a few hundred rows however many Windows hosts there are.
# Keyed on branch AND edition because Windows 11 24H2 and Windows Server 2025
# are both build 26100 and their UBR ranges are twenty four thousand apart.
# Where each Windows host sits against the feed's statement of the current
# build. One row per Windows host that reports a cumulative update.
# Each host's own reporting rhythm, learned from its contacts. One row per host.
#
# The app used to judge silence against one number for the whole fleet, seven
# days, and that number cannot be right for everybody at once: a machine scanned
# hourly is broken after two days, and a machine scanned only when somebody
# changes it is behaving perfectly after two months. Judging both by seven days
# is not a compromise, it is wrong for both.
#
# So a host is judged against itself. The intervals between its own contacts are
# recorded, and it is late when it exceeds its own p95 by a wide margin. A host
# with fewer than three observed intervals has no rhythm yet and is never
# alarmed on, because guessing at one is how a dashboard teaches its reader that
# red means nothing.
[riskability_hostcadence]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

[riskability_winstate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}

[riskability_winpatch]
enforceTypes = false
replicate = false
accelerated_fields.branch = {"branch": 1, "edition": 1, "ubr": -1}

# Per component support status, rebuilt hourly from inventory and lifecycles.
[riskability_eolstate]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}
accelerated_fields.prod = {"product": 1, "past_eol": -1}

# Support lifecycles, one row per product release series. Read by product and
# cycle, which is how the matcher joins an installed version to its series.
[riskability_lifecycle]
enforceTypes = false
replicate = false
accelerated_fields.product = {"product": 1, "cycle": 1}

[riskability_mitigations]
enforceTypes = false
replicate = false
accelerated_fields.tech = {"technique": 1}
accelerated_fields.mit = {"mitigation": 1}

# The ATT&CK matrix, precomputed. One row per (technique, tactic, map_source,
# reach_class, confidence) with the distinct open CVEs and hosts behind it. The
# expensive part, reading every open finding and expanding CWE to technique, runs
# once an hour in a scheduled search rather than on every dashboard load, so the
# page stays fast at a thousand hosts. Bounded by the technique catalogue crossed
# with the mapping sources and the reach classes, a few thousand rows, not by the
# fleet. The matrix reads this; a single host drilldown still computes live
# because one host is small.
[riskability_techstate]
enforceTypes = false
replicate = false
accelerated_fields.tech = {"technique": 1}
accelerated_fields.src = {"map_source": 1}

# The ATT&CK denominator ledger: one row per confidence band with the unique
# open CVE counts behind the matrix headline. Written by the same hourly cadence
# as the placement rollup, so the caption that quotes it can never disagree with
# the grid, and read as two rows rather than recomputed per page load.
[riskability_attack_ledger]
enforceTypes = false
replicate = false

# The host configuration surface: cron, systemd services and timers, SUID and
# SGID binaries, and the ATT&CK technique each mechanism is the surface for. One
# row per (host, mechanism). This is a different class of fact from a
# vulnerability finding: it is what the host is configured to run, not a flaw in
# a package, and it lights persistence and privilege techniques the CVE chain can
# never reach. n_evidence is swinv's own count of weakness evidence on the
# mechanism, trusted rather than re-derived, because swinv knows the context an
# outside join does not, such as a binary being SUID inside a snap.
[riskability_config]
enforceTypes = false
replicate = false
accelerated_fields.host = {"hostname": 1}
accelerated_fields.tech = {"attack": 1}

# The AI pipeline's user-facing state: exactly one row, _key="ai_enabled",
# carrying {"enabled": "1"|"0"}.
#
# Why the enabled bit is mirrored here rather than read from
# riskability_ai.conf: conf files are admin-tier resources over REST, and the
# one caller of this collection is /riskability/ai_status -- the endpoint
# every signed-in user's AI page asks. A normal user reading a conf file gets
# a 403, which would leave the AI page unable to load precisely for the users
# it exists for. The KV Store collection is governed by the same meta
# permissions as the findings state: readable by everyone, writable only by
# admins. The admin endpoint rewrites this row whenever the master switch
# moves, so conf and collection cannot disagree for longer than one save.
#
# replicate = false, like every other collection in this file. replicate does
# not mean "shared between search head cluster members" -- SHC replication of
# the KV Store is automatic and is not configured here. It means "bundled out
# to the indexers for distributed lookups", and nothing on an indexer reads
# this row: the one consumer is a REST handler on the search head.
[riskability_aistate]
enforceTypes = false
replicate = false

# The verdict cache: one row per analysed CVE, keyed by a content signature
# of its inputs (riskability/ai_config.verdict_sig). The queue consumer
# upserts verdicts here and serves cache hits from here, which is what makes
# steady-state model cost near zero: a CVE is sent to the model only when a
# signal that could change its verdict actually changed.
#
# replicate = false, and the reason matters more here than for the state row
# above. Every consumer of this cache sits downstream of
# `riskability_open_findings`, which is an inputlookup: a search-head-local
# generating command, so the lookups against this collection never execute on
# an indexer and a replicated copy would never be read. What replication WOULD
# do is copy the whole cache into the knowledge bundle and push it to every
# indexer, growing without bound as the cache fills, onto filesystems where
# this app's metadata permissions do not apply. An earlier comment here said
# it was "replicated like the other pipeline state"; there is no other
# replicated pipeline state, and that is not what the setting does.
[riskability_aiverdicts]
enforceTypes = false
replicate = false

# Vendor per package name, one row per distinct piece of software in the
# fleet. Vendor is a property of the software, not of the host that has it,
# so this is keyed by name alone and stays small: hundreds of rows, not
# hundreds of thousands.
#
# It exists because the AI page could name a CVE and not the thing the CVE is
# in. The inventory carries vendor ("Microsoft Corporation"), the matcher's
# findings state does not, and the verdict cache is built from the findings
# state, so the one field that answers "whose software is this" was being
# dropped two steps before anybody could read it.
[riskability_vendor]
enforceTypes = false
replicate = false
