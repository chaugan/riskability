# Latest inventory state per host. Raw inventory is append-only: every scan
# re-reports every component, so a naive search over 30 days multiplies the
# fleet by the number of scans. Always reduce to latest state first.
[riskability_latest_inventory]
definition = index=riskability_inventory sourcetype=riskability:swinv | stats latest(version) AS version latest(purl) AS purl latest(type) AS type latest(os_id) AS os_id latest(os_version_id) AS os_version_id latest(_time) AS scanned_at BY hostname, name, type
iseval = 0

[riskability_findings]
definition = index=riskability_findings sourcetype=riskability:findings
iseval = 0

# Feed age in days, for the staleness banner. An air-gapped feed is only as
# good as the last upload, so every dashboard surfaces this.
[riskability_feed_age]
definition = | inputlookup riskability_feedstate_lookup | eval age_days = round((now() - imported_at)/86400, 1)
iseval = 0
