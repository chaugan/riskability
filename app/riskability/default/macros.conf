# Latest inventory state per host. Raw inventory is append-only: every scan
# re-reports every component, so a naive search over 30 days multiplies the
# fleet by the number of scans. Always reduce to latest state first.
#
# locations is carried through deliberately: riskabilitymatch uses it to work
# out which filesystem root a component belongs to, and without it a package
# inside /snap/core18 is matched against the host's distro release.
#
# Grouping includes the install path. One host legitimately carries the same
# package name at several versions in several roots -- this fleet has four
# distinct openssl installs on one machine -- and grouping by name alone keeps
# only the newest, hiding the vulnerable copies entirely. It is also what makes
# per-path remediation tracking possible: "the copy under /srv/app was
# upgraded" is only expressible if the path is part of the identity.
#
# cpes is flattened to a space-separated cpe_list for the same reason path is:
# a JSON array becomes a Splunk multivalue field, and a multivalue field does
# not survive the search-command protocol as a Python list. Windows software
# has no PURL and is matched purely on its CPEs, so dropping them here means
# every Windows host reports zero findings -- silently, and looking exactly
# like a clean bill of health.
#
# path is coalesced to "" because stats DISCARDS any row whose BY field is
# null. Not every component has a location -- Windows hotfixes never do, and
# 273 components on a real Windows host had none -- so without the coalesce
# they vanish before matching, silently and with no error. That removed every
# hotfix, which is precisely the data Windows patch assessment depends on.
[riskability_latest_inventory]
definition = index=riskability_inventory sourcetype=riskability:swinv | eval path = coalesce(mvindex(locations, 0), ""), cpe_list = mvjoin(cpes, " ") | stats latest(version) AS version latest(purl) AS purl latest(locations) AS locations latest(cpe_list) AS cpe_list latest(os_id) AS os_id latest(os_version_id) AS os_version_id latest(vendor) AS vendor latest(_time) AS scanned_at BY hostname, name, type, path
iseval = 0

[riskability_findings]
definition = index=riskability_findings sourcetype=riskability:findings
iseval = 0

# Feed age in days, for the staleness banner. An air-gapped feed is only as
# good as the last upload, so every dashboard surfaces this.
#
# The collection holds a second row tracking import progress, which has no
# imported_at. Without filtering it out, a single-value panel gets two rows and
# renders whichever it reaches first.
#
# The definition deliberately omits its leading pipe: a generating macro must
# be invoked as  | `riskability_feed_age`  and if the definition also carried a
# pipe the expansion would be "| | inputlookup", which parses as nothing.
[riskability_feed_age]
definition = inputlookup riskability_feedstate_lookup | where isnotnull(imported_at) | eval age_days = round((now() - imported_at)/86400, 1)
iseval = 0

# ---------------------------------------------------------------------------
# Finding lifecycle
# ---------------------------------------------------------------------------
# Findings are materialised once per scheduled run, so the findings index is
# append-only and the same vulnerability appears once per run it was present
# in. Two things follow, and both are what these macros exist for.
#
# 1. DEDUPLICATION. A host scanned hourly for a week produces ~168 copies of an
#    unfixed finding. Every view must collapse them by finding_key, which is
#    stable across runs precisely because it excludes the installed version.
#
# 2. MITIGATION. A finding that stops appearing has NOT necessarily been fixed
#    -- the scan may have failed, the host may have gone away, or the feed may
#    have been re-imported without that ecosystem. Silently dropping it would
#    report a broken pipeline as an improvement. So a closed finding is
#    classified by what the current inventory says about that exact path:
#      mitigated  the package is still installed there at a different version
#      removed    the package is no longer installed at that path
#      unknown    the host has not reported since, so nothing can be concluded

# Every finding ever recorded, collapsed to one row each, with lifecycle state.
[riskability_finding_lifecycle]
definition = index=riskability_findings sourcetype=riskability:findings \
| stats min(scan_time) AS first_seen, max(scan_time) AS last_seen, \
        earliest(installed_version) AS first_version, latest(installed_version) AS last_version, \
        latest(cve_id) AS cve_id, latest(hostname) AS hostname, latest(package) AS package, \
        latest(ecosystem) AS ecosystem, latest(path) AS path, latest(scope_id) AS scope_id, \
        latest(fixed_version) AS fixed_version, latest(confidence) AS confidence, \
        latest(match_authority) AS match_authority, latest(severity) AS severity, \
        latest(epss) AS epss, latest(kev_added) AS kev_added, latest(title) AS title, \
        count AS times_seen \
        BY finding_key \
| join type=left hostname \
    [| search index=riskability_inventory sourcetype=riskability:swinv \
     | stats max(_time) AS host_last_scan BY hostname] \
| eval is_current = if(last_seen >= host_last_scan - 300, 1, 0) \
| join type=left hostname package path \
    [| search index=riskability_inventory sourcetype=riskability:swinv \
     | eval path = mvindex(locations, 0) \
     | stats latest(version) AS current_version BY hostname, name, path \
     | rename name AS package] \
| eval status = case( \
      is_current == 1, "open", \
      isnull(host_last_scan), "unknown", \
      isnotnull(current_version) AND current_version != last_version, "mitigated", \
      isnotnull(current_version), "open", \
      1=1, "removed") \
| eval mitigation = if(status=="mitigated", last_version . " -> " . current_version, null()) \
| eval age_days = round((now() - first_seen)/86400, 1)
iseval = 0

# Just the findings that are still present on their host as of its latest scan.
[riskability_open_findings]
definition = `riskability_finding_lifecycle` | where status="open"
iseval = 0

# Findings that were real and are now fixed, with the version change that fixed
# them. This is the evidence that remediation actually happened, as opposed to a
# finding merely disappearing from a report.
[riskability_mitigated_findings]
definition = `riskability_finding_lifecycle` | where status="mitigated"
iseval = 0

# ---------------------------------------------------------------------------
# MITRE ATT&CK
# ---------------------------------------------------------------------------
# Open findings joined through to ATT&CK techniques:
#   finding -> CVE -> CWE (from NVD) -> CAPEC -> technique (both from MITRE).
#
# The advisory lookup stores cwes as a multi-value field, which arrives from
# the KV Store as a comma-joined string, so it is split and expanded before the
# join. A finding whose CVE has no recorded CWE drops out here -- which is why
# the dashboard shows mapping coverage next to the results rather than
# presenting the mapped subset as if it were everything.
#
# cwes is coalesced to "" before splitting because mvexpand does not merely
# return nothing when the field is absent from every row -- it fails the whole
# search with "Field 'cwe' does not exist in the data". Most CVEs have no
# recorded CWE, so a host whose open findings happen to include none would
# break the dashboard rather than show an empty panel.
# The CWEs of every open finding, one row per finding per CWE.
#
# Split out so the ATT&CK mapping and the CWE chart cannot drift apart: they
# had, and the chart's inline copy was missing a fix the macro already carried.
#
# mvjoin before split is the part that is easy to get wrong and expensive to
# get wrong quietly. The feed holds one advisory row per CVE per ecosystem --
# 487,042 rows covering 438,868 CVEs, up to 18 for a single CVE -- so a CVE
# present in both Ubuntu and Debian returns *several* rows from the lookup and
# cwes arrives multivalue. split() expects a string and does not do anything
# useful with a multivalue field, so every such finding was silently dropped:
# of 1,252 open findings whose CVE has a recorded CWE, only the 34 with exactly
# one advisory row survived. The dashboard did not error -- it just showed
# almost nothing, which is the worst way for this to fail, because an empty
# ATT&CK panel reads as "no exposure".
#
# mvjoin flattens the rows back to one comma-separated string (each value is
# itself a comma-joined list), split re-splits it, mvdedup drops the copies the
# duplicate rows introduce.
[riskability_finding_cwes]
definition = `riskability_open_findings` \
| lookup riskability_advisory_lookup cve_id OUTPUT cwes \
| eval cwe = mvdedup(split(coalesce(mvjoin(cwes, ","), "") . ",__none__", ",")) \
| mvexpand cwe \
| eval cwe = trim(cwe) \
| where cwe!="" AND cwe!="__none__"
iseval = 0

# One row per finding per ATT&CK technique.
#
# The expansion below looks laborious and every part of it is load-bearing.
# A CWE maps to many techniques -- CWE-770 alone reaches six -- so the lookup
# returns technique and technique_name as parallel multivalue fields. Feeding
# those straight into "stats BY technique, technique_name" makes Splunk group
# by each field independently, which is a cross product: T1498.001 was being
# displayed as "Endpoint Denial of Service" (T1499's name) rather than its own
# "Network Denial of Service: Direct Network Flood", and 113 techniques showed
# up carrying as many as 44 names each. Wrong names on a security dashboard are
# worse than missing ones, because they are quietly believable.
#
# mvzip pairs the two lists positionally before mvexpand, so a technique can
# only ever be split apart alongside its own name. via_capec is deliberately
# NOT zipped in: the lookup collapses duplicate CAPEC ids, so it is not always
# the same length as the other two (191 of 602 rows differ), and zipping it
# would silently shift CAPEC ids onto the wrong techniques. It is re-fetched
# after the expansion, keyed on the exact cwe/technique pair.
#
# Field names here must not begin with an underscore: Splunk treats those as
# internal and mvexpand/table drop them, which fails as an empty panel.
[riskability_attack_surface]
definition = `riskability_finding_cwes` \
| lookup riskability_attack_lookup cwe OUTPUT technique, technique_name \
| where isnotnull(technique) AND technique!="" \
| eval tpair = mvzip(technique, technique_name, "|@|") \
| mvexpand tpair \
| eval technique = mvindex(split(tpair, "|@|"), 0) \
| eval technique_name = mvindex(split(tpair, "|@|"), 1) \
| fields - tpair \
| lookup riskability_attack_lookup cwe technique OUTPUT via_capec, tactics
iseval = 0

# One row per finding per technique per ATT&CK tactic, for the matrix.
#
# Kept separate from riskability_attack_surface because a technique can belong
# to several tactics: expanding here would double-count every technique on
# every panel that only cares about techniques. The matrix wants that
# duplication -- a technique genuinely occupies several matrix columns -- and
# nothing else does.
#
# Same mvjoin-before-split defence as riskability_finding_cwes: tactics can
# arrive multivalue if more than one row shares a cwe/technique pair, and
# split() would silently drop those rows.#
# The ",__none__" sentinel is not decoration. coalesce(...,"") is not enough on
# its own because split("", ",") returns NULL rather than one empty value, so
# when NO row has the field the eval creates nothing and mvexpand fails the
# entire search with "Field 'x' does not exist in the data" -- the exact error
# the ATT&CK matrix showed on a feed with no tactics. Appending a sentinel
# guarantees the string is never empty, so the field always exists; the
# sentinel is then dropped along with the empties.
[riskability_attack_matrix]
definition = `riskability_attack_surface` \
| eval tactic = mvdedup(split(coalesce(mvjoin(tactics, ","), "") . ",__none__", ",")) \
| mvexpand tactic \
| eval tactic = trim(tactic) \
| where tactic!="" AND tactic!="__none__" \
| lookup riskability_tactic_lookup tactic OUTPUT tactic_name, tactic_order
iseval = 0
