# Latest inventory state per host. Raw inventory is append-only: every scan
# re-reports every component, so a naive search over 30 days multiplies the
# fleet by the number of scans. Always reduce to latest state first.
#
# locations is carried through deliberately: riskabilitymatch uses it to work
# out which filesystem root a component belongs to, and without it a package
# inside /snap/core18 is matched against the host's distro release.
#
# Grouping includes the install path. One host legitimately carries the same
# package name at several versions in several roots -- this fleet has four
# distinct openssl installs on one machine -- and grouping by name alone keeps
# only the newest, hiding the vulnerable copies entirely. It is also what makes
# per-path remediation tracking possible: "the copy under /srv/app was
# upgraded" is only expressible if the path is part of the identity.
#
# cpes is flattened to a space-separated cpe_list for the same reason path is:
# a JSON array becomes a Splunk multivalue field, and a multivalue field does
# not survive the search-command protocol as a Python list. Windows software
# has no PURL and is matched purely on its CPEs, so dropping them here means
# every Windows host reports zero findings -- silently, and looking exactly
# like a clean bill of health.
#
# path is coalesced to "" because stats DISCARDS any row whose BY field is
# null. Not every component has a location -- Windows hotfixes never do, and
# 273 components on a real Windows host had none -- so without the coalesce
# they vanish before matching, silently and with no error. That removed every
# hotfix, which is precisely the data Windows patch assessment depends on.
# Each host's MOST RECENT scan, not a union of every scan in the window.
#
# swinv writes one record per component per scan, and each scan is a complete
# statement of what is installed. Grouping by (host, name, type, path) across a
# thirty-day window therefore keeps every component that has EVER appeared:
# uninstall a package and its row survives, with its last known version, and the
# app goes on reporting vulnerabilities against software that is not there.
#
# Measured on a real pair of scans nine hours apart: 24,591 components tracked
# against 23,131 actually present -- 1,460 ghosts, mostly an npm tree that had
# been deleted.
#
# Worse than the count is that nothing could correct it. The close job decides a
# package is gone by finding no current_version in riskability_invstate, and
# invstate is built from this same macro -- so the ghost supplied its own alibi
# and "uninstalled" was unreachable.
#
# Every event of one scan shares its scanned_at, so a host's newest scan is
# exactly one timestamp: verified, two scans per host on this instance, two
# distinct _time values. A host with no events in the window is absent either
# way, so this narrows what is considered without changing which hosts appear.
#
# Heartbeats are excluded, and that exclusion is load-bearing rather than
# tidiness. A heartbeat is one record per host per scan and a full component
# list is sent only when something changes, so once the collector emits them the
# newest event for almost every host is a heartbeat -- and "the newest scan"
# would resolve to that single row, discarding the entire component list. Caught
# on this instance because a test heartbeat was sitting in the index: the host
# went from 7,745 components to one. Downstream that is invstate emptying and
# the close job marking every finding on the host uninstalled.
#
# NOT record_type=* rather than naming each kind. A component record is the one
# that carries no record_type at all, and the stream now also carries
# heartbeats, exposure rows and container rows -- so an exclusion list would
# have to be extended every time the collector learns to report something new,
# and forgetting would silently make that new record the host's "newest scan"
# and wipe its inventory. Excluding everything that IS tagged inverts the
# question into one that stays correct as the collector grows.
#
# NOT record_type=* rather than record_type!="...": in a raw search the second
# form matches only events that HAVE the field, so it would have discarded every
# component record instead.
[riskability_latest_inventory]
definition = sourcetype=riskability:swinv index=`riskability_index_inventory` NOT record_type=* | eval path = coalesce(mvindex(locations, 0), ""), cpe_list = mvjoin(cpes, " ") | eventstats max(_time) AS rk_newest_scan BY hostname | where _time >= rk_newest_scan | eval root = coalesce(root, "") | stats latest(version) AS version latest(purl) AS purl latest(locations) AS locations latest(cpe_list) AS cpe_list latest(os_id) AS os_id latest(os_version_id) AS os_version_id latest(vendor) AS vendor latest(_time) AS scanned_at BY hostname, name, type, path, root
iseval = 0

[riskability_findings]
definition = sourcetype=riskability:findings index=`riskability_index_findings`
iseval = 0

# Feed age in days, for the staleness banner. An air-gapped feed is only as
# good as the last upload, so every dashboard surfaces this.
#
# The collection holds a second row tracking import progress, which has no
# imported_at. Without filtering it out, a single-value panel gets two rows and
# renders whichever it reaches first.
#
# The definition deliberately omits its leading pipe: a generating macro must
# be invoked as  | `riskability_feed_age`  and if the definition also carried a
# pipe the expansion would be "| | inputlookup", which parses as nothing.
[riskability_feed_age]
definition = inputlookup riskability_feedstate_lookup | where isnotnull(imported_at) | eval age_days = round((now() - imported_at)/86400, 1)
iseval = 0

# ---------------------------------------------------------------------------
# Finding lifecycle
# ---------------------------------------------------------------------------
# Findings are materialised once per scheduled run, so the findings index is
# append-only and the same vulnerability appears once per run it was present
# in. Two things follow, and both are what these macros exist for.
#
# 1. DEDUPLICATION. A host scanned hourly for a week produces ~168 copies of an
#    unfixed finding. Every view must collapse them by finding_key, which is
#    stable across runs precisely because it excludes the installed version.
#
# 2. MITIGATION. A finding that stops appearing has NOT necessarily been fixed
#    -- the scan may have failed, the host may have gone away, or the feed may
#    have been re-imported without that ecosystem. Silently dropping it would
#    report a broken pipeline as an improvement. So a closed finding is
#    classified by what the current inventory says about that exact path:
#      mitigated  the package is still installed there at a different version
#      removed    the package is no longer installed at that path
#      unknown    the host has not reported since, so nothing can be concluded

# Every finding ever recorded, collapsed to one row each, with lifecycle state.
#
# The two lookups below were "join type=left" subsearches, and they did not
# scale -- not slowly, but wrongly. The package/path join had to return one row
# per (host, package, path) in the fleet: measured at 7,266 rows per host, so
# Splunk's 50,000-row join subsearch cap was reached at about SEVEN hosts.
# Splunk truncates a subsearch silently, so beyond that current_version came
# back null for most findings and the case() below classified them "removed".
# Open vulnerabilities would have vanished from every dashboard, with no error
# anywhere -- the worst failure this app could have.
#
# KV Store lookups have no subsearch cap, are indexed on the join key, and are
# populated hourly by the two "snapshot" scheduled searches. Those build the
# state in ONE pass over both indexes rather than a subsearch, so they have no
# cap either.
#
# is_current compares the MATCH RUN that produced a finding against when its
# host was last matched -- not the host's scan time, which is a different clock
# entirely. scan_time is when the inventory was collected on the host, so a
# finding written now can carry a timestamp from fourteen hours ago; comparing
# that against a match time made every finding look stale the moment the two
# clocks diverged, and 4,781 open findings were reported as removed.
#
# The predicate used to compare against when its host was last SCANNED, not
# matched. Those were the same thing only while every host was
# re-matched every hour. Once unchanged hosts are skipped, a scan-based
# predicate marks their still-open findings as not-current an hour later and
# they fall through to the removed branch -- measured: 4,847 open became 4,760
# open, 21 removed and 87 unknown, all wrong. Against the last match it is right
# in every case: a skipped host keeps its old matched_at, so its findings still
# look current; a host that was matched and no longer reports a finding has one
# older than its matched_at, and the invstate lookup then decides whether the
# package was upgraded or removed.
[riskability_finding_lifecycle]
definition = sourcetype=riskability:findings index=`riskability_index_findings` earliest=0 latest=+10y \
| stats min(scan_time) AS first_seen, max(scan_time) AS last_seen, \
        max(match_run) AS last_match_run, \
        earliest(installed_version) AS first_version, latest(installed_version) AS last_version, \
        latest(cve_id) AS cve_id, latest(hostname) AS hostname, latest(package) AS package, \
        latest(ecosystem) AS ecosystem, latest(path) AS path, latest(scope_id) AS scope_id, \
        latest(scope) AS scope, latest(kev_due) AS kev_due, latest(url) AS url, \
        latest(fixed_version) AS fixed_version, latest(confidence) AS confidence, \
        latest(match_authority) AS match_authority, latest(severity) AS severity, \
        latest(epss) AS epss, latest(kev_added) AS kev_added, latest(title) AS title, \
        count AS times_seen \
        BY finding_key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan \
| lookup riskability_matchstate_lookup hostname OUTPUT matched_at AS host_last_matched \
| eval rk_run = coalesce(last_match_run, last_seen) \
| eval is_current = if(isnull(host_last_matched) OR rk_run >= host_last_matched - 300, 1, 0) \
| lookup riskability_invstate_lookup hostname, package, path OUTPUT current_version \
| eval status = case( \
      is_current == 1, "open", \
      isnull(host_last_scan), "unknown", \
      isnotnull(current_version) AND current_version != last_version, "mitigated", \
      isnotnull(current_version), "open", \
      1=1, "removed") \
| eval mitigation = if(status=="mitigated", last_version . " -> " . current_version, null()) \
| eval age_days = round((now() - first_seen)/86400, 1)
iseval = 0

# Every finding with its lifecycle state, read from the hourly snapshot.
#
# This is what dashboards use. riskability_finding_lifecycle is the expensive
# computation behind it and is now run only by the scheduled job that fills
# this collection -- a panel that called it directly re-derived the whole
# history on every page load, which is what made Findings take 30 seconds on a
# two-host fleet.
# No leading pipe in the definition, and call sites write "| `macro`".
# Splunk decides whether to prepend "search" from the RAW query text, before
# macros are expanded, so a macro that supplies its own leading pipe produces
# either "search | inputlookup" or "| | inputlookup" depending on how it is
# called. Keeping the pipe at the call site is the form that works in both
# dashboards and saved searches.
[riskability_findings_now]
definition = inputlookup riskability_findings_state_lookup | where isnull(archived)
iseval = 0

# Just the findings that are still present on their host as of its latest scan.
# The filter lives INSIDE inputlookup, not in a following "| where".
#
# Splunk's SPL optimiser hoists a trailing where into the base search, and on a
# generating command that produces nonsense: the dispatched job came out as
#   search (status=CASE("open") inputlookup riskability_findings_state_lookup)
# -- a term search for the words "inputlookup riskability_findings_state_lookup"
# -- which matched nothing and returned zero rows with no error. Every panel
# went blank while the same SPL run through the REST API returned thousands.
#
# An inputlookup where-clause is also filtered by the KV Store itself, against
# the accelerated status index, rather than in the search pipeline.
# Open findings, EXCLUDING accepted risks. This is the default on purpose.
#
# Seventeen panels across six dashboards read this macro, and every one of them
# asserts that what it shows is dangerous. Making the safe reading the default
# means a panel added next year inherits the exclusion without anyone
# remembering to add a filter; making it opt-in would mean the feature is
# correct only until someone forgets. The unsafe read has to be asked for by
# name, below.
#
# The predicate lives inside the inputlookup where-clause rather than a
# trailing "| where": Splunk's optimiser hoists a trailing where into the base
# search and turns a generating command into a term search, and every panel
# goes blank.
#
# The 1 is QUOTED. KV Store holds the flag as a string, and an unquoted
# accepted!=1 matches every row -- so the exclusion silently does nothing while
# reading exactly like it works. Measured: 4,846 rows either way, against 4,844
# with the quotes. A filter that fails open on a security dashboard is worse
# than no filter, because nobody goes looking for it.
[riskability_open_findings]
definition = inputlookup riskability_findings_state_lookup where status="open" AND accepted!="1"
iseval = 0

# Open findings INCLUDING accepted risks. The Findings table only.
#
# Named so that using it is a decision. Anything built on this must show which
# rows are accepted, or it is presenting a decision as a measurement.
[riskability_open_findings_all]
definition = inputlookup riskability_findings_state_lookup where status="open"
iseval = 0

# The accepted-risk pool. Counted on Overview beside the open count, because a
# fleet with no open findings and four hundred accepted ones is not a clean
# fleet, and a headline that cannot tell them apart is the one way this feature
# becomes a lie.
[riskability_accepted_findings]
definition = inputlookup riskability_findings_state_lookup where status="open" AND accepted="1"
iseval = 0

# Everything still held in the state collection, archived rows excluded.
#
# A row stamped "archived" has been written to the archive index and is waiting
# for the worker to delete it. It exists for a few minutes at most, but during
# those minutes it must not appear anywhere: it has already been counted once.
[riskability_findings_live]
definition = inputlookup riskability_findings_state_lookup | where isnull(archived)
iseval = 0

# Findings that were real and are now fixed, with the version change that fixed
# them. This is the evidence that remediation actually happened, as opposed to a
# finding merely disappearing from a report.
[riskability_mitigated_findings]
definition = inputlookup riskability_findings_state_lookup where status="mitigated" | where isnull(archived)
iseval = 0

# ---------------------------------------------------------------------------
# MITRE ATT&CK
# ---------------------------------------------------------------------------
# Open findings joined through to ATT&CK techniques:
#   finding -> CVE -> CWE (from NVD) -> CAPEC -> technique (both from MITRE).
#
# The advisory lookup stores cwes as a multi-value field, which arrives from
# the KV Store as a comma-joined string, so it is split and expanded before the
# join. A finding whose CVE has no recorded CWE drops out here -- which is why
# the dashboard shows mapping coverage next to the results rather than
# presenting the mapped subset as if it were everything.
#
# cwes is coalesced to "" before splitting because mvexpand does not merely
# return nothing when the field is absent from every row -- it fails the whole
# search with "Field 'cwe' does not exist in the data". Most CVEs have no
# recorded CWE, so a host whose open findings happen to include none would
# break the dashboard rather than show an empty panel.
# The CWEs of every open finding, one row per finding per CWE.
#
# Split out so the ATT&CK mapping and the CWE chart cannot drift apart: they
# had, and the chart's inline copy was missing a fix the macro already carried.
#
# mvjoin before split is the part that is easy to get wrong and expensive to
# get wrong quietly. The feed holds one advisory row per CVE per ecosystem --
# 487,042 rows covering 438,868 CVEs, up to 18 for a single CVE -- so a CVE
# present in both Ubuntu and Debian returns *several* rows from the lookup and
# cwes arrives multivalue. split() expects a string and does not do anything
# useful with a multivalue field, so every such finding was silently dropped:
# of 1,252 open findings whose CVE has a recorded CWE, only the 34 with exactly
# one advisory row survived. The dashboard did not error -- it just showed
# almost nothing, which is the worst way for this to fail, because an empty
# ATT&CK panel reads as "no exposure".
#
# mvjoin flattens the rows back to one comma-separated string (each value is
# itself a comma-joined list), split re-splits it, mvdedup drops the copies the
# duplicate rows introduce.
# Per-FINDING expansion, for the drill-down table only.
#
# Costly and self-limiting by nature: one row per finding per CWE, so it grows
# with the fleet. Splunk's mvexpand stops at [mvexpand] max_mem_usage_mb and
# keeps whichever rows arrived first -- an arbitrary subset, silently. Anything
# that aggregates must use riskability_finding_cwes, which expands from the CVE
# side and cannot reach that limit. This one exists because the "findings behind
# this technique" table genuinely needs the individual findings, and it is only
# ever read with a technique already selected.
[riskability_finding_cwes_detail]
definition = `riskability_open_findings` \
| lookup riskability_advisory_lookup cve_id OUTPUT cwes \
| eval cwe = mvdedup(split(coalesce(mvjoin(cwes, ","), "") . ",__none__", ",")) \
| mvexpand cwe \
| eval cwe = trim(cwe) \
| where cwe!="" AND cwe!="__none__"
iseval = 0

# One row per finding per ATT&CK technique.
#
# The expansion below looks laborious and every part of it is load-bearing.
# A CWE maps to many techniques -- CWE-770 alone reaches six -- so the lookup
# returns technique and technique_name as parallel multivalue fields. Feeding
# those straight into "stats BY technique, technique_name" makes Splunk group
# by each field independently, which is a cross product: T1498.001 was being
# displayed as "Endpoint Denial of Service" (T1499's name) rather than its own
# "Network Denial of Service: Direct Network Flood", and 113 techniques showed
# up carrying as many as 44 names each. Wrong names on a security dashboard are
# worse than missing ones, because they are quietly believable.
#
# mvzip pairs the two lists positionally before mvexpand, so a technique can
# only ever be split apart alongside its own name. via_capec is deliberately
# NOT zipped in: the lookup collapses duplicate CAPEC ids, so it is not always
# the same length as the other two (191 of 602 rows differ), and zipping it
# would silently shift CAPEC ids onto the wrong techniques. It is re-fetched
# after the expansion, keyed on the exact cwe/technique pair.
#
# Field names here must not begin with an underscore: Splunk treats those as
# internal and mvexpand/table drop them, which fails as an empty panel.
# Per-FINDING. See riskability_finding_cwes_detail.
[riskability_attack_surface_detail]
definition = `riskability_finding_cwes_detail` \
| lookup riskability_attack_lookup cwe OUTPUT technique, technique_name \
| where isnotnull(technique) AND technique!="" \
| eval tpair = mvzip(technique, technique_name, "|@|") \
| mvexpand tpair \
| eval technique = mvindex(split(tpair, "|@|"), 0) \
| eval technique_name = mvindex(split(tpair, "|@|"), 1) \
| fields - tpair \
| lookup riskability_attack_lookup cwe technique OUTPUT via_capec, tactics
iseval = 0

# One row per finding per technique per ATT&CK tactic, for the matrix.
#
# Kept separate from riskability_attack_surface because a technique can belong
# to several tactics: expanding here would double-count every technique on
# every panel that only cares about techniques. The matrix wants that
# duplication -- a technique genuinely occupies several matrix columns -- and
# nothing else does.
#
# Same mvjoin-before-split defence as riskability_finding_cwes: tactics can
# arrive multivalue if more than one row shares a cwe/technique pair, and
# split() would silently drop those rows.#
# The ",__none__" sentinel is not decoration. coalesce(...,"") is not enough on
# its own because split("", ",") returns NULL rather than one empty value, so
# when NO row has the field the eval creates nothing and mvexpand fails the
# entire search with "Field 'x' does not exist in the data" -- the exact error
# the ATT&CK matrix showed on a feed with no tactics. Appending a sentinel
# guarantees the string is never empty, so the field always exists; the
# sentinel is then dropped along with the empties.
# CVE-side expansion. Everything that aggregates reads this.
#
# The chain used to expand every open FINDING through CWE, then technique, then
# tactic -- three mvexpands over a set that grows with the fleet. Splunk stops
# mvexpand at [mvexpand] max_mem_usage_mb (500 MB by default) and keeps
# whichever rows arrived first: an arbitrary subset, reported as a WARN in the
# job log and rendered by the chart as though it were everything. Measured on
# realistic rows, it stops at 246,100 -- roughly fifty hosts. On the one page
# whose own banner says "a technique missing here is not a technique you are
# safe from", that is the worst failure in the app.
#
# A CWE, a technique and a tactic are properties of the CVE, not of the finding.
# Two thousand hosts carrying the same CVE expand to the same techniques two
# thousand times over. Reducing to one row per CVE first loses nothing and turns
# the input into something that scales with the CVE catalogue -- tens of
# thousands of rows -- rather than with the fleet. It cannot reach the limit.
#
# hostname and package survive as multivalue fields, so dc(hostname) and
# dc(package) downstream still count what they always counted. epss becomes one
# value per CVE rather than one per finding, which is also more correct: EPSS is
# a property of the CVE, and a CVE present on five hundred hosts was previously
# contributing five hundred identical values to every percentile.
[riskability_finding_cwes]
definition = `riskability_open_findings` \
| stats values(hostname) AS hostname, values(package) AS package, \
        values(scope_id) AS scope_id, max(epss) AS epss, \
        count AS rk_findings BY cve_id \
| lookup riskability_advisory_lookup cve_id OUTPUT cwes \
| eval cwe = mvdedup(split(coalesce(mvjoin(cwes, ","), "") . ",__none__", ",")) \
| mvexpand cwe \
| eval cwe = trim(cwe) \
| where cwe!="" AND cwe!="__none__"
iseval = 0

# CVE-side. See riskability_finding_cwes.
[riskability_attack_surface]
definition = `riskability_finding_cwes` \
| lookup riskability_attack_lookup cwe OUTPUT technique, technique_name \
| where isnotnull(technique) AND technique!="" \
| eval tpair = mvzip(technique, technique_name, "|@|") \
| mvexpand tpair \
| eval technique = mvindex(split(tpair, "|@|"), 0) \
| eval technique_name = mvindex(split(tpair, "|@|"), 1) \
| fields - tpair \
| lookup riskability_attack_lookup cwe technique OUTPUT via_capec, tactics
iseval = 0

[riskability_attack_matrix]
definition = `riskability_attack_surface` \
| eval tactic = mvdedup(split(coalesce(mvjoin(tactics, ","), "") . ",__none__", ",")) \
| mvexpand tactic \
| eval tactic = trim(tactic) \
| where tactic!="" AND tactic!="__none__" \
| lookup riskability_tactic_lookup tactic OUTPUT tactic_name, tactic_order
iseval = 0

# Per-host inventory digest, carried alongside every component row.
#
# The digest is a sum of per-row hashes rather than a hash of a concatenated
# list: summing is order-independent, needs no giant intermediate string, and
# changes if any component's name, version or path changes. A length-based
# fingerprint would have been cheaper and wrong -- upgrading 1.2.3 to 1.2.4
# leaves the length identical, and a missed change on a security tool is not a
# performance trade worth making.
# ---------------------------------------------------------------------------
# Inventory heartbeats
#
# swinv can send one small event per host per scan carrying a digest of its
# component list, and send the full component list only when that digest
# changes. The app prefers the heartbeat when it is there and computes the
# digest itself when it is not, so a fleet part-way through the rollout works
# throughout.
#
# Why it matters: the full list is one event per component per scan per host.
# At five thousand hosts of fourteen thousand components scanned hourly that is
# 1.68 billion events a day, and the hourly "which hosts changed" decision reads
# every one of them -- so the incremental matcher sits downstream of a scan that
# is not incremental at all. A heartbeat makes that decision one row per host.
#
# The digest is OPAQUE to the app. It is never recomputed or compared against
# anything but the previous value stored for the same host, so swinv may hash
# however it likes as long as it is stable and changes when the inventory does.
# A host switching from computed to heartbeat digests looks dirty exactly once.
#
# Contract:
#   record_type   "heartbeat"
#   hostname      required
#   digest        required, opaque, stable
#   n_components  required
#   plus the usual host fields, which keep the host snapshot fed
[riskability_host_heartbeat]
definition = sourcetype=riskability:swinv record_type="heartbeat" index=`riskability_index_inventory` \
| stats latest(digest) AS digest, latest(n_components) AS n_components, \
        latest(_time) AS scanned_at BY hostname \
| eval rk_src = "heartbeat"
iseval = 0

# One row per host: the digest of its inventory and how many components it has.
#
# Heartbeat where a host sends one, computed from the component list where it
# does not. Deliberately not `first()` over an append -- that depends on search
# order, and the fallback would win on a whim. The coalesce below states the
# preference outright.
#
# The heartbeat search is written out here rather than calling
# riskability_host_heartbeat, which is the same text. Splunk decides whether to
# prepend an implicit "search" from the first token and does not recognise a
# backtick as one, so a definition opening with a nested macro fails outright
# with "Unknown search command 'sourcetype'".
#
# The same rule applies inside a subsearch, which is why the append below says
# `search` explicitly. Note this is NOT the "search search" trap: that one comes
# from a macro whose own definition starts with the word search, and these
# start with a search TERM.
#
# The heartbeat branch pins its own window rather than inheriting the caller's.
# Seven days back, because the newest heartbeat is the only one that matters and
# a caller's range is about something else entirely. One hour FORWARD, because a
# host whose clock runs fast stamps its heartbeat in the future, and a plain
# latest=now drops it -- so the fleet's least well-managed machines, which are
# exactly the ones worth watching, would quietly stop being re-matched. Found by
# timestamping a test heartbeat ten minutes ahead and watching it vanish from
# the checkpoint while remaining visible to an unbounded search.
#
# Whichever statement about the host is NEWER wins, rather than the heartbeat
# always winning. A host that once sent heartbeats and stopped -- swinv rolled
# back, the feature turned off, the collector replaced -- would otherwise be
# frozen at its last heartbeat digest and never look dirty again, however much
# software changed on it. Nothing would report that; the host would simply stop
# being re-matched until the daily floor came round.
[riskability_host_digest]
definition = sourcetype=riskability:swinv record_type="heartbeat" \
    index=`riskability_index_inventory` earliest=-7d latest=+1h \
| stats latest(digest) AS digest, latest(n_components) AS n_components, \
        latest(_time) AS scanned_at BY hostname \
| eval rk_src = "heartbeat" \
| append \
    [search `riskability_latest_inventory` \
     | eval rk_sig = coalesce(type, "") . "|" . coalesce(name, "") . "|" \
             . coalesce(version, "") . "|" . coalesce(path, "") \
     | eval rk_h = tonumber(substr(md5(rk_sig), 1, 8), 16) \
     | stats sum(rk_h) AS digest, count AS n_components, max(scanned_at) AS scanned_at \
             BY hostname \
     | eval rk_src = "computed"] \
| stats max(eval(if(rk_src=="heartbeat", digest, null()))) AS hb_digest, \
        max(eval(if(rk_src=="heartbeat", n_components, null()))) AS hb_n, \
        max(eval(if(rk_src=="heartbeat", scanned_at, null()))) AS hb_at, \
        max(eval(if(rk_src=="computed", digest, null()))) AS calc_digest, \
        max(eval(if(rk_src=="computed", n_components, null()))) AS calc_n, \
        max(eval(if(rk_src=="computed", scanned_at, null()))) AS calc_at, \
        max(scanned_at) AS scanned_at BY hostname \
| eval rk_use_hb = if(isnotnull(hb_digest) \
        AND (isnull(calc_at) OR tonumber(hb_at) >= tonumber(calc_at)), 1, 0) \
| eval digest = if(rk_use_hb == 1, hb_digest, calc_digest) \
| eval n_components = if(rk_use_hb == 1, hb_n, calc_n) \
| eval digest_source = if(rk_use_hb == 1, "heartbeat", "computed") \
| where isnotnull(digest) \
| fields hostname, digest, n_components, scanned_at, digest_source
iseval = 0

# Which hosts need re-matching, one row each.
#
# Same test the component-level version applies, made before any component is
# read rather than after every component has been.
# Hosts whose findings are out of date and must be re-matched.
#  The comparisons are made on coalesced values, and that is the whole point rather than 
#  defensive habit. A host first checkpointed before any feed existed stores a null feed_gen, 
#  because the feedstate lookup had nothing to return. After the operator imports a feed the 
#  test becomes null != 1, and in SPL that evaluates to NULL rather than to true -- so the 
#  disjunct never fires, no other disjunct fires either, and the entire fleet stays "clean" 
#  until the 24-hour floor. 
#  The user installs the app, watches inventory arrive, imports a feed, sees the import report 
#  real advisory counts, and every dashboard reads zero open findings with no error anywhere. 
#  Proven by tools/test_fresh_install.sh: loading data before importing the feed produced 0 
#  findings where the same host and feed in the other order produced 4,508, and the dirty-host 
#  count after the import was 0 of 1 reporting hosts. 
#  Install order must not decide whether the app works.
[riskability_dirty_hosts]
definition = `riskability_host_digest` \
| eval rk_join = "current" \
| lookup riskability_feedstate_lookup _key AS rk_join OUTPUT generation AS feed_gen \
| lookup riskability_matchstate_lookup hostname OUTPUT digest AS prev_digest, \
    feed_gen AS prev_gen, matcher_version AS prev_mv, matched_at AS prev_matched_at \
| eval rk_gen = coalesce(feed_gen, "none"), rk_prev_gen = coalesce(prev_gen, "none"), \
       rk_prev_mv = coalesce(prev_mv, "none") \
| where isnull(prev_digest) OR prev_digest != digest OR rk_prev_gen != rk_gen \
        OR rk_prev_mv != `riskability_matcher_version` \
        OR isnull(prev_matched_at) OR prev_matched_at < relative_time(now(), "-1d") \
| fields hostname, digest, n_components, digest_source
iseval = 0

[riskability_inventory_digest]
definition = `riskability_latest_inventory` \
| eval rk_sig = coalesce(type, "") . "|" . coalesce(name, "") . "|" . coalesce(version, "") . "|" . coalesce(path, "") \
| eval rk_h = tonumber(substr(md5(rk_sig), 1, 8), 16) \
| eventstats sum(rk_h) AS digest, count AS n_components BY hostname \
| fields - rk_sig, rk_h
iseval = 0

# The component rows of hosts that actually need re-matching.
#
# A host is re-matched when its inventory digest changed, when the feed
# generation changed (a new advisory can make an untouched package vulnerable),
# when the matcher version changed (a comparator fix can change a verdict with
# neither of the other two moving), or when it has never been matched.
#
# And unconditionally once a day. The checkpoint is written by a separate job
# from the one that does the matching, so a match that fails leaves a host
# marked done and it would otherwise be skipped until its inventory happened to
# change. A daily floor bounds that to one day rather than indefinitely. It is
# a safety net for a seam that a transactional matcher would not have.
#
# riskability_matcher_version is bumped by hand whenever matching logic changes.
# Forgetting to bump it is the failure mode here: verdicts stay stale until the
# next feed import. It is a macro so there is exactly one place to change.
[riskability_matcher_version]
definition = "2026.08.23.2"
iseval = 0

# Components of the hosts that need re-matching.
#
# The dirty decision is made FIRST, per host, and only then are components read
# -- previously the whole fleet's component list was read and hashed, and the
# dirty filter applied afterwards, so the incremental matcher sat downstream of
# a scan that was not incremental at all. With heartbeats the decision costs one
# row per host.
#
# The host list is bounded at 5,000 a run, most recently scanned first, and that
# bound is deliberately below Splunk's own [subsearch] maxout of 10,000: a
# subsearch truncated by Splunk drops hosts silently and they are simply not
# matched. Ours drains across successive hours, and the daily floor guarantees
# every host comes round regardless.
[riskability_dirty_inventory]
definition = `riskability_latest_inventory` \
| eval rk_cshort = if(like(root, "container:%"), substr(root, 11), null()) \
| lookup riskability_containers_lookup hostname, container_short AS rk_cshort \
    OUTPUT os_id AS root_os_id, os_version_id AS root_os_version_id, \
           container_name AS root_container, state AS root_state, image_ref AS root_image \
| fields - rk_cshort \
| search \
    [search `riskability_dirty_hosts` \
     | sort 5000 - n_components \
     | fields hostname \
     | append [| makeresults | eval hostname = "__no_such_host__" | fields hostname]] \
| eval rk_sig = coalesce(type, "") . "|" . coalesce(name, "") . "|" \
        . coalesce(version, "") . "|" . coalesce(path, "") \
| eval rk_h = tonumber(substr(md5(rk_sig), 1, 8), 16) \
| eventstats sum(rk_h) AS digest, count AS n_components BY hostname \
| fields - rk_sig, rk_h
iseval = 0

# ---------------------------------------------------------------------------
# Retention windows. One place to change them.
# ---------------------------------------------------------------------------
# A closed finding stays queryable in KV Store for this long, then moves to the
# archive index. Splunk's own guidance treats a KV collection over 25GB as a
# search-head stability risk, and closed findings are the part that grows
# without bound, so they are the part that leaves.
[riskability_retain_closed_days]
definition = 30
iseval = 0

# A host that has not reported for this long has its open findings marked
# "unknown" rather than left asserting a state nobody has confirmed. Silence is
# not evidence of health, and it is not evidence of risk either.
[riskability_host_silent_days]
definition = 7
iseval = 0

# ...and after this long the host is treated as retired: its findings are
# archived and dropped from KV. History stays in the archive index.
[riskability_host_retire_days]
definition = 30
iseval = 0

# ---------------------------------------------------------------------------
# Incremental lifecycle
# ---------------------------------------------------------------------------
# Findings produced recently, folded into the state collection.
#
# This replaces a stats over the ENTIRE findings index. That worked while the
# index was small, but it grows with every change ever recorded and the job's
# cost grows with it -- the one search in the app whose runtime only ever goes
# up. The state collection is authoritative now, so this only has to carry
# forward what is new: first_seen and first_version come from the existing row
# when there is one, so no history is needed to compute them.
#
# The window is deliberately wider than the schedule. An hourly job reading
# exactly one hour loses anything written while it was running.
#
# Applied to _index_earliest, NEVER to earliest. A finding carries the timestamp
# of the scan that produced it, which is routinely hours older than the run that
# wrote it, so an event-time window of the last 90 minutes matched nothing at
# all -- and the close job then treated every unfolded finding as gone. Measured
# on a real run: 4,746 open findings reported as removed.
[riskability_lifecycle_window]
definition = -90m
iseval = 0

# The exception register with each row's effective state resolved.
#
# active, expired and revoked are DERIVED, never stored. A stored flag is only
# as correct as the last job that ran, and an exception that is still excluding
# findings because a scheduled search failed is precisely the failure this
# register exists to prevent. The scheduled job records that an expiry
# happened; it is not what makes it true.
[riskability_exceptions_now]
definition = inputlookup riskability_exceptions_lookup \
| eval exc_state = case( \
      isnotnull(revoked_at) AND revoked_at!="", "revoked", \
      isnotnull(expires_at) AND expires_at!="" AND tonumber(expires_at) <= now(), "expired", \
      1=1, "active") \
| eval expires_label = if(isnull(expires_at) OR expires_at="", "permanent", \
      strftime(tonumber(expires_at), "%Y-%m-%d %H:%M")) \
| eval created_label = strftime(tonumber(created_at), "%Y-%m-%d %H:%M") \
| eval scope_label = case( \
      scope_kind="fleet_cve", "every host", \
      scope_kind="finding", hostname . " (one exact finding)", \
      1=1, hostname)
iseval = 0

# How many findings each exception is currently taking out of the risk pool.
#
# The subsearch groups by exception_key, so it returns at most one row per
# exception -- bounded by the size of the register, not by the fleet. That is
# what makes a join safe here when it is not safe anywhere else in this app.
# Counts come from a lookup, not a join subsearch.
#
# The subsearch scanned the whole finding state to produce two integers, bounded
# at 50,000 rows and 60 seconds with no announcement when either was hit -- and
# the coalesce below then turned a truncated subsearch into "this exception
# covers 0 findings", which is exactly what a genuinely broken exception looks
# like. A lookup has no subsearch bound, and the numbers are computed once an
# hour by a search that reads only the accepted rows.
[riskability_exceptions_with_counts]
definition = `riskability_exceptions_now` \
| lookup riskability_exception_counts_lookup exception_key OUTPUT findings_covered, hosts_covered \
| eval findings_covered = coalesce(findings_covered, 0) \
| eval hosts_covered = coalesce(hosts_covered, 0)
iseval = 0

# How stale an inventory snapshot may be before the pipeline stops trusting it.
#
# The snapshots are rebuilt hourly, so three hours is two missed runs -- enough
# slack for a slow rebuild or a restart, short enough that nothing closes on
# inventory nobody has refreshed since yesterday.
[riskability_snapshot_max_age]
definition = "-3h"
iseval = 0

# Distinct packages the live feed knows about, per ecosystem.
#
# Written by the importer while it streams the ranges in, so reading it is
# fifteen rows rather than a dc(package) over the whole range table. The
# generation filter matters: an import writes its summary before flipping the
# pointer, so both generations are briefly present and an unfiltered read would
# double-count every ecosystem for the length of one import.
[riskability_feed_ecosystems]
definition = inputlookup riskability_feedeco_lookup \
| eval rk_join = "current" \
| lookup riskability_feedstate_lookup _key AS rk_join OUTPUT generation AS live_gen \
| where tonumber(gen) == tonumber(live_gen) \
| fields ecosystem, feed_packages, feed_ranges, exact
iseval = 0

# The host snapshot with its bookkeeping row removed.
#
# "Riskability - snapshot host scan times" appends a __meta row whose
# host_last_scan is the time the SNAPSHOT was built, so the acknowledge job can
# tell "the snapshot is fresh" from "the snapshot is empty" -- an empty one
# would let the close job read every host as silent and close the fleet. The
# cost of keeping it in the same field namespace is that every scan of this
# lookup has to exclude it, and forgetting to is not a visible mistake: the
# sentinel is always the newest row, so max(host_last_scan) silently becomes
# "when did this job last run" instead of "when did a host last report", and the
# fleet-liveness indicator on the landing page reads green forever no matter how
# long every host has been dark. Read through this rather than the lookup.
[riskability_hosts_seen]
definition = inputlookup riskability_hoststate_lookup | where hostname!="__meta"
iseval = 0

# How far back the acknowledgement looks for match receipts.
#
# NOT the same as riskability_lifecycle_window, which is the fold-in's reach.
# The acknowledgement is what lets closing run for a host, and it has exactly
# one writer, so a receipt that ages out of this window before it is
# acknowledged leaves that host unable to close anything, forever, with no path
# back. A generous window costs almost nothing -- receipts are one row per host
# per run -- and it is the difference between a fault that heals and one that
# does not. Positive evidence is unaffected: the gate still requires state rows
# carrying that exact match_run, whether the receipt is ten minutes or six days
# old.
[riskability_ack_window]
definition = -7d
iseval = 0

# How far back the "pipeline did not complete" alert and the landing-page
# banner look.
#
# This MUST stay wider than riskability_ack_window. The two were briefly made
# equal, to stop the alert reporting a condition the acknowledgement could not
# clear -- and that turned a permanent false alarm into a permanent silent
# failure: the moment a host fell far enough behind, it dropped out of the
# alert, the banner and the diagnostic table at the same instant, while closing
# stayed withheld for it. A host with 9,494 findings sat in exactly that state
# and nothing said so.
#
# A watcher has to see further than the thing it watches. If a fault outlives
# the job's ability to repair it, that is precisely when somebody needs telling.
[riskability_stuck_window]
definition = -30d
iseval = 0

# ---------------------------------------------------------------------------
# Index names, in one place so a site can use its own.
#
# Plenty of organisations mandate an index naming scheme, and an app that
# hardcodes four names either forces a local fork or does not get installed.
# These four macros are the only place the names appear in SPL: override them
# in local/macros.conf (the Feed administration page writes them for you) and
# everything follows -- dashboards, the matcher, the lifecycle jobs, the audit
# trail.
#
# Two things do NOT follow automatically, because they are not this app's to
# change. The forwarder's inputs.conf must send to the same index, and the
# indexes themselves must exist -- TA-riskability-indexes creates the default
# four, and a site using its own names creates its own. Both are documented
# under "Index names" in the README.
#
# Deliberately NOT configurable: the KV Store collection and lookup names.
# They are namespaced to the app, invisible in the data model, never collide
# with anything, and are referenced from sixteen transforms, fourteen
# collections and every saved search. Renaming them would buy nothing and cost
# a class of breakage that is silent -- a lookup that resolves to nothing
# returns no rows rather than an error, which on this app reads as "no
# vulnerabilities".
[riskability_index_inventory]
definition = riskability_inventory
iseval = 0

[riskability_index_findings]
definition = riskability_findings
iseval = 0

[riskability_index_archive]
definition = riskability_findings_archive
iseval = 0

[riskability_index_audit]
definition = riskability_audit
iseval = 0

# A note on why these lead with sourcetype= rather than index=.
#
# Splunk decides whether to prepend an implicit "search" from the FIRST token of
# a search string, and it does not recognise a backtick as one -- so a macro
# whose definition opens with `riskability_index_findings` fails outright with
# "Unknown search command 'index'".
#
# Writing "search index=..." into the definition fixes that call site and breaks
# every other one. A macro invoked without a leading pipe already gets an
# implicit "search", so the expansion becomes "search search index=..." and the
# second one is not a command -- it is a literal TERM filter matching events
# that contain the word "search". No error, no warning: the Components tracked
# tile simply read 8 instead of 22,131.
#
# Leading with an ordinary search term avoids both. Splunk sees sourcetype=,
# prepends its own search, and the nested macro expands somewhere harmless.

# ---------------------------------------------------------------------------
# Filtered reads, pushed down to the KV Store.
#
# The unparameterised macros above read every open finding and let the caller
# filter afterwards with `| search`. That is one full read of the collection
# whatever the filter says, so selecting a single host on the Hosts page cost
# the same as selecting the whole fleet -- at 5,000 hosts, twelve million rows
# to display two thousand.
#
# These push the predicate into the `where` clause of the inputlookup itself,
# where the KV Store applies it. The collection is already accelerated on
# status+confidence, hostname and cve_id.
#
# Wildcards behave identically pushed down. Measured against post-filtering on
# this collection: hostname="fnask*" 10,063 both ways, hostname="*Zenbook"
# 5,431 both ways, package="openssl*" 224 both ways. So "*" is safe as a
# default and no branch is needed for the unfiltered case.
# The host predicate is parenthesised so a caller can pass more than one host.
#
# NOT "hostname IN ($host$)", which was the obvious form and does work against
# the KV store - IN ("*") returns the same 21,921 rows as ="*". It fails one
# step earlier: a multiselect delimited by commas produces "a","b", and Splunk
# splits macro arguments on commas, so the two-host call arrives as a
# three-argument macro and the parser reports the macro as not found. The
# multiselect therefore joins with ' OR hostname=' instead, which contains no
# comma, and this parenthesis is what keeps the OR from swallowing the rest of
# the where clause.
[riskability_open_findings_for(1)]
args = host
definition = inputlookup riskability_findings_state_lookup \
    where status="open" AND accepted!="1" AND (hostname=$host$)
iseval = 0

# The Findings page's four text filters, applied by the KV Store rather than by
# Splunk after the fact. Accepted findings are included here, as the page shows
# them with an "Accepted" column.
[riskability_open_findings_all_for(4)]
args = host, pkg, cve, conf
definition = inputlookup riskability_findings_state_lookup \
    where status="open" AND hostname="$host$" AND package="$pkg$" \
      AND cve_id="$cve$" AND confidence="$conf$"
iseval = 0

# The MITRE chain, with the page's two filters applied by the KV Store.
#
# There is no ATT&CK rollup collection, and that is a decision rather than an
# omission. The aggregate is per TECHNIQUE while the page's filter is per HOST,
# and a technique is a property of the CVE -- so a per-host technique rollup
# means expanding each CVE's host list, which on a fleet where most machines
# carry the same CVEs is the exact mvexpand blow-up this chain was rewritten to
# escape. Pushing both filters into the read gets most of the benefit with none
# of that: a named host reads only its own findings, and the default
# high-confidence view reads 27% of the collection rather than all of it,
# measured on this fleet.
[riskability_open_findings_hc(2)]
args = host, conf
definition = inputlookup riskability_findings_state_lookup     where status="open" AND accepted!="1" AND (hostname=$host$) AND confidence="$conf$"
iseval = 0

[riskability_finding_cwes_for(2)]
args = host, conf
definition = `riskability_open_findings_hc($host$, $conf$)` | stats values(hostname) AS hostname, values(package) AS package,         values(scope_id) AS scope_id, max(epss) AS epss,         count AS rk_findings BY cve_id | lookup riskability_advisory_lookup cve_id OUTPUT cwes | eval cwe = mvdedup(split(coalesce(mvjoin(cwes, ","), "") . ",__none__", ",")) | mvexpand cwe | eval cwe = trim(cwe) | where cwe!="" AND cwe!="__none__"
iseval = 0

[riskability_attack_surface_for(2)]
args = host, conf
definition = `riskability_finding_cwes_for($host$, $conf$)` | lookup riskability_attack_lookup cwe OUTPUT technique, technique_name | where isnotnull(technique) AND technique!="" | eval tpair = mvzip(technique, technique_name, "|@|") | mvexpand tpair | eval technique = mvindex(split(tpair, "|@|"), 0) | eval technique_name = mvindex(split(tpair, "|@|"), 1) | fields - tpair | lookup riskability_attack_lookup cwe technique OUTPUT via_capec, tactics
iseval = 0

[riskability_attack_matrix_for(2)]
args = host, conf
definition = `riskability_attack_surface_for($host$, $conf$)` | eval tactic = mvdedup(split(coalesce(mvjoin(tactics, ","), "") . ",__none__", ",")) | mvexpand tactic | eval tactic = trim(tactic) | where tactic!="" AND tactic!="__none__" | lookup riskability_tactic_lookup tactic OUTPUT tactic_name, tactic_order
iseval = 0

# ---------------------------------------------------------------------------
# Reachability: whether THIS copy of a vulnerable package answers the network.
#
# EPSS and the KEV catalogue both describe how likely the WORLD is to exploit
# something. Neither knows whether the instance in front of you is bound to a
# socket. The two are orthogonal, and until now the app only had the first.
#
# FIVE reach classes, not two. "no listening port" and "not assessed" are
# different statements, and collapsing them is how this would start lying: a
# host running a collector too old to report exposure would land every finding
# in the calmest row purely because no data arrived.
#
# epss is tonumber()'d before it is compared. The KV Store holds it as a string
# and a string comparison puts "1.0" below "0.5", so an unconverted threshold
# silently mis-bands the most likely-to-be-exploited CVEs downwards -- safe
# looking, again.
#
# Unscored plus reachable is act-now, not watch. No EPSS does not mean low
# EPSS; it means nobody has measured it. On a service answering the network
# that is a reason to look, not a reason to relax.
[riskability_reachability_for(2)]
args = host, conf
definition = `riskability_open_findings_hc($host$, $conf$)` \
| eval rk_key = if(match(coalesce(scope_id, ""), "^container:"), \
      "container:" . substr(replace(scope_id, "^container:", ""), 1, 12), package) \
| lookup riskability_reach_lookup hostname, rk_key OUTPUT reach_class, reach_rank, \
    ports_text, listener_text, listener_path_text, container_text, chain_text, \
    exposure_scanned_at \
| lookup riskability_exposure_hoststate_lookup hostname OUTPUT assessed_at, listeners, \
    wildcard_listeners, unattributed_listeners \
| eval epss = tonumber(epss) \
| eval is_kev = if(isnotnull(kev_added) AND kev_added!="", 1, 0) \
| eval reach_class = case(isnotnull(reach_class), reach_class, \
      isnull(assessed_at), "not assessed", 1=1, "no listening port") \
| eval reach_rank = case(reach_class=="answers any address", 3, \
      reach_class=="answers one address", 2, reach_class=="loopback only", 1, \
      reach_class=="no listening port", 0, 1=1, -1) \
| eval exploit_class = case(is_kev==1, "KEV", epss>=0.5, "EPSS 50%+", \
      epss>=0.1, "EPSS 10-50%", epss>=0.01, "EPSS 1-10%", \
      isnotnull(epss), "EPSS under 1%", 1=1, "unscored") \
| eval exploit_rank = case(exploit_class=="KEV", 5, exploit_class=="EPSS 50%+", 4, \
      exploit_class=="EPSS 10-50%", 3, exploit_class=="EPSS 1-10%", 2, \
      exploit_class=="EPSS under 1%", 1, 1=1, 0) \
| eval tier = case(reach_rank == -1, "unknown-risk", \
      reach_rank >= 2 AND (exploit_rank >= 3 OR exploit_rank == 0), "act-now", \
      reach_rank >= 2, "act-soon", \
      reach_rank == 1 AND exploit_rank >= 4, "act-soon", \
      exploit_rank >= 4, "plan", 1=1, "watch")
iseval = 0

# The chain, one row per hop: network edge -> listening process -> container ->
# package -> CVE. Only for findings that actually reach, which keeps the double
# mvexpand over a set measured in dozens rather than millions.
# The hop explosion on its own, so a caller can filter BEFORE it rather than
# after. Exploding the whole fleet's chains and then discarding all but three
# hosts' worth is the difference between a page that opens and one that does
# not: each finding becomes three or four hop rows, and mvexpand is where a
# fleet-sized search runs out of memory rather than time.
[riskability_chain_hops]
definition = eval hop = split(chain_text, ";") \
| mvexpand hop \
| eval rk_p = split(hop, "|") \
| eval n_edge = mvindex(rk_p, 0), n_proc = mvindex(rk_p, 1), n_cont = mvindex(rk_p, 2) \
| eval k_proc = if(n_proc=="", "listener-unknown", "listener") \
| eval n_proc = if(n_proc=="", "unidentified listener", n_proc) \
| eval k_cve = if(is_kev==1, "cve-kev", "cve") \
| eval hops = if(n_cont=="", \
      mvappend(n_edge."|edge|".n_proc."|".k_proc, n_proc."|".k_proc."|".package."|package", \
               package."|package|".cve_id."|".k_cve), \
      mvappend(n_edge."|edge|".n_proc."|".k_proc, n_proc."|".k_proc."|".n_cont."|container", \
               n_cont."|container|".package."|package", package."|package|".cve_id."|".k_cve)) \
| mvexpand hops \
| eval rk_h = split(hops, "|") \
| eval source = mvindex(rk_h,0), source_kind = mvindex(rk_h,1), \
       target = mvindex(rk_h,2), target_kind = mvindex(rk_h,3)
iseval = 0

[riskability_exposure_chain_for(2)]
args = host, conf
definition = `riskability_reachability_for($host$, $conf$)` \
| where reach_rank >= 1 AND isnotnull(chain_text) AND chain_text != "" \
| `riskability_chain_hops`
iseval = 0

# Container findings, with the container's own identity and lifecycle attached.
#
# A vulnerability in a running container that publishes a port is not the same
# thing as the same vulnerability in a stopped one. The app could not tell them
# apart at all until the matcher started reading each container's own OS.
[riskability_container_findings_for(1)]
args = host
definition = `riskability_open_findings_for($host$)` \
| search scope="container" \
| eval container_short = replace(scope_id, "^container:", "") \
| lookup riskability_containers_lookup hostname, container_short OUTPUT container_name, \
    state, runtime, image_ref, image_digest, endpoints_text, declared_text, n_endpoints, \
    n_public_endpoints \
| eval container_label = coalesce(container_name, container_short) \
| eval published = case(state!="running" AND coalesce(n_endpoints, 0) > 0, "declares a port", \
      state!="running", "no declared port", \
      coalesce(n_public_endpoints, 0) > 0, "publishes a port", \
      coalesce(n_endpoints, 0) > 0, "loopback only", 1=1, "no published port") \
| eval ctr_tier = case(state!="running", "4. stopped, still vulnerable", \
      published=="publishes a port", "1. running and published", \
      published=="loopback only", "2. running, loopback only", \
      1=1, "3. running, not published") \
| eval image_label = coalesce(image_ref, "unknown image")
iseval = 0

# Everything the feed knows about one CVE, collapsed to a single row.
#
# A CVE has one advisory row per source that published it, and they disagree by
# design: the upstream record carries the description, while a distribution's
# record carries its own package versions and frequently no summary at all.
# 53,183 Ubuntu and 52,538 Debian advisories in a full bundle have an empty
# title. Picking the longest one recovers a description for 640,830 of 641,374
# CVEs; without the fallback, one in seven pages would read as though the feed
# knew nothing.
#
# The coalesce around every mvindex is load bearing. values() collapses to a
# single value when every advisory agrees, which is the normal case for a CVSS
# vector, and mvindex() on a field that is not multivalue returns NULL rather
# than the value. Without the coalesce the vector arrived empty and every line
# of the plain English rendering read "not stated".
#
# Emptying the blanks before the stats is load bearing for the same reason and
# was not obvious either. Several advisories describe one CVE and only some
# carry a vector, so values() returned two entries: the real vector and an
# empty string. values() sorts, the empty string sorts first, and mvindex(x, 0)
# then faithfully picked the blank. Nulling them here means values() only ever
# collects something worth having.
# The same macro with no argument, which is what an unset CVE input produces.
#
# Splunk resolves a macro by name AND arity, so `riskability_cve_facts()` does
# not match the one-argument definition below: it reports the macro as missing
# entirely, and every panel on the page shows a parser error rather than an
# empty result. The encyclopaedia opens with no CVE selected whenever somebody
# arrives by searching a product, so that is the ordinary case, not an edge one.
#
# Returning no rows lets each panel fall through to its own empty state, which
# already explains what to do. makeresults must lead, hence the callers' pipe.
[riskability_cve_facts]
definition = makeresults | where 1=0
iseval = 0

[riskability_cve_facts(1)]
args = cve
definition = inputlookup riskability_advisories_lookup where cve_id="$cve$" \
| eval rk_len = len(title) \
| eventstats max(rk_len) AS rk_best \
| eval best_title = if(rk_len == rk_best, title, null()) \
| eval cvss_vector = if(cvss_vector="", null(), cvss_vector), \
       severity = if(severity="", null(), severity), \
       kev_added = if(kev_added="", null(), kev_added), \
       kev_due = if(kev_due="", null(), kev_due), \
       kev_ransomware = if(kev_ransomware="", null(), kev_ransomware), \
       kev_name = if(kev_name="", null(), kev_name), \
       kev_title = if(kev_title="", null(), kev_title), \
       kev_description = if(kev_description="", null(), kev_description), \
       kev_action = if(kev_action="", null(), kev_action) \
| stats first(cve_id) AS cve_id, values(best_title) AS best_title, \
        max(rk_best) AS rk_bestlen, \
        max(cvss_score) AS cvss_score, \
        values(severity) AS severity, \
        values(cvss_vector) AS cvss_vector, \
        values(cwes) AS cwes, \
        max(epss) AS epss, max(epss_percentile) AS epss_percentile, \
        values(kev_added) AS kev_added, values(kev_due) AS kev_due, \
        values(kev_ransomware) AS kev_ransomware, \
        values(kev_name) AS kev_name, values(kev_title) AS kev_title, \
        values(kev_description) AS kev_description, values(kev_action) AS kev_action, \
        min(published) AS published, max(modified) AS modified \
| eval best_title = coalesce(mvindex(best_title, 0), best_title), \
       cvss_vector = coalesce(mvindex(cvss_vector, 0), cvss_vector), \
       severity = coalesce(mvindex(severity, 0), severity), \
       kev_added = coalesce(mvindex(kev_added, 0), kev_added), \
       kev_due = coalesce(mvindex(kev_due, 0), kev_due), \
       kev_ransomware = coalesce(mvindex(kev_ransomware, 0), kev_ransomware), \
       kev_name = coalesce(mvindex(kev_name, 0), kev_name), \
       kev_title = coalesce(mvindex(kev_title, 0), kev_title), \
       kev_description = coalesce(mvindex(kev_description, 0), kev_description), \
       kev_action = coalesce(mvindex(kev_action, 0), kev_action) \
| fillnull value="" best_title, kev_name, kev_title, kev_description, kev_action, \
       kev_added, kev_due, kev_ransomware, cvss_vector, severity, published, modified
iseval = 0

# The CVSS vector, spelled out.
#
# The vector is the most information-dense field in the whole feed and the least
# readable. Nobody should have to remember that PR:N means the attacker needs no
# account. This is a rendering, not a judgement: it says what was published, and
# deliberately says nothing about whether this fleet is reachable, which is a
# different question answered on the Exposure page.
[riskability_cvss_english]
definition = eval Vector = if(cvss_vector="", "none published", cvss_vector) \
| eval Reach = case(match(cvss_vector, "AV:N"), "over a network", \
                    match(cvss_vector, "AV:A"), "from an adjacent network", \
                    match(cvss_vector, "AV:L"), "with local access to the machine", \
                    match(cvss_vector, "AV:P"), "with physical access", 1=1, "not stated") \
| eval Complexity = case(match(cvss_vector, "AC:L"), "no special conditions", \
                    match(cvss_vector, "AC:H"), "conditions the attacker cannot control", \
                    1=1, "not stated") \
| eval Privileges = case(match(cvss_vector, "PR:N"), "none, no account needed", \
                    match(cvss_vector, "PR:L"), "an ordinary account", \
                    match(cvss_vector, "PR:H"), "an administrative account", 1=1, "not stated") \
| eval "User interaction" = case(match(cvss_vector, "UI:N"), "none, nobody has to be tricked", \
                    match(cvss_vector, "UI:R"), "somebody must open or click something", \
                    1=1, "not stated") \
| eval Confidentiality = case(match(cvss_vector, "C:H"), "total disclosure", \
                    match(cvss_vector, "C:L"), "some disclosure", \
                    match(cvss_vector, "C:N"), "none", 1=1, "not stated") \
| eval Integrity = case(match(cvss_vector, "I:H"), "anything can be modified", \
                    match(cvss_vector, "I:L"), "some modification", \
                    match(cvss_vector, "I:N"), "none", 1=1, "not stated") \
| eval Availability = case(match(cvss_vector, "A:H"), "service can be taken down", \
                    match(cvss_vector, "A:L"), "degraded service", \
                    match(cvss_vector, "A:N"), "none", 1=1, "not stated")
iseval = 0
