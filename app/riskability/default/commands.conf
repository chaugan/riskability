# The matcher applies per-ecosystem version comparators to candidate ranges.
# It runs on a reduced candidate set, never streaming over raw inventory.
[riskabilitymatch]
filename = riskability_match.py
chunked = true
python.version = python3
python.required = 3.9, 3.13
local = true

# Compares two versions using the correct comparator for an ecosystem. Exposed
# so operators can sanity-check the matcher's reasoning from the search bar.
[riskabilityvercmp]
filename = riskability_vercmp_cmd.py
chunked = true
python.version = python3
python.required = 3.9, 3.13
local = true


# The AI queue consumer. local=true is not a preference: the command must run
# on the search head, where the stored secret and the conf are reachable, and
# where outbound access to the GPU endpoint exists. It refuses to run at all
# while AI analysis is switched off in the configuration.
[riskabilityaianalyze]
filename = riskabilityaianalyze.py
local = true
# REQUIRED: splunklib searchcommands v2 (EventingCommand) speaks the chunked
# protocol only. Without this splunkd runs the script in v1 mode, whose
# settings preamble (splunkVersion / allowStream lines then CSV) the v2
# reader cannot parse.
chunked = true
python.version = python3
python.required = 3.9, 3.13
enableplugin = false
