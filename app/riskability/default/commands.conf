# The matcher applies per-ecosystem version comparators to candidate ranges.
# It runs on a reduced candidate set, never streaming over raw inventory.
[riskabilitymatch]
filename = riskability_match.py
chunked = true
python.version = python3
python.required = 3.9, 3.13
local = true

# Compares two versions using the correct comparator for an ecosystem. Exposed
# so operators can sanity-check the matcher's reasoning from the search bar.
[riskabilityvercmp]
filename = riskability_vercmp_cmd.py
chunked = true
python.version = python3
python.required = 3.9, 3.13
local = true


# The AI queue consumer. local=true is not a preference: the command must run
# on the search head, where the stored secret and the conf are reachable, and
# where outbound access to the GPU endpoint exists. It refuses to run at all
# while AI analysis is switched off in the configuration.
[riskabilityaianalyze]
filename = riskabilityaianalyze.py
local = true
# REQUIRED: splunklib searchcommands v2 (EventingCommand) speaks the chunked
# protocol only. Without this splunkd runs the script in v1 mode, whose
# settings preamble (splunkVersion / allowStream lines then CSV) the v2
# reader cannot parse.
chunked = true
python.version = python3
python.required = 3.9, 3.13
# The command reaches an external endpoint with the app's stored credential and
# writes the shared verdict cache, so an interactive run is a data-egress
# decision rather than a lookup.
#
# What is_risky actually buys, per commands.conf.spec: Splunk Web warns when a
# user follows a LINK or a URL that loads a search containing this command. It
# explicitly does NOT warn for an ad hoc search somebody types. So this defends
# against a crafted link, which is a real vector, and does nothing at all
# against the analyst who types the command into the search bar. The control
# for that one is the per-command ACL in metadata/default.meta, and this
# setting is not a substitute for it.
is_risky = true

# Delete KV Store documents by key. See the docstring for why outputlookup
# was never a delete and what it cost.
[riskabilitykvdelete]
filename = riskability_kvdelete_cmd.py
local = true
chunked = true
python.version = python3
python.required = 3.9, 3.13
is_risky = true
