# The four indexes Riskability reads and writes.
#
# Shipped with the app so a single instance - one Splunk that is both search
# head and indexer, which is the common shape for an air-gapped deployment -
# works the moment it is installed, rather than showing empty dashboards until
# somebody reads the documentation.
#
# In a DISTRIBUTED deployment these definitions belong on the indexers. Copy
# this file to the indexers (or into the cluster manager's bundle); a search
# head that also carries them is harmless, it simply defines indexes it does
# not serve.
#
# No tstatsHomePath here. Splunk's own system/default/indexes.conf already sets
# tstatsHomePath = volume:_splunk_summaries/$_index_name/datamodel_summary for
# every index, so naming it per stanza only restated the default - and Splunk
# Cloud refuses the property outright, and refuses a volume: path for not
# containing $SPLUNK_DB.
#
# Raw inventory is high volume with short retention; materialised findings are
# low volume with long retention. Keeping them apart lets an operator age out
# inventory aggressively without losing vulnerability history.
[riskability_inventory]
homePath   = $SPLUNK_DB/riskability_inventory/db
coldPath   = $SPLUNK_DB/riskability_inventory/colddb
thawedPath = $SPLUNK_DB/riskability_inventory/thaweddb
frozenTimePeriodInSecs = 2592000

[riskability_findings]
homePath   = $SPLUNK_DB/riskability_findings/db
coldPath   = $SPLUNK_DB/riskability_findings/colddb
thawedPath = $SPLUNK_DB/riskability_findings/thaweddb
frozenTimePeriodInSecs = 31536000

# Closed findings, aged out of the KV Store state collection.
#
# History has to live somewhere, and it should not be the collection dashboards
# read on every load: Splunk treats a KV collection over 25GB as a search-head
# stability risk, and closed findings are the part that grows without bound.
# An index is the right home for a write-once audit trail.
[riskability_findings_archive]
homePath   = $SPLUNK_DB/riskability_findings_archive/db
coldPath   = $SPLUNK_DB/riskability_findings_archive/colddb
thawedPath = $SPLUNK_DB/riskability_findings_archive/thaweddb
# Two years by default. This is the record of what was found and when it was
# fixed, which is exactly what an audit asks for long after the finding is gone.
frozenTimePeriodInSecs = 63072000

# The exception audit trail. Append-only, and deliberately not in the KV Store:
# a register that can be rewritten by whoever can write the register is not an
# audit trail. Five years, because "who accepted this risk, when, and what did
# they say they had done instead" is the question asked long after the finding
# itself is gone.
[riskability_audit]
homePath   = $SPLUNK_DB/riskability_audit/db
coldPath   = $SPLUNK_DB/riskability_audit/colddb
thawedPath = $SPLUNK_DB/riskability_audit/thaweddb
frozenTimePeriodInSecs = 157680000

# The collector's non component records: heartbeats, listening ports, containers
# and library links, routed here at index time. Kept for a year against thirty
# days for inventory, because a host whose software has not changed sends none
# of these at all, so the newest record describing its open ports can be months
# old and still be the current truth. Ageing them on the inventory schedule
# would delete the only evidence a stable host has any.
[riskability_meta]
homePath   = $SPLUNK_DB/riskability_meta/db
coldPath   = $SPLUNK_DB/riskability_meta/colddb
thawedPath = $SPLUNK_DB/riskability_meta/thaweddb
frozenTimePeriodInSecs = 31536000

# The three indexes the optional AI pipeline writes to. They ship here so a
# single-instance install from Splunkbase is complete without a second
# archive; an index nothing writes to costs nothing. TA-riskability-ai carries
# the same stanzas for a separate indexing tier, the way TA-riskability-indexes
# carries the five above.
[riskability_ai_candidates]
homePath   = $SPLUNK_DB/riskability_ai_candidates/db
coldPath   = $SPLUNK_DB/riskability_ai_candidates/colddb
thawedPath = $SPLUNK_DB/riskability_ai_candidates/thaweddb
# The queue is rebuilt on every run and each run is stamped with its own
# run_id, so old queues have no value once a newer one exists. Seven days is
# enough for the orchestrator to catch up after an outage and still lets an
# operator diff last Tuesday's queue against what was analysed.
frozenTimePeriodInSecs = 604800

[riskability_ai_prioritized]
homePath   = $SPLUNK_DB/riskability_ai_prioritized/db
coldPath   = $SPLUNK_DB/riskability_ai_prioritized/colddb
thawedPath = $SPLUNK_DB/riskability_ai_prioritized/thaweddb
# Fourteen days, not a year. Rows are per-run snapshots (every hourly run
# rewrites the full prioritised set for the analysed slice), and the
# dashboards read only the newest run per CVE per asset - so age here is
# pure index bulk, and the advisory history question is answered by the
# findings index, which keeps a year.
frozenTimePeriodInSecs = 1210000

[riskability_ai_alerts]
homePath   = $SPLUNK_DB/riskability_ai_alerts/db
coldPath   = $SPLUNK_DB/riskability_ai_alerts/colddb
thawedPath = $SPLUNK_DB/riskability_ai_alerts/thaweddb
# P0/P1 events feed alerting downstream (SOAR, chat). Alert histories are
# kept as long as the results they derive from, so a correlation between an
# alert that fired and the result that caused it always resolves.
frozenTimePeriodInSecs = 31536000
