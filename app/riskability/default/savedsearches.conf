[Riskability - snapshot listening ports]
description = What is listening on each host and which package answers it, one row per \
  (host, port, package). \
  This is the axis the app has never had. EPSS and the KEV catalogue both describe how likely the \
  WORLD is to exploit something; neither knows whether this particular copy is answering the \
  network. Measured on the dev fleet, splitting one host's 16,423 open findings by whether the \
  package is bound to a wildcard address: 16,417 are not listening, and 6 are -- two of those \
  known-exploited. Sixteen thousand findings become six worth looking at tonight. \
  Ports with no package attributed are kept deliberately. An unattributed listener is a gap in \
  what the app can see rather than an absence of risk, and dropping it here would hide it in the \
  one view whose job is to say what is reachable. \
  A port that stopped listening must stop being reported, so this cannot simply merge rows in. \
  It merges by scan instead: a host that reported this run keeps only the rows carrying that run's \
  scanned_at, so a closed port disappears, and a host that did not report keeps the rows it \
  already had. That distinction is the whole reason this is no longer a full replace. A host whose \
  software has not changed sends no exposure records at all, so under a replace its listening \
  ports were deleted from this collection the moment its last scan aged past the window, and \
  Exposure then showed it with nothing listening rather than saying it had not reported. Measured \
  on the dev fleet at a two day window: two of four hosts survived, and the other two would have \
  been reported as having no open ports at all. \
  A host that has genuinely gone is dropped by the age of its last scan, not by the age of these \
  rows, because a stable host's rows are supposed to be old. If host scan times has no row for the \
  host the check passes, so a broken or empty hoststate cannot empty this collection. \
  A collector that has nothing to report for a field emits JSON null, and Splunk indexes JSON \
  null as the four-character string "null" -- so coalesce(unit, executable) returned "null" and \
  every Windows listener was attributed to a process of that name. Normalised here, once, at the \
  point the data enters the app's own lookups, rather than in each of the six places downstream \
  that would otherwise have to remember. \
  The package name is derived from the collector's purl here rather than shipped by it. On a \
  purl the name is the path segment before the version, with the distro namespace dropped for \
  deb, rpm and apk; on Windows the collector has no purl to give and sends "Name@Version", where \
  the name is everything before the version. Checked against the component records of both dev \
  hosts: 22 of 22 Linux purls and 18 of 18 Windows strings derive the same name the inventory \
  reports, which is what lets a finding be joined to a port by package alone. \
  held_by_os separates a port answered by the operating system itself -- Windows System and \
  svchost -- from one nothing could be attributed to. Both leave package empty, and they are \
  not the same fact: the first is a listener the app can see and cannot assess, the second is \
  one it could not even identify. The mvcount() guard keeps it from touching anything \
  multivalued: comparing a multivalue field to a string is neither true nor false, so an \
  unguarded version of this eval would empty the field it was meant to clean.
search = sourcetype=riskability:swinv record_type="exposure" \
    index=`riskability_index_meta` earliest=-7d latest=+1h \
| eventstats max(_time) AS rk_newest BY hostname \
| where _time >= rk_newest \
| foreach address bind_scope executable unit user purl container_id container_name \
    confidence os_component [ eval <<FIELD>> = if(mvcount(<<FIELD>>)==1 AND \
    (<<FIELD>>=="null" OR <<FIELD>>==""), null(), <<FIELD>>) ] \
| eval rk_is_purl = if(substr(purl, 1, 4)=="pkg:", 1, 0) \
| eval rk_body = if(rk_is_purl==1, replace(substr(purl, 5), "\?.*$", ""), purl) \
| eval rk_kind = if(rk_is_purl==1, mvindex(split(rk_body, "/"), 0), "") \
| eval rk_np = if(rk_is_purl==1, replace(rk_body, "^[^/]+/", ""), rk_body) \
| eval package = mvindex(split(rk_np, "@"), 0) \
| eval package = if(rk_kind=="deb" OR rk_kind=="rpm" OR rk_kind=="apk", \
    mvindex(split(package, "/"), -1), package) \
| eval package = urldecode(package) \
| eval held_by_os = if(os_component=="true", 1, 0) \
| eval _key = hostname . "|" . port . "|" . protocol . "|" . coalesce(package, "unattributed") \
| eval scanned_at = _time \
| table _key, hostname, port, protocol, address, bind_scope, executable, unit, package, purl, \
    container_id, container_name, confidence, held_by_os, scanned_at \
| inputlookup append=true riskability_exposure_lookup \
| eval rk_snap = tonumber(scanned_at) \
| eventstats max(rk_snap) AS rk_host_snap BY hostname \
| where rk_snap >= rk_host_snap \
| dedup _key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls \
| eval rk_gone = if(isnotnull(rk_hls) AND \
    (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
| where rk_gone = 0 \
| fields - rk_snap, rk_host_snap, rk_hls, rk_gone \
| outputlookup riskability_exposure_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
cron_schedule = 22 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot containers]
description = Containers on each host, running and stopped, with the image behind them. \
  A vulnerability in a running container that publishes a port is not the same thing as the same \
  vulnerability in a stopped one, and neither is the same as one in an image layer nobody runs. \
  The app could not tell them apart at all before this. \
  Stopped containers are kept, and that matters: a stopped container is not a safe container. It \
  is one "docker start" from being a running one, and its vulnerabilities are latent rather than \
  absent. \
  Current collectors send endpoints_text and n_endpoints alongside the array, which is what is \
  used when they are there. The array is still read as a fallback, and the rename is what makes \
  that possible: Splunk's JSON extraction names an array field with a "{}" suffix, so the \
  published ports arrive as "endpoints{}" and a search asking for "endpoints" gets nothing -- \
  silently, which once reported every container in the fleet as publishing no port. \
  Everything downstream reads the flattened text and the counts, so that nothing has to compare \
  a multivalue field to a string, which is neither true nor false and takes the else branch \
  every time. \
  Loopback endpoints are counted separately because Docker gives every container on a \
  user-defined network a 127.0.0.11 socket for its embedded DNS. Counting those as published \
  would call the entire fleet internet-facing on the strength of a name resolver.
search = sourcetype=riskability:swinv record_type="container" \
    index=`riskability_index_meta` earliest=-7d latest=+1h \
| eventstats max(_time) AS rk_newest BY hostname \
| where _time >= rk_newest \
| foreach container_name runtime state image_ref image_digest os_id os_version_id \
    endpoints_text declared_endpoints_text \
    [ eval <<FIELD>> = if(mvcount(<<FIELD>>)==1 AND (<<FIELD>>=="null" OR <<FIELD>>==""), \
    null(), <<FIELD>>) ] \
| rename "endpoints{}" AS rk_ep_mv, "declared_endpoints{}" AS rk_dep_mv \
| eval _key = hostname . "|" . container_id \
| eval container_short = substr(container_id, 1, 12) \
| eval scanned_at = _time \
| eval endpoints_text = coalesce(endpoints_text, mvjoin(rk_ep_mv, ";")) \
| eval declared_text = coalesce(declared_endpoints_text, mvjoin(rk_dep_mv, ";")) \
| eval rk_eps = if(isnull(endpoints_text) OR endpoints_text=="", null(), \
    split(endpoints_text, ";")) \
| eval n_endpoints = coalesce(n_endpoints, mvcount(rk_eps), 0) \
| eval n_public_endpoints = coalesce(mvcount(mvfilter(NOT match(rk_eps, \
    "^(127\.|\[::1\])"))), 0) \
| table _key, hostname, container_id, container_short, container_name, runtime, state, \
    image_ref, image_digest, os_id, os_version_id, declared_text, endpoints_text, \
    n_endpoints, n_public_endpoints, scanned_at \
| inputlookup append=true riskability_containers_lookup \
| eval rk_snap = tonumber(scanned_at) \
| eventstats max(rk_snap) AS rk_host_snap BY hostname \
| where rk_snap >= rk_host_snap \
| dedup _key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls \
| eval rk_gone = if(isnotnull(rk_hls) AND \
    (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
| where rk_gone = 0 \
| fields - rk_snap, rk_host_snap, rk_hls, rk_gone \
| outputlookup riskability_containers_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
cron_schedule = 23 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - roll up reachability per package]
description = One row per (host, scope) saying how far the network reaches it, where a \
  scope is a host package or a container. Keying on the package alone was wrong in both \
  directions. A container publishes its port through a binary that lives inside the container \
  -- /usr/local/bin/node -- which no host package owns, so the row was dropped by the old \
  "package must not be null" filter and every finding inside that container was reported \
  "not assessed" while the container answered the internet. In the other direction, a \
  container carrying openssl matched the HOST's openssl reach row purely because the names \
  agreed, and inherited a reachability it had no claim to. \
  Container packages carry no file path in the collector's output, so which package inside \
  the container is the listener cannot be known; what is known, and all that is asserted, \
  is that the container answers the network. \
  The id is cut to 12 characters because the collector reports two different forms of the \
  same identity: an exposure record carries the full 64-character container id, while a \
  component's root - which is what becomes a finding's scope_id - carries docker's short \
  form. Joining the two without normalising matches nothing at all, and matching nothing \
  looks exactly like a container with no vulnerabilities. \
  The listener is named by its systemd unit where there is one and by the executable's base \
  name otherwise -- "svchost.exe", not the full Windows path. The full path is kept alongside \
  it for the detail table: a graph node labelled with 60 characters of "C:\\Program Files\\..." \
  is unreadable, and its backslashes are escape characters everywhere they are later quoted. \
  The collapse happens here rather than at read time, and that is the whole point of the search. \
  riskability_exposure holds one row per PORT, so a package bound to both 0.0.0.0:22/tcp and \
  [::]:22/tcp6 matches two documents -- and a Splunk lookup matching more than one document \
  returns every output field as MULTIVALUE, which makes an eval comparing it to a string false. \
  The finding would come back classified "no listening port" while the service answers the \
  internet. Silent, and in the one direction this app exists to prevent. \
  max(reach_rank) is deliberate: a package on both a loopback and a wildcard port is reported as \
  wildcard. The strongest binding wins, never the weakest.
search = | inputlookup riskability_exposure_lookup \
| eval rk_cid = coalesce(container_id, "") \
| eval rk_short = if(rk_cid != "", substr(rk_cid, 1, 12), "") \
| eval rk_key = if(rk_short != "", "container:" . rk_short, package) \
| where isnotnull(rk_key) AND rk_key != "" \
| eval reach_rank = case(bind_scope=="wildcard", 3, bind_scope=="specific", 2, \
                         bind_scope=="loopback", 1, 1=1, -1) \
| eval endpoint = address . ":" . port . "/" . protocol \
| eval exe_base = replace(coalesce(executable, ""), "^.*[\\\\/]", "") \
| eval listener = replace(coalesce(unit, if(exe_base=="", null(), exe_base), \
    "unidentified listener"), "[|;]", "_") \
| eval cname = replace(coalesce(container_name, ""), "[|;]", "_") \
| eval hop = endpoint . "|" . listener . "|" . cname \
| stats max(reach_rank) AS reach_rank, max(scanned_at) AS exposure_scanned_at, \
        dc(endpoint) AS listeners, values(endpoint) AS ep, values(listener) AS li, \
        values(cname) AS co, values(hop) AS hops, values(executable) AS ex, \
        values(package) AS rk_pk, values(rk_cid) AS rk_cid \
        BY hostname, rk_key \
| eval ports_text = mvjoin(mvdedup(ep), ", "), listener_text = mvjoin(mvdedup(li), ", "), \
       container_text = mvjoin(mvdedup(co), ", "), chain_text = mvjoin(mvdedup(hops), ";"), \
       listener_path_text = mvjoin(mvdedup(ex), ", ") \
| eval reach_class = case(reach_rank==3, "answers any address", \
                          reach_rank==2, "answers one address", \
                          reach_rank==1, "loopback only", 1=1, "no listening port") \
| eval package = mvjoin(mvdedup(rk_pk), ", "), container_id = mvjoin(mvdedup(rk_cid), ", ") \
| eval rolled_at = now(), _key = hostname . "|" . rk_key \
| table _key, hostname, rk_key, package, container_id, reach_class, reach_rank, listeners, \
        ports_text, listener_text, listener_path_text, container_text, chain_text, \
        exposure_scanned_at, rolled_at \
| outputlookup riskability_reach_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
cron_schedule = 27 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot exposure coverage]
description = Per host: whether exposure was assessed at all, how many ports answer, and how many \
  have no package attributed. \
  This is what lets a finding be called "not assessed" instead of "no listening port". Without it \
  a host running an older collector, which reports no exposure at all, would have every one of its \
  findings land in the calmest row of the priority matrix purely because no data arrived -- the \
  fleet looking safer for being less well instrumented.
search = | inputlookup riskability_exposure_lookup \
| eval endpoint = address . ":" . port . "/" . protocol \
| eval unattributed = if((isnull(package) OR package=="") AND held_by_os!=1, endpoint, null()) \
| eval os_held = if((isnull(package) OR package=="") AND held_by_os==1, endpoint, null()) \
| eval wild = if(bind_scope=="wildcard", endpoint, null()) \
| stats dc(endpoint) AS listeners, dc(wild) AS wildcard_listeners, \
        dc(unattributed) AS unattributed_listeners, dc(os_held) AS os_listeners, \
        dc(package) AS packages_behind_ports, \
        dc(container_name) AS containers, max(scanned_at) AS assessed_at BY hostname \
| eval rolled_at = now(), _key = hostname \
| table _key, hostname, listeners, wildcard_listeners, unattributed_listeners, \
        os_listeners, packages_behind_ports, containers, assessed_at, rolled_at \
| outputlookup riskability_exposure_hoststate_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
cron_schedule = 28 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot configuration surface]
description = The persistence and privilege mechanisms each host is configured \
  with, one row per (host, mechanism), from swinv's config records. This is not a \
  vulnerability finding. It is what the host runs, and it lights the ATT&CK \
  techniques a CVE feed structurally cannot: cron, systemd timers and Windows \
  Scheduled Tasks for scheduled execution, systemd services and Run key autoruns \
  for persistence, SUID for privilege. Windows mechanisms arrive from swinv 0.9.0 \
  onward; before that the probe was Linux only and a Windows host reported none. \
  Merged rather than replaced, on whether the host reported this run, so a host \
  that went quiet keeps its surface rather than appearing to have none. A host \
  gone longer than the retire window is dropped by the age of its last scan. \
  cat_ran asks only one thing: did the source that produced this row report in \
  the host's newest scan. Not whether the row is fresh. The stats above spans a \
  window rather than a scan, so a component seen in ANY recent scan produces a \
  row, and keying cat_ran on freshness marked every row as looked-at including \
  the ones from a source that had since stopped running. That is the failure \
  this field exists to prevent, reintroduced one line below the fix. \
  The merge keeps a host's rows on whether they were computed by THIS run, not \
  on their timestamp. Timestamps cannot tell the two apart when the key format \
  changes: old and new rows for one scan carry the same second, both survive, \
  and the host's mechanisms silently double. \
  n_evidence is swinv's weakness count, carried through and never recomputed: an \
  outside join calling every unowned SUID a finding would flag 156 snap binaries \
  on a clean host, which swinv correctly reports as zero. \
  The key carries the mechanism's name as well as its path, because on Windows a \
  Run key autorun's path is the registry key rather than the entry: keyed on path \
  alone, every autorun under HKLM\\...\\Run collapsed into one row and a laptop \
  reporting ten of them showed three. Named entries are the interesting ones.
search = sourcetype=riskability:swinv record_type="config" \
      index=`riskability_index_meta` earliest=-7d latest=+1h \
  | eventstats max(_time) AS rk_newest BY hostname \
  | where _time >= rk_newest \
  | eval _key = hostname . "|" . kind . "|" . coalesce(name, "") . "|" \
      . coalesce(path, executable, "") \
  | eval scanned_at = _time \
  | table _key, hostname, kind, name, path, executable, attack, user, schedule, purl, mode, setuid, setgid, world_writable, n_evidence, scanned_at \
  | eval rk_fresh = 1 \
  | inputlookup append=true riskability_config_lookup \
  | eval rk_fresh = coalesce(rk_fresh, 0) \
  | eventstats max(rk_fresh) AS rk_host_fresh BY hostname \
  | where rk_fresh = rk_host_fresh \
  | dedup _key \
  | lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls \
  | eval rk_gone = if(isnotnull(rk_hls) AND (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
  | where rk_gone = 0 \
  | table _key, hostname, kind, name, path, executable, attack, user, schedule, purl, mode, setuid, setgid, world_writable, n_evidence, scanned_at \
  | outputlookup riskability_config_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
cron_schedule = 21 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - roll up loaded libraries]
description = What each host's binaries actually load, collapsed to the grain a finding \
  can join: one row per (host, scope, package). Reads the index and writes the rollup \
  directly, because the raw grain does not survive a Windows fleet. swinv 0.9.x resolves \
  PE imports as well as ELF DT_NEEDED, and one Windows laptop under --elf-scope all \
  produced 77,507 link records that collapse to 199 packages, a factor of 389. Stored \
  raw, a thousand such hosts would be 77 million KV rows read whole twice an hour, about \
  40 minutes a pass, and the hourly cycle would never close. The aggregate is the same \
  either way; only the thing kept between runs is smaller. \
  The package name is normalised exactly as the exposure snapshot does it, deliberately: \
  a finding stores the component's own name, so pkg:deb/ubuntu/libssl3t64@...?upstream=openssl \
  has to become libssl3t64 and not openssl, or every Ubuntu OpenSSL library load would \
  look unmapped. Merged rather than replaced, so a host whose scan was suppressed as \
  unchanged keeps the surface it last reported instead of appearing to load nothing.
cron_schedule = 24 * * * *
enableSched = 1
dispatch.earliest_time = -7d
dispatch.latest_time = +1h
search = sourcetype=riskability:swinv record_type="link" \
    index=`riskability_index_meta` \
| eventstats max(_time) AS rk_newest BY hostname \
| where _time >= rk_newest \
| foreach executable executable_purl purl path soname container_id \
    [ eval <<FIELD>> = if(mvcount(<<FIELD>>)==1 AND \
      (<<FIELD>>=="null" OR <<FIELD>>==""), null(), <<FIELD>>) ] \
| eval rk_is_purl = if(substr(purl, 1, 4)=="pkg:", 1, 0) \
| eval rk_body = if(rk_is_purl==1, replace(substr(purl, 5), "\?.*$", ""), purl) \
| eval rk_kind = if(rk_is_purl==1, mvindex(split(rk_body, "/"), 0), "") \
| eval rk_np = if(rk_is_purl==1, replace(rk_body, "^[^/]+/", ""), rk_body) \
| eval package = mvindex(split(rk_np, "@"), 0) \
| eval package = if(rk_kind=="deb" OR rk_kind=="rpm" OR rk_kind=="apk", \
    mvindex(split(package, "/"), -1), package) \
| eval package = urldecode(package) \
| eval rk_epurl = if(substr(executable_purl, 1, 4)=="pkg:", \
    replace(substr(executable_purl, 5), "\?.*$", ""), executable_purl) \
| eval executable_package = if(isnull(rk_epurl), null(), \
    mvindex(split(mvindex(split(rk_epurl, "@"), 0), "/"), -1)) \
| eval executable_package = if(isnull(executable_package), null(), urldecode(executable_package)) \
| eval container_short = if(isnotnull(container_id), substr(container_id, 1, 12), "") \
| eval root = coalesce(root, if(container_short != "", "container:" . container_short, "/")) \
| eval listening = if(listening=="true" OR listening==1, 1, 0) \
| where isnotnull(package) AND package != "" \
| eval scope_key = if(root=="/", package, root) \
| eval exe_base = replace(coalesce(executable, ""), "^.*[\\\\/]", "") \
| eval loader = replace(coalesce(executable_package, if(exe_base=="", null(), exe_base), \
    "unidentified binary"), "[|;]", "_") \
| eval rk_listening_loader = if(listening==1, loader, null()) \
| stats max(listening) AS loaded_listening, dc(loader) AS loader_count, \
        values(rk_listening_loader) AS rk_lis, values(loader) AS rk_all, \
        max(_time) AS scanned_at BY hostname, scope_key, package \
| eval loaders = mvdedup(mvappend(rk_lis, rk_all)) \
| eval loaders = mvjoin(mvindex(loaders, 0, 4), ", ") \
| eval load_class = if(loaded_listening==1, "a listener loads it", \
                       "loaded, not listening") \
| eval load_rank = if(loaded_listening==1, 3, 2) \
| eval _key = hostname . "|" . scope_key . "|" . package \
| table _key, hostname, scope_key, package, load_class, load_rank, loaders, \
    loader_count, loaded_listening, scanned_at \
| inputlookup append=true riskability_loaded_lookup \
| eval rk_snap = tonumber(scanned_at) \
| eventstats max(rk_snap) AS rk_host_snap BY hostname \
| where rk_snap >= rk_host_snap \
| dedup _key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls \
| eval rk_gone = if(isnotnull(rk_hls) AND \
    (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
| where rk_gone = 0 \
| eval rolled_at = now() \
| table _key, hostname, scope_key, package, load_class, load_rank, loaders, \
    loader_count, loaded_listening, scanned_at, rolled_at \
| outputlookup riskability_loaded_lookup

[Riskability - snapshot loaded library coverage]
description = Whether link data reached this host at all, and what it said. A host with \
  no row here was not assessed, which is a different statement from "nothing loads a \
  vulnerable library" and must never be shown as the calm one. Reasons a host has no \
  row: the collector ran without --ndjson-include links, or --heartbeat suppressed the \
  records because the inventory was unchanged. Windows hosts do report links from swinv \
  0.9.0 onward, which resolves PE imports the way the loader does; before that the probe \
  was ELF only and a Windows host legitimately had none. \
  unowned_libraries counts what nothing installed owns, which is the interesting case, \
  and it excludes libraries the operating system ships. swinv marks those with \
  os_component precisely so KERNEL32.dll cannot masquerade as unowned code: on one \
  Windows laptop 455 of 5,260 unowned looking rows were the OS's own.
cron_schedule = 30 * * * *
enableSched = 1
dispatch.earliest_time = -7d
dispatch.latest_time = +1h
search = sourcetype=riskability:swinv record_type="link" \
    index=`riskability_index_meta` \
| eventstats max(_time) AS rk_newest BY hostname \
| where _time >= rk_newest \
| foreach executable purl path soname \
    [ eval <<FIELD>> = if(mvcount(<<FIELD>>)==1 AND \
      (<<FIELD>>=="null" OR <<FIELD>>==""), null(), <<FIELD>>) ] \
| eval rk_is_purl = if(substr(purl, 1, 4)=="pkg:", 1, 0) \
| eval rk_body = if(rk_is_purl==1, replace(substr(purl, 5), "\?.*$", ""), purl) \
| eval rk_np = if(rk_is_purl==1, replace(rk_body, "^[^/]+/", ""), rk_body) \
| eval package = urldecode(mvindex(split(rk_np, "@"), 0)) \
| eval listening = if(listening=="true" OR listening==1, 1, 0) \
| eval os_component = if(os_component=="true" OR os_component==1, 1, 0) \
| eval unowned = if(isnotnull(path) AND (isnull(package) OR package=="") \
    AND os_component!=1, 1, 0) \
| eval rk_lis = if(listening==1, executable, null()) \
| eval rk_unowned = if(unowned==1, coalesce(path, soname), null()) \
| stats count AS link_rows, dc(package) AS linked_packages, \
        dc(rk_lis) AS listening_loaders, dc(rk_unowned) AS unowned_libraries, \
        max(_time) AS assessed_at BY hostname \
| eval _key = hostname \
| table _key, hostname, link_rows, linked_packages, listening_loaders, \
    unowned_libraries, assessed_at \
| inputlookup append=true riskability_links_hoststate_lookup \
| eval rk_snap = tonumber(assessed_at) \
| eventstats max(rk_snap) AS rk_host_snap BY hostname \
| where rk_snap >= rk_host_snap \
| dedup _key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls \
| eval rk_gone = if(isnotnull(rk_hls) AND \
    (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
| where rk_gone = 0 \
| eval rolled_at = now() \
| table _key, hostname, link_rows, linked_packages, listening_loaders, \
    unowned_libraries, assessed_at, rolled_at \
| outputlookup riskability_links_hoststate_lookup
[Riskability - learn each host's reporting rhythm]
description = Records the interval between a host's contacts so silence can be judged \
  against that host rather than against one number for the whole fleet. \
  Seven days cannot be right for everybody at once. A machine scanned hourly is broken \
  after two of them; a machine scanned only when somebody changes it is behaving \
  perfectly after two months. The app used to call both of them silent on the same day. \
  A host is late when it exceeds twice its own 95th percentile interval, floored at 26 \
  hours so an hourly host is not called late for missing a single run. Fewer than three \
  observed intervals means no rhythm has been learned and the host is never alarmed on: \
  guessing at one is how a dashboard teaches its reader to ignore red. \
  Reads two KV collections and writes one. It touches no index at all, so it costs the \
  same at five thousand hosts as at five, and it is incremental: a gap is recorded only \
  when the contact time actually moves. The last ten gaps are kept, which is enough for \
  a percentile and little enough that the row stays small. \
  Alarms on the silence of the collector, never on the age of the inventory. Those are \
  different facts. A host that contacted an hour ago and last changed its software in \
  June is not stale, it is confirmed unchanged, and calling that stale is the \
  manufactured alarm this app refuses everywhere else.
cron_schedule = 29 * * * *
enableSched = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
search = | inputlookup riskability_hoststate_lookup \
| where hostname != "__meta" \
| fields hostname, host_last_scan \
| lookup riskability_hostcadence_lookup hostname \
    OUTPUT last_contact_at, gaps_text, first_seen_at \
| eval rk_moved = if(isnull(last_contact_at) OR \
      tonumber(host_last_scan) > tonumber(last_contact_at), 1, 0) \
| eval rk_gap = if(rk_moved == 1 AND isnotnull(last_contact_at), \
      tonumber(host_last_scan) - tonumber(last_contact_at), null()) \
| eval gaps_mv = if(isnull(gaps_text) OR gaps_text == "", null(), split(gaps_text, ",")) \
| eval gaps_mv = if(isnotnull(rk_gap) AND rk_gap > 0, \
      mvappend(gaps_mv, tostring(rk_gap)), gaps_mv) \
| eval n_gaps = coalesce(mvcount(gaps_mv), 0) \
| eval gaps_mv = if(n_gaps > 10, mvindex(gaps_mv, n_gaps - 10, n_gaps - 1), gaps_mv) \
| eval n_gaps = coalesce(mvcount(gaps_mv), 0) \
| eval gaps_text = mvjoin(gaps_mv, ",") \
| eval last_contact_at = host_last_scan \
| eval first_seen_at = coalesce(first_seen_at, host_last_scan) \
| eval learned = if(n_gaps >= 3, 1, 0) \
| eval rk_num = mvmap(gaps_mv, tonumber(gaps_mv)) \
| eval rk_sorted = mvsort(mvmap(rk_num, printf("%012d", rk_num))) \
| eval median_gap = if(n_gaps > 0, \
      tonumber(mvindex(rk_sorted, floor((n_gaps - 1) / 2))), null()) \
| eval p95_gap = if(n_gaps > 0, tonumber(mvindex(rk_sorted, n_gaps - 1)), null()) \
| eval contact_age = now() - tonumber(last_contact_at) \
| eval late = if(learned == 1 AND contact_age > max(2 * p95_gap, 93600), 1, 0) \
| eval rolled_at = now(), _key = hostname \
| table _key, hostname, last_contact_at, first_seen_at, n_gaps, gaps_text, \
    median_gap, p95_gap, learned, late, contact_age, rolled_at \
| outputlookup riskability_hostcadence_lookup
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot Windows patch level]
description = Where each Windows host sits against Microsoft's own statement of the \
  current build. One row per Windows host. \
  This is the only assessment in the app that does not infer. Windows software \
  carries no package identity, so every Windows finding reached through a display \
  name is low confidence by construction and honestly so. A build number is not an \
  inference: the host reports the cumulative update it is running, Microsoft states \
  the build each update produces, and the comparison is arithmetic. \
  The branch alone does not identify the product. Windows 11 24H2 and Windows Server \
  2025 are both build 26100 and their update ranges sit twenty four thousand apart, \
  so client and server are looked up separately or a patched laptop measures as \
  hopelessly behind a server it is not. \
  A host with no cumulative update record is not current and not stale: it is \
  unmeasured, and says so. That is every Windows host running a collector older than \
  swinv 0.9.0, and every Linux host, which is why the row is only written for hosts \
  that report one.
cron_schedule = 33 * * * *
enableSched = 1
dispatch.earliest_time = -30d@d
dispatch.latest_time = +1h
search = index=`riskability_index_inventory` sourcetype=riskability:swinv type=hotfix \
| eventstats max(_time) AS rk_newest BY hostname \
| where _time >= rk_newest \
| eval rk_stream = 'attributes.servicing_stream', rk_kb = 'attributes.kb' \
| eval rk_cum = if(rk_stream=="cumulative", version, null()) \
| stats values(rk_cum) AS rk_cum, values(rk_kb) AS installed_kbs, \
        dc(rk_kb) AS n_installed_kbs, values(os_version_id) AS rk_osver, \
        max(_time) AS scanned_at BY hostname \
| eval rk_cum = mvindex(rk_cum, 0), rk_osver = mvindex(rk_osver, 0) \
| lookup riskability_scanstate_lookup hostname \
    OUTPUT os_build, os_display_version, os_edition, os_installation_type \
| eval rk_src = if(isnotnull(os_build) AND os_build != "", "reported", "derived") \
| eval rk_build = if(rk_src=="reported", replace(os_build, "^10\\.0\\.", ""), rk_cum) \
| where isnotnull(rk_build) AND rk_build != "" \
| rex field=rk_build "^(?<branch>\d+)\.(?<ubr>\d+)$" \
| where isnotnull(branch) \
| eval ubr = tonumber(ubr) \
| eval edition = case( \
    os_installation_type=="Client", "client", \
    os_installation_type=="Server" OR os_installation_type=="Server Core", "server", \
    match(rk_osver, "^\d{4}$"), "server", \
    1=1, "client") \
| eval release = if(isnotnull(os_display_version) AND os_display_version != "", \
    os_display_version, null()) \
| eval installed_kbs = mvjoin(installed_kbs, ", ") \
| eval rk_host = 1 \
| append \
    [| inputlookup riskability_winpatch_lookup \
     | eventstats max(ubr) AS rk_top BY branch, edition \
     | where ubr = rk_top \
     | stats values(kb) AS rk_kb, values(fixed_build) AS rk_build, \
             values(released) AS rk_rel, values(product) AS rk_prod, \
             max(ubr) AS rk_ubr BY branch, edition \
     | eval rk_host = 0] \
| eventstats values(rk_kb) AS latest_kb, values(rk_build) AS latest_build, \
             values(rk_rel) AS latest_released, values(rk_prod) AS product, \
             max(rk_ubr) AS latest_ubr BY branch, edition \
| where rk_host = 1 \
| eval latest_kb = mvjoin(latest_kb, ", "), latest_build = mvindex(latest_build, 0), \
       latest_released = mvindex(latest_released, 0), product = mvindex(product, 0) \
| eval behind_ubr = if(isnull(latest_ubr), null(), latest_ubr - ubr) \
| eval status = case( \
    isnull(latest_ubr), "no update data for this build in the feed", \
    behind_ubr <= 0, "current with the feed", \
    1=1, "behind the feed") \
| eval current_build = "10.0." . branch . "." . ubr \
| eval product = case( \
    isnotnull(release) AND isnotnull(product), \
        if(match(product, release), product, "Windows " . rk_osver . " Version " . release), \
    isnotnull(release), "Windows " . rk_osver . " Version " . release, \
    1=1, product) \
| eval build_source = if(rk_src=="reported", "the collector reports it", \
    "derived from the cumulative update, which names the servicing branch") \
| eval rolled_at = now(), _key = hostname \
| table _key, hostname, product, release, edition, branch, ubr, current_build, \
    build_source, latest_ubr, latest_build, latest_kb, latest_released, \
    behind_ubr, status, installed_kbs, n_installed_kbs, scanned_at, rolled_at \
| inputlookup append=true riskability_winstate_lookup \
| eval rk_snap = tonumber(rolled_at) \
| eventstats max(rk_snap) AS rk_host_snap BY hostname \
| where rk_snap >= rk_host_snap \
| dedup _key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls \
| eval rk_gone = if(isnotnull(rk_hls) AND \
    (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
| where rk_gone = 0 \
| table _key, hostname, product, release, edition, branch, ubr, current_build, \
    build_source, latest_ubr, latest_build, latest_kb, latest_released, \
    behind_ubr, status, installed_kbs, n_installed_kbs, scanned_at, rolled_at \
| outputlookup riskability_winstate_lookup

[Riskability - snapshot what the collector said it found]
description = Records the scan manifest swinv writes in its heartbeat: how many components, \
  exposure and link records it produced, and what each enumeration source did. Kept so the \
  app can compare what a host said it found against what actually reached the index. Nothing \
  else in this pipeline can catch a transport or parsing layer losing data, because every \
  layer reports success while it happens. \
  It also carries the OS identity swinv 0.9.2 added: os_build, os_display_version, \
  os_edition and os_installation_type. Those are taken from the heartbeat rather than \
  derived from the cumulative update component, because that component reports the \
  servicing branch and not the running build. A 25H2 machine at 10.0.26200.9168 has a \
  RollupFix component reading 26100.9168, since 25H2 ships as an enablement package \
  over the 24H2 servicing base, and anything reading the component alone names the \
  wrong release. Measured on a real laptop, which is how this was found. \
  It also records which enumeration sources ran, and whether that set has shrunk since \
  the last scan. A scan run without --full-scan enumerates far less than one run with \
  it, and to everything downstream that is indistinguishable from software being \
  uninstalled. Seen on a real host: seven sources and 7,979 components one hour, five \
  sources and 739 the next, and 3,661 CVEs closed as uninstalled on files still sitting \
  on the disk. The close job reads sources_shrank and refuses to close on that basis. \
  sources_skipped is counted and stored but deliberately kept out of the Coverage verdict. \
  In swinv, skipped means the source did not apply to this host rather than that it declined \
  to look: a Debian machine skips apk, portage and rpm because there is no such database to \
  read, and a real host skips most of the twenty five sources. A verdict driven off that \
  count fires almost everywhere and drowns the one that matters. failed is the actionable \
  status, and the collector agrees, since its exit code 5 means a source failed and the \
  inventory is short. The count is kept because a skip for a reason other than absence \
  would be worth surfacing if one ever appears.
cron_schedule = 18 * * * *
enableSched = 1
dispatch.earliest_time = -7d
dispatch.latest_time = +1h
search = sourcetype=riskability:swinv record_type="heartbeat" \
    index=`riskability_index_meta` \
| eventstats max(_time) AS rk_newest BY hostname \
| where _time >= rk_newest \
| spath input=_raw path=counts.component output=said_components \
| spath input=_raw path=counts.exposure output=said_exposure \
| spath input=_raw path=counts.link output=said_link \
| spath input=_raw path=counts.container output=said_container \
| eval said_components = coalesce(said_components, n_components) \
| spath input=_raw path=sources output=rk_sources \
| eval rk_pairs = json_keys(rk_sources) \
| eval sources_ok = 0, sources_skipped = 0, sources_failed = 0, failed_text = "" \
| foreach mode=json_array rk_pairs \
    [ eval rk_st = json_extract(rk_sources, <<ITEM>> . ".status"), \
           rk_rs = json_extract(rk_sources, <<ITEM>> . ".reason"), \
           sources_ok = sources_ok + if(rk_st=="ok", 1, 0), \
           sources_skipped = sources_skipped + if(rk_st=="skipped", 1, 0), \
           sources_failed = sources_failed + if(rk_st=="failed", 1, 0), \
           failed_text = if(rk_st=="failed", \
               failed_text . if(failed_text=="", "", "; ") . <<ITEM>> . ": " . coalesce(rk_rs, "no reason given"), \
               failed_text) ] \
| eval scanned_at = _time \
| eval rk_srcmv = json_array_to_mv(rk_pairs) \
| spath input=_raw path=scan_profile output=rk_profile \
| eval scan_profile = coalesce(rk_profile, ""), \
       full_scan = coalesce(json_extract(rk_profile, "full_scan"), ""), \
       elf_scope = coalesce(json_extract(rk_profile, "elf_scope"), ""), \
       config_scope = coalesce(json_extract(rk_profile, "config_scope"), "") \
| eval sources_text = mvjoin(mvsort(rk_srcmv), ","), n_sources = mvcount(rk_srcmv) \
| lookup riskability_scanstate_lookup hostname \
    OUTPUT sources_text AS prev_sources_text, n_sources AS prev_n_sources \
| eval sources_shrank = if(isnotnull(prev_n_sources) AND prev_n_sources != "" \
    AND tonumber(n_sources) < tonumber(prev_n_sources), 1, 0) \
| eval prev_sources_text = coalesce(prev_sources_text, "") \
| eval os_build = coalesce(os_build, ""), \
       os_display_version = coalesce(os_display_version, ""), \
       os_edition = coalesce(os_edition, ""), \
       os_installation_type = coalesce(os_installation_type, "") \
| join type=left hostname \
    [ search sourcetype=riskability:swinv index=`riskability_index_inventory` \
        NOT record_type=* earliest=-7d latest=+1h \
      | stats count AS rk_n BY hostname, scanned_at \
      | eventstats max(scanned_at) AS rk_newest BY hostname \
      | where scanned_at == rk_newest \
      | stats sum(rk_n) AS arrived_components BY hostname ] \
| eval rolled_at = now(), _key = hostname \
| table _key, hostname, scan_id, swinv_version, schema_version, said_components, \
    said_exposure, said_link, said_container, arrived_components, sources_ok, \
    sources_skipped, sources_failed, failed_text, duration_ms, \
    os_id, os_version_id, os_build, os_display_version, os_edition, \
    os_installation_type, sources_text, n_sources, prev_sources_text, \
    prev_n_sources, sources_shrank, scan_profile, full_scan, elf_scope, \
    config_scope, scanned_at, rolled_at \
| inputlookup append=true riskability_scanstate_lookup \
| eval rk_snap = tonumber(scanned_at) \
| eventstats max(rk_snap) AS rk_host_snap BY hostname \
| where rk_snap >= rk_host_snap \
| dedup _key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls \
| eval rk_gone = if(isnotnull(rk_hls) AND \
    (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
| where rk_gone = 0 \
| fields - rk_snap, rk_host_snap, rk_hls, rk_gone \
| outputlookup riskability_scanstate_lookup

[Riskability - acknowledge what the repair folded]
description = Runs the acknowledgement again, after the repair fold rather than before it. \
  The hourly path is :17 match, :25 fold, :26 acknowledge, :30 checkpoint, and the repair at \
  :50 folds with an all-time window whatever the 90 minute one missed. On a fleet large enough \
  to need that repair, nothing then acknowledges its work until :26 the following hour, so \
  "some hosts are matched but not folded in" stays up for most of every hour while the data \
  underneath it is complete. Measured on a reporting fleet: 21,886 findings folded at :53 and \
  acknowledged at :26 the next hour. \
  Calls the other search rather than repeating it, so there is one definition of what \
  acknowledgement means and no second copy to drift.
cron_schedule = 52 * * * *
enableSched = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
search = | savedsearch "Riskability - acknowledge folded matches"

[Riskability - roll up software support lifecycles]
description = Which installed software is past the end of its supported release,     and how much evidence there is that it runs. Support is decided by who ships     the copy: a distro package on a supported release is informational because the     vendor backports, an ESM stamped package says so in its own version string, and     a copy nobody packages is the case where upstream end of life is the whole truth.     Absence of a row is absence of lifecycle data, never evidence of support.
cron_schedule = 41 * * * *
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
schedule_window = 20
search = `riskability_latest_inventory` \
| where coalesce(role, "") == "" \
| eval rk_eco = lower(coalesce(type, "")), rk_name = lower(coalesce(name, "")) \
| eval product = replace(rk_name, "^lib", "") \
| eval product = replace(product, "^(python3?|golang|node|perl|ruby|rust)-", "") \
| eval product = replace(product, "[ _-]?[0-9][0-9.]*$", "") \
| eval product = replace(product, "[^a-z0-9+.]", "") \
| eval rk_v = replace(coalesce(version, ""), "^[^0-9]*", "") \
| rex field=rk_v "^(?<v1>\d+)(?:\.(?<v2>\d+))?(?:\.(?<v3>\d+))?" \
| eval k3 = if(isnull(v3), "", product . "|" . v1 . "." . v2 . "." . v3) \
| eval k2 = if(isnull(v2), "", product . "|" . v1 . "." . v2) \
| eval k1 = product . "|" . v1 \
| lookup riskability_lifecycle_lookup _key AS k3 OUTPUT cycle AS c3, eol_from AS e3, eoes_from AS x3, label AS l3, category AS g3 \
| lookup riskability_lifecycle_lookup _key AS k2 OUTPUT cycle AS c2, eol_from AS e2, eoes_from AS x2, label AS l2, category AS g2 \
| lookup riskability_lifecycle_lookup _key AS k1 OUTPUT cycle AS c1, eol_from AS e1, eoes_from AS x1, label AS l1, category AS g1 \
| eval cycle = coalesce(c3, c2, c1), eol_from = coalesce(e3, e2, e1), eoes_from = coalesce(x3, x2, x1), label = coalesce(l3, l2, l1), category = coalesce(g3, g2, g1) \
| where isnotnull(cycle) \
| eval eol_at = if(coalesce(eol_from, "") == "", null(), strptime(eol_from, "%Y-%m-%d")) \
| eval eoes_at = if(coalesce(eoes_from, "") == "", null(), strptime(eoes_from, "%Y-%m-%d")) \
| eval past_eol = if(isnotnull(eol_at) AND eol_at < now(), 1, 0) \
| eval os_key = lower(coalesce(os_id, "")) . "|" . coalesce(os_version_id, "") \
| lookup riskability_lifecycle_lookup _key AS os_key OUTPUT eol_from AS os_eol_from \
| eval os_eol_at = if(coalesce(os_eol_from, "") == "", null(), strptime(os_eol_from, "%Y-%m-%d")) \
| eval rk_distro = if(rk_eco IN ("deb", "rpm", "apk"), 1, 0) \
| eval rk_esm = if(match(lower(coalesce(version, "")), "esm|fips"), 1, 0) \
| eval support = case( \
    past_eol = 0, "supported", \
    rk_esm = 1, "vendor extended support", \
    rk_distro = 1 AND isnotnull(os_eol_at) AND os_eol_at > now(), "supported by the distribution", \
    rk_distro = 1 AND isnull(os_eol_at), "distribution lifecycle unknown", \
    1=1, "no supported release") \
| eval confidence = case(support = "no supported release", "high", support = "supported", "supported", 1=1, "informational") \
| join type=left hostname, name \
    [| inputlookup riskability_exposure_lookup \
     | eval name = coalesce(package, "") \
     | where name != "" \
     | eval rk_rung = if(lower(coalesce(bind_scope, "")) = "loopback", 2, 1) \
     | stats min(rk_rung) AS rk_listen BY hostname, name] \
| join type=left hostname, name \
    [| inputlookup riskability_config_lookup \
     | rex field=purl "/(?<name>[^/@]+)@" \
     | where coalesce(name, "") != "" \
     | stats values(kind) AS rk_kinds BY hostname, name \
     | eval rk_kinds = mvjoin(rk_kinds, ", "), rk_conf = 4] \
| eval rung = coalesce(rk_listen, rk_conf, 5) \
| eval reach = case( \
    rung = 1, "listening on a routable address", \
    rung = 2, "listening on loopback only", \
    rung = 4, "configured to run: " . coalesce(rk_kinds, "scheduled or started"), \
    1=1, "installed only, nothing observed it run") \
| join type=left hostname, name \
    [| inputlookup riskability_findings_state_lookup where accepted="1" \
     | eval name = package \
     | stats count AS rk_accepted BY hostname, name] \
| where isnull(rk_accepted) \
| eval _key = hostname . "|" . name . "|" . path \
| eval assessed_at = now() \
| table _key, hostname, name, version, cycle, label, category, product, path, root, rk_eco, support, confidence, reach, rung, eol_from, eoes_from, latest, past_eol, assessed_at \
| rename name AS package, rk_eco AS ecosystem \
| inputlookup append=true riskability_eolstate_lookup \
| eval rk_snap = tonumber(assessed_at) \
| eventstats max(rk_snap) AS rk_host_snap BY hostname \
| where rk_snap >= rk_host_snap \
| dedup _key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls \
| eval rk_gone = if(isnotnull(rk_hls) AND \
    (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
| where rk_gone = 0 \
| table _key, hostname, package, version, cycle, label, category, product, path, root, ecosystem, support, confidence, reach, rung, eol_from, eoes_from, latest, past_eol, assessed_at \
| outputlookup riskability_eolstate_lookup

# ---------------------------------------------------------------------------
# AI analysis pipeline

[Riskability AI - generate candidate queue]
description = Selects which distinct CVEs deserve model analysis this run: \
  open findings deduplicated to one row per CVE with fleet-worst-case \
  context, T0-decided extremes excluded, verdict-cache hits excluded, \
  ordered by exploit urgency, bounded by the budget macro. Ships disabled \
  with the rest of the AI searches; the configuration page switches it on.
search = | `riskability_open_findings` \
| eval rk_key = if(match(coalesce(scope_id, ""), "^container:"), \
      "container:" . substr(replace(scope_id, "^container:", ""), 1, 12), package) \
| lookup riskability_reach_lookup hostname, rk_key OUTPUT reach_class, reach_rank, ports_text, listener_text, listener_path_text, container_text, chain_text \
| lookup riskability_advisory_lookup cve_id OUTPUT cvss_score, title AS rk_adv_title, \
    cwes, cvss_vector \
| lookup riskability_vendor_lookup package OUTPUT vendor AS rk_vendor \
| eval rk_is_kev = if(isnotnull(kev_added) AND kev_added!="", 1, 0) \
| eval rk_version_match = case(confidence=="high", "yes", confidence=="informational", "no", 1=1, "unknown") \
| eval rk_exposure_zone = case(coalesce(reach_rank, -9)>=3, "internet-facing", \
      coalesce(reach_rank, -9)>=1, "internal", reach_class=="no listening port", "isolated", \
      coalesce(reach_rank, -9)==-1, "unknown", 1=1, "internal") \
| eval rk_epss_num = coalesce(tonumber(epss), 0) \
| eval rk_t0 = case( \
      coalesce(tonumber(cvss_score),0) < 4 AND rk_epss_num*1000 < 50 AND rk_is_kev=0 AND rk_exposure_zone!="internet-facing" AND rk_version_match=="no", "P4", \
      rk_is_kev=1 AND rk_exposure_zone=="internet-facing" AND rk_version_match=="yes" AND coalesce(tonumber(cvss_score),0) >= 7, "P0", \
      1=1, null()) \
| where isnull(rk_t0) \
| eval rk_cvss_num = tonumber(cvss_score) \
| eval rk_cvss_band = case(isnull(rk_cvss_num), "", rk_cvss_num < 4, "0", rk_cvss_num < 7, "1", \
      rk_cvss_num < 9, "2", 1=1, "3") \
| eval rk_epss_band = case(rk_epss_num < 0.01, "0", rk_epss_num < 0.05, "1", rk_epss_num < 0.2, "2", \
      rk_epss_num < 0.5, "3", 1=1, "4") \
| eval rk_adv_long = mvfilter(len(rk_adv_title) > 60) \
| eval rk_sig_title = coalesce(mvindex(rk_adv_long, 0), mvindex(rk_adv_title, 0), title, "") \
| eval rk_sig = md5(`riskability_ai_sig_salt` . "|" . coalesce(cve_id,"") . "|" \
      . lower(coalesce(severity,"")) . "|" . rk_is_kev . "|" . rk_cvss_band . "|" . rk_epss_band \
      . "|" . rk_sig_title) \
| sort 0 - rk_is_kev, - rk_epss_num \
| dedup cve_id \
| lookup riskability_aiverdicts_lookup cve_id OUTPUT sig AS rk_cached_sig \
| where isnull(rk_cached_sig) OR rk_cached_sig != rk_sig \
| head `riskability_ai_candidate_cap` \
| eval run_id = strftime(now(), "%Y%m%d-%H%M%S"), \
       cwe_id = coalesce(mvjoin(mvdedup(cwes), ","), ""), \
       cvss_vector = mvindex(mvdedup(cvss_vector), 0), \
       cve_description = rk_sig_title, \
       cvss_base_score = coalesce(cvss_score, ""), \
       worst_asset = hostname, \
       process_name = coalesce(listener_text, package), \
       process_path = coalesce(path, listener_path_text, ""), \
       process_version = coalesce(last_version, ""), \
       listening_ports = coalesce(ports_text, ""), \
       process_chain = coalesce(chain_text, ""), \
       container = coalesce(container_text, ""), \
       affected_product = coalesce(package, ""), \
       vendor = coalesce(rk_vendor, ""), \
       affected_version = coalesce(fixed_version, ""), \
       asset_criticality = `riskability_ai_asset_criticality`, \
       kev = if(rk_is_kev=1, "true", "false"), \
       exposure_zone = rk_exposure_zone, \
       version_match = rk_version_match \
| eval _time = now() \
| fields _time, run_id, rk_sig, cve_id, cwe_id, severity, cvss_vector, cvss_base_score, epss, kev, \
        cve_description, affected_product, vendor, affected_version, process_version, process_name, process_path, \
        listening_ports, process_chain, container, worst_asset, asset_criticality, exposure_zone, \
        version_match, confidence, match_authority, scope_id, scope \
| collect index=`riskability_index_ai_candidates` sourcetype=riskability:ai:candidate
# Shaped with "fields", not "table". table drops _time, and collect stamps an
# event that arrives without one using the search's DISPATCH EARLIEST rather
# than the clock: at -30d@d every queue this search wrote was filed thirty days
# in the past, older than the seven day retention on riskability_ai_candidates,
# so the queue aged out about as fast as it was written. fields keeps _time and
# every other internal field, so the eval above survives the shaping instead of
# being quietly undone by it.
# Renames are still done with eval BEFORE the shaping command. Neither "table
# x AS y" nor "fields x AS y" renames anything; both simply drop the pair, and
# silently writing the old name is how the orchestrator contract drifted once.
# exposure_zone and version_match were named in the old field list but never
# evaluated under those names, so every candidate reached the model with both
# blank: the prompt asked about exposure and was handed nothing.
# sea_0 to sea_4 are counted BEFORE the verdict filter, and that placement is
# the whole point. They are distinct open CVEs per exploit-likelihood band
# across the entire catalogue, including every CVE the model has not reached,
# because the AI page draws them as the sea a handful of findings rise out of.
# Counted after the filter they would only ever describe what was already
# analysed, which is a picture of the pipeline's progress rather than of the
# fleet's risk, and it would shrink as the cache filled.
#
# mvindex on the advisory title is load bearing, not tidiness. The advisory
# lookup returns SEVERAL titles for most CVEs (393 of 400 sampled on the
# reference instance, one advisory row per source), and SPL string
# concatenation with a multivalue field yields NULL rather than a joined
# string. A NULL signature is the worst outcome this pipeline has: the cache
# exclusion below is "isnull(cached) OR cached != sig", which a NULL sig
# passes on every run forever, so every CVE is re-queued and re-analysed for
# ever with nothing anywhere reporting it. Measured before the fix: 769 of
# 1000 queue rows carried no signature at all. cve_description is built from
# the same expression so that what the model is shown and what the signature
# covers are the same string.
#
# Excluding on the signature alone is correct, and it is correct because of a
# guarantee the command makes rather than anything this search does. A failed
# analysis produces a fallback placeholder (P2, score 50, confidence 0.0), and
# riskabilityaianalyze.py deliberately does NOT write it to the verdict cache.
# That is what keeps one bad afternoon from becoming permanent: were a
# fallback stored under the signature a real answer would have carried, the
# CVE would match its own failure on every later run, never be queued again,
# and wear an invented tier until the advisory text changed.
# So the two files hold one rule between them: the command decides what is
# durable, this search decides what is worth asking about. If the command ever
# starts caching fallbacks, this exclusion becomes the bug, and the fix
# belongs there rather than in a defensive term here.
# The leading pipe is the app convention for the inputlookup-backed macro.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
# Ships DISABLED, which is the state three documents already describe and the
# state the configuration page's master switch reads and writes. enableSched
# says what the cron is for when the search is on; disabled says whether it is
# on at all, and only the second is the shipped default. Without it a fresh
# install where nobody ever opened the page starts collecting CVE, host, port
# and path data into a new index every hour for a model endpoint that does not
# exist, and tells every analyst the pipeline is here by firing the daily
# silence alert about it.
disabled = 1
enableSched = 1
cron_schedule = 50 * * * *
counttype = number of events
relation = greater than
quantity = -1
alert.track = 1
alert.severity = 1
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_ai

[Riskability AI - analyze latest queue]
description = Consumes the candidate queue through the model endpoint, \
  bounded by budget and concurrency, upserting every verdict into the \
  verdict cache. Cache hits never reach the model; failures ship as \
  explicit conservative fallback rows. Disabled until AI analysis is on.
search = search index=`riskability_index_ai_candidates` sourcetype=riskability:ai:candidate \
| dedup cve_id sortby -_indextime \
| riskabilityaianalyze \
| stats count AS rows, \
        count(eval(analysis_source=="deferred")) AS deferred, \
        count(eval(analysis_source=="T2")) AS model_calls, \
        count(eval(analysis_source=="fallback")) AS fallbacks, \
        count(eval(analysis_source=="cache")) AS cache_hits \
| eval verdicts = model_calls + fallbacks + cache_hits \
| eval unclassified = rows - verdicts - deferred \
| fields rows, verdicts, model_calls, fallbacks, cache_hits, deferred, unclassified
# The counts have to add up, and before this they could not. A row over the
# budget carries analysis_source="deferred" and no verdict at all, so it
# matched none
# of the three source counts but was still counted by "count AS verdicts": the
# headline number claimed work that had not been done, and the only way to see
# a deferral was to subtract the other three from it. verdicts is now derived
# from the three sources rather than from the row count, deferred is a column
# of its own, and unclassified is the difference. unclassified is normally 0
# and is here so that a row the command starts emitting under a source name
# this stanza does not know about shows up as a number instead of quietly
# disappearing out of every count.
dispatch.earliest_time = -3h
dispatch.latest_time = now
disabled = 1
enableSched = 1
cron_schedule = 52 * * * *
alert.track = 0
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_ai

[Riskability AI - expand verdicts to findings]
description = Joins the cached CVE verdicts back onto every open finding \
  and adjusts per asset deterministically: reach decides the exposure \
  signal, match confidence the version signal, asset criticality nudges. \
  The model's score is a fleet-worst-case base; per-asset adjustments only \
  step down from it. Findings whose CVE has no fresh verdict wait for a \
  later run rather than wearing an invented tier. The enabled escalation \
  rules run after the tier is assigned and may raise a finding by exactly one \
  tier, never into P0 and never twice. Disabled until AI is on.
search = | `riskability_open_findings` \
| eval rk_key = if(match(coalesce(scope_id, ""), "^container:"), \
      "container:" . substr(replace(scope_id, "^container:", ""), 1, 12), package) \
| lookup riskability_reach_lookup hostname, rk_key OUTPUT reach_class, reach_rank, ports_text, listener_text, container_text \
| lookup riskability_advisory_lookup cve_id OUTPUT cvss_score \
| eval rk_is_kev = if(isnotnull(kev_added) AND kev_added!="", 1, 0) \
| eval rk_version_match = case(confidence=="high", "yes", confidence=="informational", "no", 1=1, "unknown") \
| eval rk_exposure_zone = case(coalesce(reach_rank, -9)>=3, "internet-facing", \
      coalesce(reach_rank, -9)>=1, "internal", reach_class=="no listening port", "isolated", \
      coalesce(reach_rank, -9)==-1, "unknown", 1=1, "internal") \
| eval asset_criticality = `riskability_ai_asset_criticality` \
| lookup riskability_aiverdicts_lookup cve_id OUTPUT priority_tier AS rk_tier, priority_score AS rk_base, confidence AS rk_conf, rationale AS rk_rationale, recommended_action AS rk_action, recommended_mitigations AS rk_mit, attck_techniques AS rk_tech, analysis_source AS rk_src, analysed_at AS rk_at \
| eval rk_t0_tier = case( \
      coalesce(tonumber(cvss_score),0) < 4 AND coalesce(tonumber(epss),0)*1000 < 50 AND rk_is_kev=0 AND rk_exposure_zone!="internet-facing" AND rk_version_match=="no", "P4", \
      rk_is_kev=1 AND rk_exposure_zone=="internet-facing" AND rk_version_match=="yes" AND coalesce(tonumber(cvss_score),0) >= 7, "P0", \
      1=1, null()) \
| eval rk_from_t0 = if(isnotnull(rk_t0_tier), 1, 0) \
| eval rk_from_model = if(isnotnull(rk_tier), 1, 0) \
| eval rk_stale = if(isnull(rk_at) OR rk_at < now() - 604800, 1, 0) \
| eval rk_sea_band = case(coalesce(tonumber(epss),0) < 0.01, "0", \
      coalesce(tonumber(epss),0) < 0.05, "1", coalesce(tonumber(epss),0) < 0.2, "2", \
      coalesce(tonumber(epss),0) < 0.5, "3", 1=1, "4") \
| eventstats dc(eval(if(rk_sea_band=="0", cve_id, null()))) AS sea_0, \
             dc(eval(if(rk_sea_band=="1", cve_id, null()))) AS sea_1, \
             dc(eval(if(rk_sea_band=="2", cve_id, null()))) AS sea_2, \
             dc(eval(if(rk_sea_band=="3", cve_id, null()))) AS sea_3, \
             dc(eval(if(rk_sea_band=="4", cve_id, null()))) AS sea_4 \
| where rk_from_t0=1 OR (rk_from_model=1 AND rk_stale=0) \
| `riskability_escalation_facts` \
| eval rk_adjust = case(rk_exposure_zone=="internet-facing", 0, \
        rk_exposure_zone=="internal", -5, rk_exposure_zone=="isolated", -15, true(), 0) \
      + case(rk_version_match=="yes", 10, rk_version_match=="unknown", -5, \
             rk_version_match=="no", -25, true(), 0) \
      + case(asset_criticality=="high", 5, asset_criticality=="low", -5, true(), 0) \
| eval priority_score = case( \
      rk_from_t0=1 AND rk_t0_tier=="P0", 95, \
      rk_from_t0=1, 10, \
      1=1, min(max(coalesce(tonumber(rk_base), 50) + rk_adjust, 0), 100)) \
| eval priority_tier = case( \
      rk_from_t0=1, rk_t0_tier, \
      priority_score>=85, "P0", priority_score>=65, "P1", \
      priority_score>=45, "P2", priority_score>=25, "P3", true(), "P4") \
| eval deterministic_tier = priority_tier \
| eval rk_esc_rank = case(priority_tier=="P0", 0, priority_tier=="P1", 1, \
      priority_tier=="P2", 2, priority_tier=="P3", 3, priority_tier=="P4", 4, 1=1, -1) \
| eval rk_esc_floor = case(`riskability_escalation_floor`=="P0", 0, \
      `riskability_escalation_floor`=="P1", 1, `riskability_escalation_floor`=="P2", 2, \
      `riskability_escalation_floor`=="P3", 3, 1=1, 4) \
`riskability_escalation_rules` \
| eval escalation_rules = coalesce(mvjoin(mvdedup(rk_esc_hits), " "), "") \
| eval escalated = if(rk_esc_bump = 1 AND rk_from_t0 = 0 \
      AND rk_esc_rank > rk_esc_floor, 1, 0) \
| eval rk_esc_to = if(escalated = 0, rk_esc_rank, \
      max(rk_esc_rank - `riskability_escalation_cap`, rk_esc_floor)) \
| eval priority_tier = case(escalated = 0, priority_tier, rk_esc_to = 0, "P0", \
      rk_esc_to = 1, "P1", rk_esc_to = 2, "P2", rk_esc_to = 3, "P3", 1=1, "P4") \
| eval priority_score = if(escalated = 0, priority_score, \
      max(priority_score, case(priority_tier=="P0", 85, priority_tier=="P1", 65, \
          priority_tier=="P2", 45, priority_tier=="P3", 25, 1=1, priority_score))) \
| eval asset_id = hostname, \
       exposure_zone = rk_exposure_zone, \
       version_match = rk_version_match, \
       kev = if(rk_is_kev=1, "true", "false"), \
       analysis_source = if(rk_from_t0=1, "T0", coalesce(rk_src, "model")), \
       analysed_at = coalesce(rk_at, now()), \
       confidence = coalesce(rk_conf, if(rk_from_t0=1, 0.9, 0.0)), \
       rationale = coalesce(rk_rationale, "Deterministic rule: " . deterministic_tier . "."), \
       recommended_action = coalesce(rk_action, "monitor"), \
       recommended_mitigations = coalesce(rk_mit, mvappend( \
            "Apply the vendor patch immediately", \
            "Verify compensating controls (WAF, EDR, segmentation)")), \
       attck_techniques = coalesce(rk_tech, ""), \
       run_id = "EXP" . strftime(now(), "%Y%m%d-%H%M%S") \
| eval rationale = if(escalated = 0, rationale, mvindex(mvdedup(rationale), 0) \
      . " Escalated one tier, " . deterministic_tier . " to " . priority_tier \
      . ", by escalation rule: " . escalation_rules . ".") \
| eval _time = now() \
| eventstats dc(asset_id) AS cve_asset_count BY cve_id \
| appendpipe [ stats count AS findings, dc(cve_id) AS cves, dc(asset_id) AS assets, count(eval(priority_tier=="P0")) AS p0, count(eval(priority_tier=="P1")) AS p1, max(analysed_at) AS latest_at, latest(run_id) AS run_id, \
    max(sea_0) AS sea_0, max(sea_1) AS sea_1, max(sea_2) AS sea_2, max(sea_3) AS sea_3, max(sea_4) AS sea_4 | eval _key = "overview", computed_at = now() | outputlookup riskability_aistate_lookup append=true ] \
| where isnotnull(cve_id) \
| appendpipe [ where priority_tier=="P0" OR priority_tier=="P1" \
    | fields _time, run_id, cve_id, asset_id, package, title, severity, epss, kev, exposure_zone, \
            version_match, cve_asset_count, priority_tier, priority_score, confidence, \
            recommended_action, rationale, analysis_source, analysed_at, \
            deterministic_tier, escalated, escalation_rules \
    | collect index=`riskability_index_ai_alerts` sourcetype=riskability:ai:alert ] \
| fields _time, run_id, cve_id, asset_id, package, ecosystem, path, scope_id, scope, \
        severity, epss, kev, title, exposure_zone, version_match, cve_asset_count, \
        asset_criticality, priority_tier, priority_score, confidence, rationale, \
        recommended_action, recommended_mitigations, attck_techniques, analysis_source, analysed_at, \
        deterministic_tier, escalated, escalation_rules \
| collect index=`riskability_index_ai_prioritized` sourcetype=riskability:ai:prioritized
# Shaped with "fields", not "table", for the reason spelled out on the queue
# search: table drops _time, and collect then files the event at the search's
# dispatch earliest, thirty days back here, where the fourteen day retention on
# riskability_ai_prioritized deleted it almost at once. The index held nothing
# at all while this search reported hundreds of results an hour, every hour.
# version_match is produced by an eval above. The old field list asked for
# "rk_version_match AS version_match", which drops both names rather than
# renaming either, so no prioritised row ever carried a version_match.
# asset_criticality is evaluated here from the same macro the queue search
# uses. It was named in the field list and nowhere else, so it reached every
# prioritised row empty and the case() term in rk_adjust was permanently 0
# while this stanza's description said criticality nudges the score. Reading
# the macro rather than hardcoding "medium" is the point: a site that
# overrides it gets what it asked for on both sides of the pipeline.
# Freshness here is the seven day rk_stale clock, deliberately, and there is
# no signature gate. The queue search compares signatures because it is
# deciding what to spend a model call on, and re-analysing after an advisory
# changes is exactly what it is for. Dropping a finding here on the same test
# would blank it from the dashboards for up to an hour after any advisory edit,
# and would turn any future divergence between the SPL signature and
# ai_config.verdict_sig into a silent fleet-wide dropout rather than a wasted
# model call. A verdict computed for slightly older advisory text is worth
# more than no verdict at all, and it is stamped with analysed_at either way.
# _time is the time of THIS run, not analysed_at. A cache hit can be a week old,
# and riskability_ai_results_latest keeps only the events at the newest _time
# within a run_id, so stamping each row with its verdict's own age would have
# hidden every cached row from the dashboards and left the daily silence alert
# firing on a pipeline that had just run perfectly. The verdict's age is not
# lost: it travels as the analysed_at field, which is what it is for.
# cve_asset_count answers a question the score cannot: the score is a
# fleet-worst-case maximum that per-asset SPL only steps DOWN, so one CVE
# confirmed on a single host sits next to one unconfirmed on ten thousand. It
# is carried, not scored. Ordering within a tier is the dashboard's decision.
# The P0/P1 write to riskability_ai_alerts is what makes that index real: it
# was defined, documented as feeding SOAR and chat, and written to by nothing
# since the HEC design it belonged to was abandoned. It runs inside an
# appendpipe so the second collect cannot disturb the first, and it shapes with
# fields for the same _time reason as everything else here.
# The isnotnull(cve_id) guard drops the overview row: outputlookup passes its
# input through, so the appendpipe above adds that one summary row to the
# stream, and it would otherwise be collected as a prioritised finding with a
# run_id and nothing else in it.
# The escalation step, and the four things it is not allowed to do.
#
# A rule raises a finding by `riskability_escalation_cap` tiers and can never
# take it past `riskability_escalation_floor`. Both are macros rather than
# numbers written here, because both are invariants a site can weigh rather
# than arithmetic this search invented, and both are argued where they are
# defined. Shipped at one and "P1" they say that a rule may move a finding one
# step and that the top of the queue stays what the five deterministic signals
# agreed on. The rank arithmetic is written against the two macros so that
# changing either is a one line decision with no second place to keep in step:
# a bump is applied only to a finding ranked worse than the floor and the
# result is clamped at the floor, so a P1 finding a rule matched stays P1
# rather than quietly reaching P0.
#
# A row matched by six rules moves as far as a row matched by one. The cap is
# on the finding rather than on the rule, for the reason the cap macro sets
# out: rules are independent predicates over one finding, and three of the four
# shipped examples can be true at once without any of them being wrong.
#
# T0 still wins. rk_from_t0 = 0 is a term in the escalated test, so a finding
# the deterministic override decided keeps its 95 or its 10 and the tier that
# goes with it, and the rules that fired on it are recorded without moving it.
#
# escalation_rules names the rules that fired whether or not a bump followed,
# and escalated says whether one did. They are kept apart deliberately. A rule
# that fires on half the estate and is withheld every time because those
# findings already sit at the floor looks harmless in the tier counts and is
# not, and the difference between these two fields is the only place it shows.
#
# mvjoin before any concatenation, for the reason the queue search records at
# length. The compiled rule set hands back a MULTIVALUE field, SPL string
# concatenation with a multivalue field yields NULL rather than a joined
# string, and a null escalation_rules would read as "no rule fired" on exactly
# the rows where several did. The rationale suffix runs the same guard over
# rationale itself, which is single valued only because the verdict cache is
# keyed on cve_id, and that is not an assumption this line should have to make.
#
# The score is raised to the floor of the new tier rather than left where it
# was. Nothing in the app recomputes a tier from a score, so this moves no
# ordering by itself, but a row reading P1 at score 47 is a row where two
# columns of the same table disagree, and the next person to sort by score gets
# a queue that does not match the tiers printed beside it.
#
# Two macros here are not SPL written in this file, and both are deliberate.
# `riskability_escalation_facts` puts the rk_esc_ fields a rule may name onto
# the finding and is the only place any of them is computed, which is why this
# stanza computes none of its own: two definitions of one measured fact is how
# a rule and the report that replayed it come to different answers about the
# same fleet. `riskability_escalation_rules` expands to one eval that sets
# rk_esc_hits to the names of the ENABLED rules whose "when" is true on the
# row, and to null when none of them are. SPL evaluates the predicates because
# SPL is the interpreter this app already ships; the compiler's job is the
# validation, which is the control, and the conf file is where a rule is read
# and argued with.
#
# The facts macro runs after the freshness gate rather than before it, so it
# does its lookups on the rows that survived, and it runs well before the final
# eval overwrites confidence with the model's number, which is a placement its
# own comment block asks for.
#
# deterministic_tier and escalated ride both writes so that one question can be
# asked later from the data alone: did the findings a rule raised turn out to
# matter more than the findings it did not raise in the same deterministic
# band. deterministic_tier IS that band, escalated splits it into the raised
# and the matched control, and the outcomes that settle it (a later KEV
# listing, an EPSS band crossing, a patch rather than a dismissal) arrive in
# later runs of this same index. Without both fields on every row the
# comparison has no control group, and the only answer available is how many
# findings were raised, which is evidence of nothing at all.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
disabled = 1
enableSched = 1
cron_schedule = 55 * * * *
alert.track = 0
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_ai

[Riskability AI - results stopped arriving]
# stats count returns one row even over zero events, so an empty day is one
# row with results=0 and the alert fires; any result at all filters itself
# out and the alert stays quiet.
description = Fires when AI prioritisation is switched on but no prioritised \
  result has arrived for a full day. The GPU box has its own failure modes \
  and none of them are visible from Splunk except through silence. Disabled \
  together with the other AI searches when AI analysis is switched off.
search = `riskability_ai_results` earliest=-24h \
| stats count AS results \
| where results = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
disabled = 1
enableSched = 1
cron_schedule = 15 6 * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_ai

# ---------------------------------------------------------------------------
# The escalation engine's own controls
#
# Neither of these two searches touches the AI settings, the model endpoint or
# the verdict cache for anything except the tier a finding already carries.
# They are here because the escalation step is a rule engine rather than an AI
# feature, and a rule engine a person can only reason about while the AI switch
# is on is a rule engine nobody can audit.
# ---------------------------------------------------------------------------

[Riskability - replay escalation rules]
description = Every rule in riskability_escalations.conf, switched on or not, \
  replayed against the open findings as they stand right now: how many \
  findings each rule matches, on how many hosts and CVEs, and which tier every \
  match would move from and to. Run it before switching a rule on, and again \
  after. Not scheduled, because it answers a question at the moment somebody \
  asks it, and because answering it costs a pass over every open finding.
search = | `riskability_open_findings` \
| eval rk_key = if(match(coalesce(scope_id, ""), "^container:"), \
      "container:" . substr(replace(scope_id, "^container:", ""), 1, 12), package) \
| lookup riskability_reach_lookup hostname, rk_key OUTPUT reach_class, reach_rank \
| lookup riskability_advisory_lookup cve_id OUTPUT cvss_score \
| lookup riskability_aiverdicts_lookup cve_id OUTPUT priority_tier AS rk_tier, priority_score AS rk_base, analysed_at AS rk_at \
| eval rk_is_kev = if(isnotnull(kev_added) AND kev_added!="", 1, 0) \
| eval rk_version_match = case(confidence=="high", "yes", confidence=="informational", "no", 1=1, "unknown") \
| eval rk_exposure_zone = case(coalesce(reach_rank, -9)>=3, "internet-facing", \
      coalesce(reach_rank, -9)>=1, "internal", reach_class=="no listening port", "isolated", \
      coalesce(reach_rank, -9)==-1, "unknown", 1=1, "internal") \
| eval asset_criticality = `riskability_ai_asset_criticality` \
| eval rk_t0_tier = case( \
      coalesce(tonumber(cvss_score),0) < 4 AND coalesce(tonumber(epss),0)*1000 < 50 AND rk_is_kev=0 AND rk_exposure_zone!="internet-facing" AND rk_version_match=="no", "P4", \
      rk_is_kev=1 AND rk_exposure_zone=="internet-facing" AND rk_version_match=="yes" AND coalesce(tonumber(cvss_score),0) >= 7, "P0", \
      1=1, null()) \
| eval rk_from_t0 = if(isnotnull(rk_t0_tier), 1, 0) \
| eval rk_from_model = if(isnotnull(rk_tier), 1, 0) \
| eval rk_stale = if(isnull(rk_at) OR rk_at < now() - 604800, 1, 0) \
| eval rk_scored = if(rk_from_t0=1 OR (rk_from_model=1 AND rk_stale=0), 1, 0) \
| eval rk_adjust = case(rk_exposure_zone=="internet-facing", 0, \
        rk_exposure_zone=="internal", -5, rk_exposure_zone=="isolated", -15, true(), 0) \
      + case(rk_version_match=="yes", 10, rk_version_match=="unknown", -5, \
             rk_version_match=="no", -25, true(), 0) \
      + case(asset_criticality=="high", 5, asset_criticality=="low", -5, true(), 0) \
| eval priority_score = case( \
      rk_from_t0=1 AND rk_t0_tier=="P0", 95, \
      rk_from_t0=1, 10, \
      1=1, min(max(coalesce(tonumber(rk_base), 50) + rk_adjust, 0), 100)) \
| eval priority_tier = case( \
      rk_from_t0=1, rk_t0_tier, \
      priority_score>=85, "P0", priority_score>=65, "P1", \
      priority_score>=45, "P2", priority_score>=25, "P3", true(), "P4") \
| `riskability_escalation_facts` \
| eval rk_esc_rank = case(priority_tier=="P0", 0, priority_tier=="P1", 1, \
      priority_tier=="P2", 2, priority_tier=="P3", 3, priority_tier=="P4", 4, 1=1, -1) \
| eval rk_esc_floor = case(`riskability_escalation_floor`=="P0", 0, \
      `riskability_escalation_floor`=="P1", 1, `riskability_escalation_floor`=="P2", 2, \
      `riskability_escalation_floor`=="P3", 3, 1=1, 4) \
`riskability_escalation_rules_all` \
`riskability_escalation_rules` \
| eval rk_esc_on = " " . coalesce(mvjoin(mvdedup(rk_esc_hits), " "), "") . " " \
| eval from_tier = if(rk_scored=1, priority_tier, "unscored") \
| eval rk_would = if(rk_scored=1 AND rk_from_t0=0 AND rk_esc_rank > rk_esc_floor, 1, 0) \
| eval rk_esc_to = if(rk_would=0, rk_esc_rank, \
      max(rk_esc_rank - `riskability_escalation_cap`, rk_esc_floor)) \
| eval to_tier = case(rk_would=0, "no change", rk_esc_to=0, "P0", rk_esc_to=1, "P1", \
      rk_esc_to=2, "P2", rk_esc_to=3, "P3", 1=1, "P4") \
| eval rule = rk_esc_hits_all \
| where isnotnull(rule) \
| mvexpand rule \
| eval enabled = if(match(rk_esc_on, " " . rule . " "), "yes", "no") \
| stats count AS findings, dc(hostname) AS hosts, dc(cve_id) AS cves \
        BY rule, enabled, from_tier, to_tier \
| appendpipe [ stats count AS rk_rows | where rk_rows = 0 \
    | eval rule = "no rule in the file matched any open finding", enabled = "", \
           from_tier = "", to_tier = "", findings = 0, hosts = 0, cves = 0 ] \
| sort 0 rule, from_tier, to_tier \
| table rule, enabled, from_tier, to_tier, findings, hosts, cves
# Why a replay exists at all.
#
# riskability_escalations.conf argues every rule it ships in prose, and prose
# cannot say "this one bumps a third of your queue". A person deciding whether
# to switch a rule on is the unsound component in this design: the predicate is
# evaluated by the search head and cannot lie, but the decision to accept it is
# made by reading a description, and a description is exactly as convincing for
# a rule that fires twice as for one that fires on eight thousand findings.
# This search is what replaces reading with looking.
#
# It replays the DISABLED rules too, which is the whole point of it. Every rule
# ships enabled = 0, so the only useful question about one is what it would do,
# and a report that could only describe the rules already running would arrive
# exactly one decision too late.
#
# from_tier is "unscored" rather than a tier for a finding whose CVE has no
# fresh verdict, and those rows are kept rather than dropped. A rule's match
# count is a fact about the fleet and needs nothing from the AI pipeline; the
# tier it would move is only defined for a finding that carries one. Splitting
# the two means this search answers the first question on an instance where AI
# has never been switched on at all, which is where somebody extending the rule
# language most needs an answer.
#
# A rule reporting zero here is a result and not an empty screen: on this fleet
# the predicate is false on every open finding. It can also be the symptom of a
# fact the app does not measure, and riskability_escalations.conf ships two
# rules in exactly that position. Which of the two it is depends on whether the
# validator's allowlist and `riskability_escalation_facts` agree, because a
# name the allowlist accepts and the macro does not compute is null on every
# row, and a comparison against null is false rather than an error. This report
# is where either one shows, which is most of the argument for running it
# before switching anything on.
#
# The scoring block above is a copy of the one in "Riskability AI - expand
# verdicts to findings" and has to be kept in step with it by hand. That is a
# real cost and it is stated here rather than hidden: the alternative was to
# read the tiers back out of riskability_ai_prioritized, which would have made
# the blast radius of a rule unanswerable on any instance where the AI switch
# had never been turned on. A shared macro would remove the duplication and
# belongs in macros.conf.
#
# enabled is decided by matching the rule's name between spaces in the enabled
# set, so a rule name is treated as a regular expression for the length of that
# test. Stanza names limited to letters, digits and underscores are safe there,
# which the validator has its own reasons to insist on.
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 0
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - escalation rules are rescoring the queue]
description = Fires when the enabled escalation rules moved more than 5% of \
  the findings in the newest prioritisation run, or when more than a third of \
  everything sitting at P0 or P1 got there by a rule rather than by the five \
  scoring signals. The test is on the whole enabled rule SET and never on one \
  rule, because a set is what nobody is looking at.
search = `riskability_ai_results` earliest=-2h \
| eventstats max(_time) AS rk_newest \
| where _time >= rk_newest - 1 \
| eval rk_esc = if(coalesce(tonumber(escalated), 0) = 1, 1, 0) \
| stats count AS findings, sum(rk_esc) AS bumped, \
        count(eval(priority_tier=="P0" OR priority_tier=="P1")) AS alerting, \
        count(eval(rk_esc=1 AND (priority_tier=="P0" OR priority_tier=="P1"))) AS alerting_bumped, \
        values(eval(if(rk_esc=1, escalation_rules, null()))) AS rk_sets, \
        latest(run_id) AS run_id \
| where findings > 0 \
| eval bumped_share = round(100 * bumped / findings, 1), \
       alerting_bumped_share = if(alerting > 0, round(100 * alerting_bumped / alerting, 1), 0) \
| where bumped_share > 5 OR alerting_bumped_share > 33 \
| eval rules_firing = coalesce(mvjoin(mvdedup(rk_sets), "; "), "") \
| eval problem = "the enabled escalation rules moved this share of the newest \
run, which is the shape of a rescoring rather than of a set of exceptions" \
| eval remedy = "run the saved report Riskability - replay escalation rules \
for the blast radius of each rule on its own, switch the broad ones off in \
local/riskability_escalations.conf, and take any signal that fires on nearly \
everything to the scorer, where it is weighed against the other five instead \
of added on top of them" \
| table run_id, findings, bumped, bumped_share, alerting, alerting_bumped, \
        alerting_bumped_share, rules_firing, problem, remedy
# Why the threshold is on the set, and why it is these two numbers.
#
# Individually reasonable rules compose. Ten defensible acceptances can rebuild
# the flat distribution the deterministic scoring was built to replace, one
# sensible decision at a time, and no check on a single rule can see that
# happening: every one of the ten is behaving exactly as its description says.
# The share is the only quantity that carries the composition, so the share is
# what is watched.
#
# Five per cent of the run. The deterministic scoring puts about one per cent
# of findings above the waterline, against the eighty-two per cent the
# model-assigned priority it replaced put there. A rule set moving five per
# cent of everything is therefore moving several times the entire
# above-waterline population by a tier every hour, and whatever each rule says
# about itself, that is a rescoring of the queue. Below a few per cent the
# number says nothing on its own, which is why the alert sits above that band
# rather than inside it.
#
# A third of the alert path. P0 is withheld from every rule, so a bump lands at
# P1 at the highest, and P1 is the top of what any rule can reach. The share of
# P0 and P1 that arrived by rule is the one number that says who is setting the
# waterline a person actually reads, and a third of it is where the answer
# stops being "the measurements, with exceptions".
#
# Neither number is tuned to an observed fleet. They are argued from the
# distribution this app already measured on 1,020 findings and should be
# re-argued against a real rule set rather than treated as measurements.
#
# It ships enabled while the pipeline it watches ships disabled, deliberately.
# A guard that is switched off by the same switch as the thing it guards is not
# a guard. It costs one small search an hour over an index that is empty until
# AI is turned on, and the "findings > 0" test is what keeps an empty index
# from firing it: stats with no BY clause returns one row over zero events, and
# without that test the row would be an alert about a pipeline that has never
# run. The price of shipping it on is a warning in its own job log on an
# install without TA-riskability-ai, where the index it reads does not exist at
# all. That is the cheaper of the two failures by a distance: the other one is
# a rule set quietly rescoring a queue with the only thing that would have said
# so switched off beside it.
#
# escalated and escalation_rules are read with coalesce because events written
# by an older build of the expansion search carry neither, and a run that
# straddles an upgrade must report the escalations it can see rather than
# nothing at all.
#
# rk_sets is joined with mvjoin before it goes anywhere near a string. values()
# returns a multivalue field, and concatenating one yields NULL rather than a
# joined string, which would empty the one column naming the rules responsible.
dispatch.earliest_time = -2h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 20 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
request.ui_dispatch_app = riskability

[Riskability - roll up software vendors]
description = One row per distinct package name in the fleet, carrying the \
  vendor the inventory reported for it. Small (hundreds of rows), because a \
  vendor is a property of the software rather than of the host holding it.
# Why this exists: the AI page could name a CVE but not whose software the CVE
# is in. swinv reports vendor ("Microsoft Corporation") on the inventory
# record, the matcher's findings state does not carry it, and the verdict cache
# is built from the findings state, so the one field that answers "whose
# software is this" was dropped two steps before anything could display it.
# By name rather than by (host, name): when two hosts disagree about the
# vendor string for the same product the difference is packaging noise, not a
# fact worth carrying per host, and this table labels a CVE-level verdict that
# has no host in the first place.
# values() and not latest(): riskability_latest_inventory ends in its own
# stats, which drops _time, and latest() without _time is documented by
# Splunk as possibly invalid and warns at runtime. values() is sorted, so
# mvindex 0 is the same answer on every run, which is what a cache-adjacent
# label needs.
search = `riskability_latest_inventory` \
| where isnotnull(vendor) AND vendor != "" \
| stats values(vendor) AS vendor BY name \
| eval vendor = mvindex(vendor, 0) \
| rename name AS package \
| eval _key = package \
| table _key, package, vendor \
| outputlookup riskability_vendor_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
cron_schedule = 33 * * * *
alert.track = 0

[Riskability - snapshot host addresses]
description = One row per (host, address) recording the window during which this app OBSERVED the \
  host holding that address, plus the guards a reader needs before trusting that window. It exists \
  for one reason: to make the join between a firewall log and a host safe, and to refuse the join \
  when it is not. \
  A firewall log records an address at time T1. Inventory says a host holds that address at time \
  T2. Joined naively the app would conclude the host's vulnerable service was exposed, when at T1 \
  the address may have belonged to a different machine, a NAT mapping, a container, a virtual \
  address, a load balancer or an expired DHCP lease. Each side is correct alone and the join \
  manufactures an entity that never existed. Every field here exists to detect that rather than \
  commit it. \
  addr_first_seen and addr_last_seen are OBSERVATION bounds, not hold bounds, and the difference \
  is not pedantry. The collector timestamps a scan and never an address: there is no first or last \
  seen for an address anywhere in its output, and no delta record fires when a host's addressing \
  changes. So this job can say the host was seen holding the address at both ends of that window \
  and cannot say when it acquired or released it. \
  max_gap is why the window alone is not enough. A host seen holding an address in January and \
  again in June has an interval covering both, and an edge logged in March sits inside it while \
  proving nothing. The largest gap between consecutive observations is carried so a reader can \
  refuse an interval that is not continuous, and the merge widens it to include the gap between \
  the rows being merged rather than only the gaps inside each. \
  claimants is the contested-address count and it is the single most important field here. An \
  address more than one host has claimed cannot be attributed to either of them, and a DHCP lease \
  that moved between two machines is exactly the case that must never resolve. It is not a fault \
  to clean up. It is the signal that makes the evidence join refuse. \
  machine_id is a second opinion on identity, carried because a hostname is a mutable label and \
  two machines can wear it in sequence. \
  Carried forward rather than replaced, for the same reason host scan times is. A host that stops \
  reporting keeps its address history: losing it would turn every past edge to that host into an \
  unresolvable one and silently downgrade real evidence to unknown. Only the retire job forgets a \
  host, on the age of its last contact, and a host with no row in host scan times passes the gate \
  so a broken or empty hoststate cannot empty this collection. \
  observations is REPLACED rather than accumulated, and that is deliberate. It counts the distinct \
  scans inside the retained window that reported the address. The meta index keeps thirty days, so \
  a running total would drift upwards with no way to correct it and would read as confidence the \
  data cannot support. A host that reported nothing this run keeps the count it had. \
  Addresses come from the macro riskability_host_addresses, not from here, because that source is \
  about to change. The collector records host.ipv4 and host.ipv6, but those fields reach only its \
  JSON, CycloneDX and HTML outputs and appear on NO NDJSON record, which is the only thing this \
  app ingests. Verified against every NDJSON file in this repository. Until that changes the macro \
  derives addresses from specific listening binds, which proves the host holds the address and \
  sees only addresses something is listening on. A host binding only wildcards contributes \
  nothing, and its absence from this collection says nothing whatever about the addresses it \
  holds. That is what addr_source records and what the per-host companion row exists to say. \
  last_scan_id is written null and that is honest rather than lazy. scan_id appears on exactly one \
  NDJSON record per scan, the heartbeat, and the addresses here come from exposure records, which \
  carry no scan_id. Recovering it would mean joining every address row back through (hostname, \
  scanned_at) to the heartbeat, which is a real cost for a field nothing reads yet. The column is \
  declared, so it is written deliberately empty rather than left to look measured.
search = `riskability_host_addresses` \
| eval address = lower(address) \
| eval addr_first_seen = rk_addr_first, addr_last_seen = rk_addr_last \
| eval observations = rk_addr_obs, max_gap = rk_addr_gap \
| eval _key = hostname . "|" . address \
| table _key, hostname, address, family, addr_source, addr_first_seen, addr_last_seen, \
    observations, max_gap \
| inputlookup append=true riskability_hostaddr_lookup \
| eventstats min(addr_first_seen) AS rk_first, max(addr_last_seen) AS rk_last, \
    max(max_gap) AS rk_maxgap, min(addr_last_seen) AS rk_min_last, \
    max(addr_first_seen) AS rk_max_first, count AS rk_rows BY _key \
| eval rk_join_gap = if(rk_rows > 1 AND tonumber(rk_max_first) > tonumber(rk_min_last), \
    tonumber(rk_max_first) - tonumber(rk_min_last), 0) \
| eval max_gap = if(tonumber(coalesce(rk_maxgap, 0)) > rk_join_gap, rk_maxgap, rk_join_gap) \
| eval addr_first_seen = rk_first, addr_last_seen = rk_last \
| dedup _key \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan AS rk_hls, \
    machine_id AS machine_id \
| eval rk_gone = if(isnotnull(rk_hls) AND \
    (now() - tonumber(rk_hls)) > (`riskability_host_retire_days` * 86400), 1, 0) \
| where rk_gone = 0 \
| eventstats dc(hostname) AS claimants BY address \
| eval addr_scope = case( \
      cidrmatch("127.0.0.0/8", address), "loopback", \
      address == "::1", "loopback", \
      cidrmatch("169.254.0.0/16", address), "link-local", \
      match(address, "^fe80:"), "link-local", \
      cidrmatch("100.64.0.0/10", address), "cgnat", \
      cidrmatch("10.0.0.0/8", address), "private", \
      cidrmatch("172.16.0.0/12", address), "private", \
      cidrmatch("192.168.0.0/16", address), "private", \
      match(address, "^f[cd]"), "private", \
      cidrmatch("0.0.0.0/0", address), "public", \
      match(address, ":"), "public", \
      1=1, "unknown") \
| eval last_scan_id = null() \
| eval rolled_at = now() \
| table _key, hostname, address, family, addr_scope, addr_source, addr_first_seen, \
    addr_last_seen, observations, max_gap, claimants, machine_id, last_scan_id, rolled_at \
| outputlookup riskability_hostaddr_lookup
dispatch.earliest_time = -30d
dispatch.latest_time = now
enableSched = 1
# After the listening port snapshot at :22, which is where the addresses come
# from while the collector does not put them on the heartbeat, and before the
# evidence job at :34 that reads this collection.
cron_schedule = 31 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot host address coverage]
description = Whether a host reported addresses at all, and whether its collector could have. \
  Read beside the address collection the way link coverage is read beside loaded libraries: no row \
  means never assessed, and never assessed must never render as "holds no addresses" or grade as \
  "not observed". \
  The distinction this row exists to draw is not decoration. A host with no address rows may be a \
  host on a segment nothing logs, or it may be a host whose every listener binds a wildcard, which \
  the bind derived address source cannot see at all. Those look identical in the address \
  collection and are completely different facts, and only the second is a limitation of this app \
  rather than of the site. \
  swinv_version and schema_version answer the "could have" half. When the collector begins \
  emitting host addresses on the heartbeat, the version on this row is what tells an operator \
  which hosts are capable of the better source and which are still on the weaker one, without \
  anybody having to guess from an empty result. \
  contested_addresses is the host's own count of addresses another host has also claimed. It \
  belongs here and not only on the address rows because it answers the question an operator asks \
  before trusting any of this: is this machine's identity stable enough for the join to mean \
  anything at all.
search = | `riskability_hosts_seen` \
| fields hostname \
| eval rk_spine = 1 \
| inputlookup append=true riskability_hostaddr_lookup \
| eval rk_spine = coalesce(rk_spine, 0) \
| eval rk_v4 = if(rk_spine == 0 AND family == "ipv4", 1, 0) \
| eval rk_v6 = if(rk_spine == 0 AND family == "ipv6", 1, 0) \
| eval rk_contested = if(rk_spine == 0 AND tonumber(coalesce(claimants, 1)) > 1, 1, 0) \
| eval rk_addr_row = if(rk_spine == 0 AND isnotnull(address), 1, 0) \
| stats max(rk_spine) AS rk_spine, sum(rk_addr_row) AS addresses, sum(rk_v4) AS ipv4_addresses, \
    sum(rk_v6) AS ipv6_addresses, sum(rk_contested) AS contested_addresses, \
    values(addr_source) AS rk_src BY hostname \
| where rk_spine = 1 \
| eval addresses = coalesce(addresses, 0) \
| eval ipv4_addresses = coalesce(ipv4_addresses, 0) \
| eval ipv6_addresses = coalesce(ipv6_addresses, 0) \
| eval contested_addresses = coalesce(contested_addresses, 0) \
| eval addr_source = if(addresses > 0, mvjoin(mvdedup(rk_src), " "), "none") \
| append \
    [ search sourcetype=riskability:swinv record_type="heartbeat" \
        index=`riskability_index_meta` \
      | stats latest(swinv_version) AS rk_sv, latest(schema_version) AS rk_sc BY hostname \
      | eval rk_hb = 1 \
      | fields hostname, rk_sv, rk_sc, rk_hb ] \
| eventstats max(rk_sv) AS swinv_version, max(rk_sc) AS schema_version BY hostname \
| where isnull(rk_hb) \
| eval swinv_version = coalesce(swinv_version, "unknown") \
| eval schema_version = coalesce(schema_version, "unknown") \
| eval assessed_at = now(), rolled_at = now() \
| eval _key = hostname \
| table _key, hostname, addresses, ipv4_addresses, ipv6_addresses, contested_addresses, \
    addr_source, swinv_version, schema_version, assessed_at, rolled_at \
| outputlookup riskability_hostaddr_hoststate_lookup
dispatch.earliest_time = -30d
dispatch.latest_time = now
enableSched = 1
# Immediately after the address snapshot it summarises.
cron_schedule = 32 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - assess observed permitted traffic]
description = For every listening port carrying an open finding, whether a permitted flow from a \
  declared entry point to that host's own address and that port has actually been logged, what the \
  evidence was, and how far the app is willing to stand behind it. \
  This is OBSERVED PERMITTED TRAFFIC EVIDENCE and it is deliberately not called reachability. A \
  permitted edge proves that at some time T a flow traversed an enforcement point that allowed it \
  and logged it. It does not prove the rule is still in place, that the path is bidirectional, that \
  anything answered at L7, or that the host still holds the address. The grade is never a boolean \
  for that reason. \
  It narrows the gap, it does not close it. The bind derived exposure this app already computes \
  says what a socket is bound to, which the collector can see because it runs on the host, and \
  which says nothing about the NAT, firewall, security group, reverse proxy or load balancer in \
  front of it. Firewall logs record exactly that layer and nothing about the host. Neither is \
  exposure on its own and this job does not pretend the pair is either. \
  Four grades, and unknown NEVER collapses to not exposed. Confirmed observed is a permitted flow \
  from an entry point within the freshness window. Historically observed is the same edge gone \
  quiet. Not observed is the only negative claim and it requires all of: firewall data present, an \
  entry point declared, the feed fresh, the host visible in the graph, a constant pressure entry \
  point declared, and the host's identity at the address resolving cleanly. Everything else is \
  unknown, and the reason is written on the row rather than left for a reader to guess. \
  Missing firewall data reduces confidence, never the score. This job writes evidence and grades \
  and touches no weight, no tier and no priority. A site that has onboarded nothing gets a \
  collection full of unknown and an app that behaves exactly as it did before, which is the point: \
  the product must never report a host as unexposed because the customer did not send it data. \
  Absence of evidence is not evidence of absence, which is the position this app already takes \
  about link records and states in its own comments. \
  IDENTITY DRIFT IS THE FAILURE THIS JOB IS BUILT AROUND. A firewall log names an address, not a \
  host, and the app must not manufacture an equivalence between them. Every edge is resolved to a \
  host THROUGH the time window, and four separate guards must all pass. The address must resolve \
  to exactly one host, tested with mvcount before anything is read, because a contested address \
  returns every claimant as multivalue and taking the first would pick whichever the KV Store \
  happened to return, an answer with no meaning delivered with this app's credibility attached. \
  The claimants count must be one, which catches an address two hosts held in sequence even when \
  only one row survives. The edge must fall inside the observed hold window. And the largest gap \
  in that window must be no wider than the grace period, because an interval assembled from a scan \
  in January and a scan in June covers March while proving nothing about it. Any guard failing \
  writes the row with the ambiguity named on it and the grade unknown. Guessing would be worse \
  than saying nothing, because a wrong attribution here is indistinguishable from a right one \
  downstream. \
  identity_state is a six value enum rather than prose, and the values are the ones \
  bin/riskability/route.py already defines: resolved, stale, shared, outside estate, malformed \
  address, reassigned. A short enum sorts, groups and renders; the sentence explaining which guard \
  failed goes into observed_reason, where a reader who disagrees with a grade can see what to \
  argue with. reassigned is declared and never written here: it means another host demonstrably \
  held the address at that moment, and establishing that would require reading a second claimant's \
  window out of the same multivalue lookup result, which is exactly the positional multivalue \
  guess this job refuses to make. Those cases are graded shared instead, which is weaker and true. \
  An ambiguous edge is still expanded to every candidate host rather than dropped, so an operator \
  can see that a permitted flow reached an address one of their machines might have held. That is \
  information, and it can never raise a grade because ambiguous rows carry the unknown rank. \
  Coverage is computed here rather than read from elsewhere, from the same single pass over the \
  firewall index that produces the edges. It gates the difference between "not observed" and \
  "unknown", so a separate job would mean a second reduce over the firewall index and an ordering \
  hazard where a stale coverage row silently licenses a negative claim. A host is counted as \
  covered when one of its addresses appears as a DESTINATION in the graph AND the identity join \
  actually resolved that address to this host at the time of the edge; the operator facing \
  coverage report counts a host that appears anywhere, and says so. \
  The identity condition is not a refinement, it is the whole point. An address match alone is \
  time agnostic, so a host whose claim on an address expired days before the edge would be \
  counted visible on the strength of an edge this job had just REFUSED to attribute to it. \
  Coverage plus a constant pressure entry point is the sole licence for "not observed", the one \
  negative claim this app makes, so granting it on an unresolved identity produced exactly the \
  contradiction it exists to prevent: a row reading "this host appears in the graph" beside an \
  identity_state of "no edge to resolve". A host with no resolved edge now grades unknown, which \
  is weaker and true. \
  Edge rows are stamped with a sentinel package. stats DROPS a row whose BY field is null, and \
  the first reduce groups BY hostname, port, package, which only port rows ever carried. Every \
  edge row was therefore discarded before the reduce meant to merge it, so no firewall evidence \
  could reach a grade at all: the positive path was dead while the job still wrote a full ledger \
  of "unknown" and, worse, of "not observed", because coverage is computed by an eventstats that \
  runs BEFORE the reduce and so survived what the evidence did not. The sentinel keeps edge rows \
  out of any real package group; the second reduce, BY hostname and port, is where they merge. \
  hops is 1 on everything this job writes, and that is a decision rather than a limitation. The \
  artefact here is a per host and port ledger, not a generated multi-step attack narrative. \
  Permitted network edges are not exploitability edges: the hop after a compromise needs \
  privilege, credentials or a trust relationship and a firewall log records none of them. The \
  route expansion macro is the extension point and it ships resolving to a no-op. \
  Restricted to ports carrying an open finding, which is what makes this a ledger attached to \
  findings rather than a network inventory the app has no use for. \
  previous_grade is seeded with the CURRENT grade on any host this job has never assessed, which \
  is what stops the first run after installation reporting every observed path in the fleet as a \
  change in the world. On a host with no history there is no basis for calling anything new.
search = | `riskability_fw_edges` \
| `riskability_fw_entry_join` \
| eval dest_ip = lower(dest_ip) \
| eval port = replace(tostring(port), "\.0+$", "") \
| eventstats max(edge_last_seen) AS fw_last_event, count AS fw_edges \
| eval rk_esess = if(from_entry == 1, sessions, null()) \
| eval rk_efirst = if(from_entry == 1, edge_first_seen, null()) \
| eval rk_elast = if(from_entry == 1, edge_last_seen, null()) \
| eval rk_esrc = if(from_entry == 1, src_ip, null()) \
| stats sum(rk_esess) AS sessions, min(rk_efirst) AS edge_first_seen, \
    max(rk_elast) AS edge_last_seen, values(entry_text) AS rk_ent, \
    values(entry_pressure) AS rk_press, values(rk_esrc) AS rk_srcs, dc(rk_esrc) AS n_srcs, \
    max(from_entry) AS rk_from_entry, max(fw_last_event) AS fw_last_event, \
    max(fw_edges) AS fw_edges, max(entry_points_configured) AS rk_epc, \
    max(entry_constant_declared) AS rk_const_ep BY dest_ip, port \
| eval rk_constant_edge = if(isnotnull(mvfind(rk_press, "^constant$")), 1, 0) \
| eval n_entries = coalesce(mvcount(rk_ent), 0) \
| eval srcs_text = mvjoin(mvdedup(mvindex(rk_srcs, 0, 9)), " ") \
| eval dest_address = dest_ip \
| `riskability_fw_route_expand` \
| eval hops = 1 \
| lookup riskability_hostaddr_owner_lookup address AS dest_address OUTPUT hostname, \
    addr_first_seen, addr_last_seen, max_gap AS addr_max_gap, claimants, addr_source \
| eval rk_nhosts = coalesce(mvcount(hostname), 0) \
| eval rk_grace = `riskability_fw_identity_grace_days` * 86400 \
| eval rk_addr_ok = if(match(dest_address, "\.") OR match(dest_address, ":"), 1, 0) \
| eval rk_inside = if(tonumber(edge_last_seen) >= tonumber(addr_first_seen) \
      AND tonumber(edge_last_seen) <= tonumber(addr_last_seen), 1, 0) \
| eval identity_state = case(rk_addr_ok == 0, "malformed address", \
      rk_nhosts == 0, "outside estate", \
      rk_nhosts > 1, "shared", \
      tonumber(coalesce(claimants, 1)) > 1, "shared", \
      tonumber(coalesce(addr_max_gap, 0)) > rk_grace, "stale", \
      rk_inside == 1, "resolved", 1=1, "stale") \
| eval rk_ident_detail = case(rk_addr_ok == 0, \
        "the firewall record's destination is not an address this app can parse", \
      rk_nhosts == 0, "no host in inventory has been observed holding this address", \
      rk_nhosts > 1, "more than one host has been observed holding this address", \
      tonumber(coalesce(claimants, 1)) > 1, \
        "this address has been claimed by more than one host over time", \
      tonumber(coalesce(addr_max_gap, 0)) > rk_grace, \
        "the observed hold window has a gap wider than the grace period, so the edge may fall inside it", \
      rk_inside == 1, "the host was observed holding this address on both sides of the edge", \
      tonumber(edge_last_seen) > tonumber(addr_last_seen), \
        "the edge is newer than the last scan that saw this host holding the address", \
      1=1, "the edge is older than the first scan that saw this host holding the address") \
| eval rk_ev_rank = case(rk_from_entry != 1, 0, identity_state != "resolved", 1, \
      (now() - tonumber(edge_last_seen)) <= (`riskability_fw_fresh_days` * 86400), 3, 1=1, 2) \
| eval hostname = coalesce(hostname, "__unmapped__") \
| mvexpand hostname \
| eval rk_any_edge = if(identity_state == "resolved", 1, 0) \
| eval rk_row = "edge" \
| fields hostname, port, dest_address, sessions, edge_first_seen, edge_last_seen, hops, \
    rk_ent, rk_press, rk_constant_edge, n_entries, srcs_text, n_srcs, identity_state, \
    rk_ident_detail, \
    rk_ev_rank, rk_row, rk_any_edge, fw_last_event, fw_edges, rk_epc, rk_const_ep, \
    addr_first_seen, addr_last_seen, addr_max_gap, claimants, addr_source \
| inputlookup append=true riskability_exposure_lookup \
| eval rk_row = coalesce(rk_row, "port") \
| inputlookup append=true riskability_findings_state_lookup \
    where status="open" AND accepted!="1" \
| eval rk_row = coalesce(rk_row, "finding") \
| eval port = replace(tostring(port), "\.0+$", "") \
| eval package = case(rk_row == "port", coalesce(package, "unattributed"), \
      rk_row == "edge", "__edge__", 1=1, package) \
| eval rk_is_finding = if(rk_row == "finding", 1, 0) \
| eventstats sum(rk_is_finding) AS rk_pkg_findings BY hostname, package \
| where rk_row != "finding" \
| eval rk_is_port = if(rk_row == "port", 1, 0) \
| eventstats max(rk_any_edge) AS rk_host_covered BY hostname \
| eventstats max(fw_last_event) AS fw_last_event, max(fw_edges) AS fw_edges, \
    max(rk_epc) AS rk_epc, max(rk_const_ep) AS rk_const_ep \
| stats max(rk_is_port) AS rk_is_port, values(protocol) AS rk_protos, \
    max(rk_pkg_findings) AS rk_pf, max(rk_ev_rank) AS rk_ev_rank, max(sessions) AS sessions, \
    min(edge_first_seen) AS edge_first_seen, max(edge_last_seen) AS edge_last_seen, \
    max(hops) AS hops, values(rk_ent) AS rk_ent, values(dest_address) AS rk_dests, \
    values(identity_state) AS rk_idents, values(rk_ident_detail) AS rk_idet, \
    max(rk_constant_edge) AS rk_constant_edge, \
    max(n_entries) AS n_entries, values(srcs_text) AS rk_srcs_t, max(n_srcs) AS n_srcs, \
    max(addr_first_seen) AS addr_first_seen, max(addr_last_seen) AS addr_last_seen, \
    max(addr_max_gap) AS addr_max_gap, max(claimants) AS claimants, \
    values(addr_source) AS rk_asrc, max(rk_host_covered) AS rk_host_covered, \
    max(fw_last_event) AS fw_last_event, max(fw_edges) AS fw_edges, max(rk_epc) AS rk_epc, \
    max(rk_const_ep) AS rk_const_ep BY hostname, port, package \
| stats max(rk_is_port) AS rk_is_port, values(rk_protos) AS rk_protos, \
    sum(rk_pf) AS rk_open_findings, max(rk_ev_rank) AS rk_ev_rank, max(sessions) AS sessions, \
    min(edge_first_seen) AS edge_first_seen, max(edge_last_seen) AS edge_last_seen, \
    max(hops) AS hops, values(rk_ent) AS rk_ent, values(rk_dests) AS rk_dests, \
    values(rk_idents) AS rk_idents, values(rk_idet) AS rk_idet, \
    max(rk_constant_edge) AS rk_constant_edge, \
    max(n_entries) AS n_entries, values(rk_srcs_t) AS rk_srcs_t, max(n_srcs) AS n_srcs, \
    max(addr_first_seen) AS addr_first_seen, max(addr_last_seen) AS addr_last_seen, \
    max(addr_max_gap) AS addr_max_gap, max(claimants) AS claimants, \
    values(rk_asrc) AS rk_asrc, max(rk_host_covered) AS rk_host_covered, \
    max(fw_last_event) AS fw_last_event, max(fw_edges) AS fw_edges, max(rk_epc) AS rk_epc, \
    max(rk_const_ep) AS rk_const_ep BY hostname, port \
| where rk_is_port = 1 \
| where coalesce(rk_open_findings, 0) > 0 \
| eval protocols_text = mvjoin(mvdedup(rk_protos), " ") \
| eval dest_address = mvjoin(mvdedup(rk_dests), " ") \
| eval entry_text = mvjoin(mvdedup(rk_ent), " ") \
| eval srcs_text = mvjoin(mvdedup(rk_srcs_t), " ") \
| eval addr_source = mvjoin(mvdedup(rk_asrc), " ") \
| eval identity_state = mvjoin(mvdedup(rk_idents), "; ") \
| eval identity_state = if(isnull(identity_state) OR identity_state == "", \
    "no edge to resolve", identity_state) \
| eval n_srcs = coalesce(n_srcs, 0), n_entries = coalesce(n_entries, 0) \
| eval rk_ev_rank = coalesce(rk_ev_rank, 0) \
| eval hops = if(rk_ev_rank >= 2, coalesce(hops, 1), null()) \
| eval fw_edges = coalesce(fw_edges, 0) \
| eval fw_configured = if(fw_edges > 0, 1, 0) \
| eval rk_fresh = if(fw_configured == 1 AND \
    (now() - tonumber(fw_last_event)) <= (`riskability_fw_stale_days` * 86400), 1, 0) \
| eval coverage_state = case(fw_configured == 0, "no firewall data", \
      coalesce(rk_epc, 0) == 0, "no entry point declared", \
      rk_fresh == 0, "firewall data stale", \
      coalesce(rk_host_covered, 0) == 1, "covered", \
      1=1, "host not in graph") \
| eval observed_grade = case(rk_ev_rank == 3, "confirmed observed", \
      rk_ev_rank == 2, "historically observed", \
      rk_ev_rank == 1, "unknown", \
      coverage_state == "covered" AND coalesce(rk_const_ep, 0) == 1, "not observed", \
      1=1, "unknown") \
| eval observed_reason = case(rk_ev_rank == 3, \
      "a permitted flow from a declared entry point reached this address and port within the freshness window", \
      rk_ev_rank == 2, \
      "a permitted flow from a declared entry point reached this address and port, but not recently", \
      rk_ev_rank == 1, \
      "a permitted flow reached an address on this port, but which host held that address at the time could not be established: " \
        . coalesce(mvjoin(mvdedup(rk_idet), "; "), "no detail recorded"), \
      observed_grade == "not observed", \
      "firewall data is present and fresh, a constant pressure entry point is declared, this host appears in the graph, and no permitted flow to this port has been logged", \
      coverage_state == "covered", \
      "no permitted flow was logged, but no constant pressure entry point is declared, so silence here carries no information", \
      1=1, coverage_state) \
| eval evidence_strength = case(rk_ev_rank >= 2 AND coalesce(rk_constant_edge, 0) == 1, \
      "boundary", rk_ev_rank >= 2, "interior", \
      observed_grade == "not observed", "boundary", 1=1, "none") \
| eval entry_pressure = case(coalesce(rk_constant_edge, 0) == 1, "constant", \
      n_entries > 0, "occasional", 1=1, "none") \
| lookup riskability_netevidence_lookup hostname, port OUTPUT observed_grade AS rk_prev_grade, \
    grade_changed_at AS rk_prev_changed, reappeared_at AS rk_prev_reapp \
| lookup riskability_netevidence_lookup hostname OUTPUT assessed_at AS rk_prev_host \
| eval rk_seen_before = if(coalesce(mvcount(rk_prev_host), 0) > 0, 1, 0) \
| eval previous_grade = case(isnotnull(rk_prev_grade), rk_prev_grade, \
      rk_seen_before == 0, observed_grade, 1=1, "") \
| eval grade_changed_at = case(previous_grade != observed_grade, now(), \
      isnull(rk_prev_changed), now(), 1=1, rk_prev_changed) \
| eval reappeared_at = case(observed_grade != "confirmed observed", rk_prev_reapp, \
      rk_seen_before == 0, rk_prev_reapp, \
      previous_grade == "", rk_prev_reapp, \
      previous_grade == "confirmed observed", rk_prev_reapp, \
      isnotnull(rk_prev_changed) AND (now() - tonumber(rk_prev_changed)) > \
        (`riskability_fw_absence_days` * 86400), now(), \
      1=1, rk_prev_reapp) \
| eval assessed_at = now(), rolled_at = now() \
| eval _key = hostname . "|" . port \
| table _key, hostname, port, observed_grade, observed_reason, sessions, edge_last_seen, hops, \
    entry_text, identity_state, evidence_strength, coverage_state, protocols_text, \
    edge_first_seen, srcs_text, n_srcs, entry_pressure, n_entries, dest_address, \
    addr_first_seen, addr_last_seen, addr_max_gap, addr_source, claimants, previous_grade, \
    grade_changed_at, reappeared_at, fw_last_event, assessed_at, rolled_at \
| outputlookup riskability_netevidence_lookup
dispatch.earliest_time = -30d
dispatch.latest_time = now
enableSched = 1
# After the address snapshot at :31 whose intervals it resolves identities
# against, and before the regression alert at :36 that reads the marks it sets.
cron_schedule = 34 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - firewall evidence coverage]
description = What fraction of the fleet the firewall graph can see, and how stale the newest edge \
  is. AN OPERATOR MUST BE ABLE TO READ THIS NUMBER, because it is the only thing separating "we \
  looked and found no permitted path" from "we have nothing to look at", and those two are \
  reported as very different grades from data that is otherwise identical. \
  This is the gate on the word "not observed", made visible. A permitted but unused firewall rule \
  generates no log line at all, so an edge graph systematically UNDER claims: silence usually \
  means nobody tried, not that nothing is allowed. Under claiming a risk produces false \
  reassurance, which is worse in this product than over claiming, so every host the app cannot \
  vouch for is graded unknown and unknown never collapses to unexposed. This report is where an \
  operator sees how much of their fleet that applies to. \
  Five conditions are reported separately so it is obvious which one is missing. The firewall \
  macro must return edges at all. At least one entry point must be declared, since "no permitted \
  path from nowhere" is not a finding about the world. At least one declared entry point must have \
  constant scan pressure, because that is the only place silence is informative: internet scan \
  pressure is constant, so a permitted edge at the boundary shows sessions within hours, while \
  inward of it "nobody has tried yet" is the ordinary state of an internal segment. The newest \
  edge in the whole feed must be within the staleness window, because the newest edge anywhere is \
  the clock on the ingestion pipeline and a stopped clock says nothing about any host. And the \
  host's addresses must appear in the graph at all. \
  This report counts a host as visible when one of its addresses appears ANYWHERE in the graph, as \
  a source or a destination. The evidence job's own gate is narrower and counts only destinations, \
  because inbound evidence is what it grades. The two numbers are therefore allowed to differ and \
  the wider one belongs here, where the question is how much of the estate the logging devices can \
  see at all. \
  It is a report rather than a rollup on purpose. The evidence job computes its own coverage from \
  the same single pass that produces its edges, so a stored coverage row would be a second reduce \
  over the firewall index and, worse, an ordering hazard in which a stale row silently licenses a \
  negative claim about a segment nobody is watching any more. \
  hosts_without_addresses is the number worth reading first on a site that has just wired this up. \
  While the collector puts no host addresses on its NDJSON, addresses are recovered from specific \
  listening binds, so a host whose services all bind wildcards contributes no addresses and can \
  never be resolved to an edge no matter how complete the firewall feed is. That is a limitation \
  of this app rather than of the site, and it must not be read as a gap in the firewall data.
search = | `riskability_hosts_seen` \
| fields hostname \
| eval rk_spine = 1 \
| inputlookup append=true riskability_hostaddr_lookup \
| eval rk_spine = coalesce(rk_spine, 0) \
| eval address = lower(address) \
| eval rk_addr = if(rk_spine == 0 AND isnotnull(address), 1, 0) \
| append \
    [ | `riskability_fw_edges` \
      | `riskability_fw_entry_join` \
      | eval rk_ip = mvappend(lower(src_ip), lower(dest_ip)) \
      | eventstats count AS rk_edge_total, max(edge_last_seen) AS rk_edge_newest, \
          max(entry_points_configured) AS rk_epc, \
          max(entry_constant_declared) AS rk_const_ep, \
          values(entry_names_text) AS rk_names \
      | mvexpand rk_ip \
      | stats max(rk_edge_total) AS rk_edge_total, max(rk_edge_newest) AS rk_edge_newest, \
          max(rk_epc) AS rk_epc, max(rk_const_ep) AS rk_const_ep, \
          values(rk_names) AS rk_names BY rk_ip \
      | eval address = rk_ip, rk_graph = 1, rk_spine = 0, rk_addr = 0 \
      | fields address, rk_graph, rk_edge_total, rk_edge_newest, rk_epc, rk_const_ep, \
          rk_names, rk_spine, rk_addr ] \
| eventstats max(rk_graph) AS rk_addr_graph BY address \
| eventstats max(rk_edge_total) AS rk_fw_edges, max(rk_edge_newest) AS rk_fw_last, \
    max(rk_epc) AS rk_epc_g, max(rk_const_ep) AS rk_const_g, values(rk_names) AS rk_names_g \
| where rk_spine = 1 OR rk_addr = 1 \
| stats max(rk_spine) AS rk_spine, count(address) AS rk_known, \
    sum(rk_addr_graph) AS rk_in_graph, max(rk_fw_edges) AS rk_fw_edges, \
    max(rk_fw_last) AS rk_fw_last, max(rk_epc_g) AS rk_epc_g, max(rk_const_g) AS rk_const_g, \
    values(rk_names_g) AS rk_names_g BY hostname \
| where rk_spine = 1 \
| eval rk_known = coalesce(rk_known, 0), rk_in_graph = coalesce(rk_in_graph, 0) \
| eval rk_covered = if(rk_in_graph > 0, 1, 0) \
| eval rk_no_addr = if(rk_known == 0, 1, 0) \
| stats count AS hosts_total, sum(rk_covered) AS hosts_in_graph, \
    sum(rk_no_addr) AS hosts_without_addresses, sum(rk_known) AS addresses_known, \
    sum(rk_in_graph) AS addresses_in_graph, max(rk_fw_edges) AS fw_edges, \
    max(rk_fw_last) AS fw_last_event, max(rk_epc_g) AS entry_points_configured, \
    max(rk_const_g) AS constant_entry_declared, values(rk_names_g) AS rk_names_f \
| eval fw_edges = coalesce(fw_edges, 0) \
| eval fw_configured = if(fw_edges > 0, 1, 0) \
| eval entry_points_configured = coalesce(entry_points_configured, 0) \
| eval constant_entry_declared = coalesce(constant_entry_declared, 0) \
| eval entry_names_text = if(entry_points_configured == 1, mvjoin(mvdedup(rk_names_f), ", "), \
    "none declared") \
| eval edge_age_days = if(fw_configured == 1, \
    round((now() - tonumber(fw_last_event)) / 86400, 2), null()) \
| eval feed_fresh = if(fw_configured == 1 AND \
    (now() - tonumber(fw_last_event)) <= (`riskability_fw_stale_days` * 86400), 1, 0) \
| eval hosts_in_graph_pct = if(hosts_total > 0, \
    round((hosts_in_graph * 100.0) / hosts_total, 1), 0) \
| eval coverage_state = case(fw_configured == 0, "no firewall data", \
      entry_points_configured == 0, "no entry point declared", \
      feed_fresh == 0, "firewall data stale", \
      constant_entry_declared == 0, \
        "declared entry points, but none with constant scan pressure, so nothing can be graded not observed", \
      1=1, "covered") \
| eval negative_claims_permitted = if(coverage_state == "covered", 1, 0) \
| table hosts_total, hosts_in_graph, hosts_in_graph_pct, hosts_without_addresses, \
    addresses_known, addresses_in_graph, fw_edges, fw_configured, fw_last_event, \
    edge_age_days, feed_fresh, entry_points_configured, constant_entry_declared, \
    entry_names_text, coverage_state, negative_claims_permitted
dispatch.earliest_time = -30d
dispatch.latest_time = now
enableSched = 1
# A report, not a rollup: nothing downstream reads it, so it runs after the
# evidence job rather than before it.
cron_schedule = 37 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - alert on newly observed permitted exposure]
description = Fires when a permitted flow from a declared entry point to a port carrying an open \
  finding is observed for the FIRST time, or observed again after a long absence. \
  This is the one thing in the observed traffic section that is genuinely new information rather \
  than a restatement of the inventory. Every other number the app produces answers "what is \
  installed and what is wrong with it", and it changes when a scan changes. This one changes when \
  the WORLD changes: a firewall rule was added, a security group was widened, a load balancer was \
  pointed somewhere new, or a service that was never reachable from the internet now is. Nothing \
  on the host moved, so nothing else in this app would notice. \
  It is cheap because it computes nothing. The evidence job already compares each grade against \
  the one it stored last run and stamps grade_changed_at and reappeared_at, so this alert only \
  reads the marks. No model is involved anywhere and none would help. \
  The two cases are deliberately distinguished. A first observation is a row whose previous_grade \
  is empty, meaning this host and port pair has never carried evidence before while the host \
  itself has been assessed. A reappearance is a row that was graded something other than confirmed \
  for longer than the absence window and now is not. The absence window is much longer than the \
  freshness one on purpose: a path that lapses to historically observed for a fortnight and comes \
  back is a quiet service, not a change in the estate, and alerting on that trains people to \
  ignore the alert that matters. \
  Every row the evidence job writes already carries an open finding, so there is no filter for it \
  here. A newly permitted path to a port with nothing wrong behind it is worth knowing about, but \
  it is a firewall review rather than a vulnerability alert, and the ledger does not carry it. \
  Rows whose identity could not be resolved cannot reach this alert, because the evidence job \
  never grades them confirmed. That is the correct direction: an alert saying a host became \
  exposed is worth very little if the host named on it might be the wrong one. \
  The window is ninety minutes against an hourly job, so a slipped run still reports once and a \
  normal run never reports the same change twice.
search = | inputlookup riskability_netevidence_lookup \
| where hostname != "__meta" \
| where observed_grade == "confirmed observed" \
| eval rk_first = if(previous_grade == "" AND isnotnull(grade_changed_at) \
    AND (now() - tonumber(grade_changed_at)) < 5400, 1, 0) \
| eval rk_again = if(isnotnull(reappeared_at) AND (now() - tonumber(reappeared_at)) < 5400, 1, 0) \
| where rk_first = 1 OR rk_again = 1 \
| eval regression_kind = if(rk_again == 1, "reappeared", "first-observed") \
| eval problem = case(regression_kind == "first-observed", \
      "a permitted flow from a declared entry point reached this port for the first time; this port carries open findings and nothing on the host changed to cause it", \
      1=1, \
      "a permitted flow from a declared entry point reached this port again after a long absence; a rule, group or forwarding change is the usual cause") \
| table hostname, port, protocols_text, dest_address, regression_kind, previous_grade, \
    observed_grade, evidence_strength, entry_pressure, entry_text, srcs_text, n_srcs, \
    sessions, edge_last_seen, identity_state, claimants, coverage_state, problem
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# Two minutes after the evidence job that sets the marks.
cron_schedule = 36 * * * *
alert.track = 1
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0
request.ui_dispatch_app = riskability
