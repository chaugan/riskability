# Riskability scheduled searches.
[Riskability - materialise findings]
description = Runs the matcher against the inventory of hosts that actually need it, and writes \
  one event per finding \
  into the riskability_findings index. Dashboards read the materialised findings rather than \
  re-running the match, so a dashboard load costs a search over a small index instead of a \
  version comparison across every installed package in the fleet.
search = `riskability_dirty_inventory` \
| riskabilitymatch include_informational=true emit_receipts=true \
| eval scan_time = scanned_at \
| eval match_run = now() \
| eval record_type = coalesce(record_type, "finding") \
| eval _time = if(record_type == "match_receipt", match_run, scanned_at) \
| fields match_run, record_type, components_matched, findings_produced, \
         finding_key, cve_id, advisory_id, hostname, package, ecosystem, path, scope, scope_id, \
         installed_version, fixed_version, introduced_version, last_affected, confidence, \
         confidence_reason, match_authority, match_method, distro, distro_release, feed_source, \
         severity, cvss_vector, epss, epss_percentile, kev_added, kev_due, kev_ransomware, \
         title, url, purl, os_id, os_version_id, scan_time, also_reported_as, _time \
| collect index=`riskability_index_findings` sourcetype=riskability:findings
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
# Hourly rather than continuously: the feed changes at most daily and inventory
# arrives on the forwarder's schedule, so a tighter loop would burn search
# capacity to re-derive an identical answer.
cron_schedule = 17 * * * *
alert.track = 0
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_findings

[Riskability - newly exploited vulnerabilities present in the fleet]
description = Alerts when a CVE that is present on at least one host appears in the CISA KEV \
  catalogue. KEV membership is the single strongest prioritisation signal available offline: \
  it means the vulnerability is being exploited in the wild, not merely that it scores highly.
search = | `riskability_open_findings` \
| where kev_added!="" AND confidence="high" \
| stats dc(hostname) AS hosts, values(hostname) AS host_list, values(package) AS packages \
        BY cve_id, kev_added, kev_due \
| where hosts > 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 40 7 * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_findings

[Riskability - feed is stale]
description = An air-gapped feed does not refresh itself. Without this, a forgotten import \
  degrades silently: the dashboards keep showing a falling finding count, which reads as \
  improvement rather than as blindness.
search = | inputlookup riskability_feedstate_lookup \
| where isnotnull(imported_at) \
| eval age_days = round((now() - imported_at)/86400, 1) \
| where age_days > 30 \
| table bundle_version, imported_at, age_days, advisory_count
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
cron_schedule = 0 8 * * 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_admin

[Riskability - snapshot inventory state]
description = Writes the current version of every package at every path that has ever produced \
  a finding into a KV Store lookup, with a __meta row recording when the snapshot was built. \
  NOTE the search does not begin with the word "search". savedsearches.conf takes the search \
  string without it and Splunk supplies the command, so writing it explicitly dispatches \
  "search search (index=...)" -- where the second one is a literal TERM. Every finding written \
  by collect contains "search_name=", so it matched; swinv events did not. That silently reduced \
  the inventory half of this search from 44,050 events to 6, and the snapshot it builds went to \
  zero rows while reporting success. \
  The marker is not decoration: this is a full replace, and the close job reads a missing \
  current_version as "the package is gone". An empty or stale snapshot would therefore report \
  every closed finding as uninstalled, which is the same confidently-wrong all-clear that a \
  missing fold produced. The acknowledge job refuses to grant evidence when this marker is \
  stale, so close simply does not run. The finding lifecycle reads \
  those instead of joining against the raw inventory index: the join it replaces had to return \
  one row per (host, package, path) in the fleet, which is 7,266 rows per host, so Splunk's \
  50,000-row subsearch cap was reached at about seven hosts -- and truncation is silent, which \
  made open findings look "removed".
search = (index=`riskability_index_findings` sourcetype=riskability:findings) \
    OR (index=`riskability_index_inventory` sourcetype=riskability:swinv) \
| eval pkg = coalesce(package, name) \
| eval p = coalesce(path, mvindex(locations, 0), "") \
| stats latest(eval(if(sourcetype=="riskability:swinv", version, null()))) AS current_version, \
        max(eval(if(sourcetype=="riskability:swinv", _time, null()))) AS inv_time, \
        count(eval(sourcetype=="riskability:findings")) AS finding_events \
        BY hostname, pkg, p \
| where finding_events > 0 AND isnotnull(current_version) \
| rename pkg AS package, p AS path \
| eval _key = hostname . "|" . package . "|" . path \
| table _key, hostname, package, path, current_version, inv_time \
| appendpipe \
    [| stats count AS rows \
     | eval _key = "__meta", hostname = "__meta", package = "__meta", path = "__meta", \
            current_version = rows, inv_time = now()] \
| outputlookup riskability_invstate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
# Twenty past the hour: after the matcher at :17, so a finding written this hour
# is resolvable against the inventory that produced it.
cron_schedule = 20 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot host scan times]
description = One row per host recording when it last reported inventory, plus a __meta row \
  recording when the snapshot was built -- for the same reason as the inventory snapshot: a \
  missing host_last_scan makes every finding on that host "unknown", and an empty snapshot would \
  do it to the whole fleet at once. The lifecycle needs \
  this to tell "the host has not reported since" from "the package is gone", and a lookup avoids \
  a subsearch on every dashboard load. \
  It also carries the host's OS, release, architecture and machine id. Those are free here -- \
  this search is already grouping every inventory event by host -- and they are what let the \
  Hosts page describe a fleet without running a raw index search per page load. Reading them \
  from the index directly costs one event per component per scan per host, which is the one \
  shape of search that stops working on a fleet worth having this app for. \
  The __meta row carries the row count as well as the build time, and that is load-bearing. \
  `stats count` emits a row even on an empty pipeline, so a run that found nothing still writes a \
  __meta row stamped now() -- a snapshot that is completely empty looks perfectly FRESH to anything \
  that only asks when it was built. Readers that act on a missing host must ask how many rows it \
  holds, not merely how old it is.
search = index=`riskability_index_inventory` sourcetype=riskability:swinv \
| stats max(_time) AS host_last_scan, latest(os_id) AS os, latest(os_version_id) AS release, \
        latest(architecture) AS arch, latest(machine_id) AS machine_id BY hostname \
| eval _key = hostname \
| table _key, hostname, host_last_scan, os, release, arch, machine_id \
| appendpipe \
    [| stats count AS rows | eval _key = "__meta", hostname = "__meta", host_last_scan = now()] \
| table _key, hostname, host_last_scan, os, release, arch, machine_id, rows \
| outputlookup riskability_hoststate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
cron_schedule = 19 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot finding lifecycle]
description = Computes each finding's lifecycle state once an hour and writes it to a KV Store \
  collection that every dashboard reads. The computation is a stats over every finding event ever \
  written and must span all history to be correct -- first_seen and "mitigated" mean nothing over \
  a 24-hour window -- so it is not something a dashboard panel should inherit a time range for, \
  nor pay for on every load. Measured at 30s for a two-host fleet before this existed.
search = `riskability_finding_lifecycle` \
| eval _key = finding_key \
| outputlookup riskability_findings_state_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
# DISABLED, and it must stay that way while the incremental jobs are running.
#
# This is a full REPLACE of the state collection, and it only knows the fields
# riskability_finding_lifecycle computes. It does not produce closure_reason,
# closed_at or archived, so running it on a schedule silently erased the archive
# stamps every hour -- the worker then had nothing to delete and archived
# findings came back as live ones. It was also scheduled at :25, the same minute
# as "fold in new findings", so the two raced for the same collection.
#
# Kept as a repair tool: run it by hand to rebuild state from the findings index
# after an upgrade or a KV Store restore. Re-run the archive jobs afterwards,
# because a rebuild will resurrect anything that had been archived.
enableSched = 0
cron_schedule = 25 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - checkpoint matched hosts]
description = Records the inventory digest, feed generation and matcher version each host was \
  last matched against, so the next run can skip hosts where none of the three has changed. On a \
  fleet that is not being patched every hour that is most of them, which is what turns the hourly \
  cost from O(fleet) into O(changed). Runs after the matcher; if the matcher failed, the daily \
  floor in riskability_dirty_inventory brings the host back within a day. \
  matched_at only advances for hosts that were actually re-matched: the finding lifecycle uses \
  it to decide which findings are still current, so advancing it for a host nobody looked at \
  would age out that host\'s open findings and report them as removed. \
  It also refuses to claim a host was matched when the matcher never said so. On a fresh install \
  the scheduler order is not guaranteed -- an instance that starts at :20 runs this at :30 before \
  the matcher's :17 has ever come round -- and stamping matched_at then marks every host as done \
  with no findings behind it. They stay clean until the daily floor, so a new install reports an \
  entirely clean fleet for up to twenty-four hours after importing a feed. Observed exactly that \
  way: 21,854 findings existed and the app showed none. A match receipt is the evidence, the same \
  evidence the acknowledgement uses. \
  This search reads folded_run/folded_at/folded_findings back out and writes them straight \
  through untouched. It does not own those fields -- the acknowledge job does -- but it shares \
  a row with them, and outputlookup replaces whole documents rather than merging fields. \
  Dropping them here left every host looking unacknowledged from :30 onwards, which fired the \
  pipeline alert hourly and put a permanent warning banner on the landing page. Closing itself \
  was never affected, because close runs at :27 while the acknowledgement is still there. \
  A permanently-lit warning is worse than no warning, so any writer of this collection must \
  carry every field it does not own. \
  was_dirty repeats riskability_dirty_hosts rather than calling it, because this search needs \
  the previous row's other fields in the same pass. The two must stay identical: if this one \
  thinks a host was clean while the macro fed it to the matcher, the checkpoint stamps a host \
  that was never matched. Both coalesce the feed generation and the matcher version before \
  comparing, for the reason recorded against the macro -- null != 1 is null in SPL, not true, \
  which left a fleet unmatched for a day after its first feed import.
search = `riskability_host_digest` \
| stats first(digest) AS digest, first(n_components) AS n_components BY hostname \
| eval rk_join = "current" \
| lookup riskability_feedstate_lookup _key AS rk_join OUTPUT generation AS feed_gen \
| lookup riskability_matchstate_lookup hostname OUTPUT digest AS prev_digest, \
    feed_gen AS prev_gen, matcher_version AS prev_mv, matched_at AS prev_matched_at, \
    folded_run, folded_at, folded_findings \
| eval matcher_version = `riskability_matcher_version` \
| eval rk_gen = coalesce(feed_gen, "none"), rk_prev_gen = coalesce(prev_gen, "none"), \
       rk_prev_mv = coalesce(prev_mv, "none") \
| eval was_dirty = if(isnull(prev_digest) OR prev_digest != digest OR rk_prev_gen != rk_gen \
        OR rk_prev_mv != matcher_version OR isnull(prev_matched_at) \
        OR prev_matched_at < relative_time(now(), "-1d"), 1, 0) \
| join type=left hostname \
    [search index=`riskability_index_findings` sourcetype=riskability:findings \
        record_type="match_receipt" earliest=0 latest=+10y \
        _index_earliest=`riskability_ack_window` _index_latest=now \
     | stats max(match_run) AS receipt_run BY hostname] \
| eval matched_at = if(was_dirty == 1 AND isnotnull(receipt_run), now(), prev_matched_at) \
| fields - receipt_run \
| eval _key = hostname \
| table _key, hostname, digest, feed_gen, matcher_version, matched_at, n_components, \
    folded_run, folded_at, folded_findings \
| outputlookup riskability_matchstate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
# :30, after the matcher at :17 has had time to finish on a small fleet. On a
# large one the matcher may still be running, in which case the hosts it has
# not reached keep their old checkpoint and are picked up next hour.
cron_schedule = 30 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - fold in new findings]
description = Folds findings produced since the last run into the state collection. Replaces a \
  stats over the entire findings index, whose cost grew with every change ever recorded. \
  first_seen and first_version are carried forward from the existing row, so no history is \
  needed to compute them, and the collection is upserted by finding_key rather than rewritten. \
  It carries the accepted flag forward explicitly: a KV upsert REPLACES the document rather than \
  merging into it, so any field this search does not name is erased. Writing a partial row here \
  wiped an accepted risk back into the open pool once an hour.
search = index=`riskability_index_findings` sourcetype=riskability:findings \
    earliest=0 latest=+10y \
    _index_earliest=`riskability_lifecycle_window` _index_latest=now \
| where record_type != "match_receipt" \
| stats min(scan_time) AS win_first_seen, max(scan_time) AS last_seen, \
        max(match_run) AS last_match_run, \
        earliest(installed_version) AS win_first_version, \
        latest(installed_version) AS last_version, \
        latest(cve_id) AS cve_id, latest(hostname) AS hostname, latest(package) AS package, \
        latest(ecosystem) AS ecosystem, latest(path) AS path, latest(scope) AS scope, \
        latest(scope_id) AS scope_id, latest(fixed_version) AS fixed_version, \
        latest(confidence) AS confidence, latest(match_authority) AS match_authority, \
        latest(severity) AS severity, latest(epss) AS epss, latest(kev_added) AS kev_added, \
        latest(kev_due) AS kev_due, latest(url) AS url, latest(title) AS title, \
        count AS win_seen \
        BY finding_key \
| lookup riskability_findings_state_lookup finding_key OUTPUT first_seen AS prev_first_seen, \
    first_version AS prev_first_version, times_seen AS prev_times_seen, status AS prev_status, \
    accepted AS prev_accepted, exception_key AS prev_exception_key, \
    exception_expires_at AS prev_exception_expires \
| eval first_seen = coalesce(prev_first_seen, win_first_seen) \
| eval first_version = coalesce(prev_first_version, win_first_version) \
| eval times_seen = coalesce(prev_times_seen, 0) + win_seen \
| eval age_days = round((now() - first_seen) / 86400, 1) \
| eval status = "open", closure_reason = null(), mitigation = null(), closed_at = null() \
| eval accepted = coalesce(prev_accepted, 0), exception_key = prev_exception_key, \
       exception_expires_at = prev_exception_expires \
| eval _key = finding_key \
| fields - prev_first_seen, prev_first_version, prev_times_seen, prev_status, win_first_seen, \
    win_first_version, win_seen, prev_accepted, prev_exception_key, prev_exception_expires \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -90m
dispatch.latest_time = now
enableSched = 1
cron_schedule = 25 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - close findings the matcher no longer reports]
description = Closes findings whose host has been re-matched AND whose results have demonstrably \
  been folded in. Gated on folded_run, which the acknowledge job writes only after it has \
  confirmed the fold actually happened -- never on matched_at, which the checkpoint advances \
  because a host SHOULD have been matched rather than because anything succeeded. \
  That distinction is the whole of this: closing means asserting a finding is gone, and the \
  only honest basis for that is a completed match whose output arrived. When the evidence is \
  missing this job does nothing for that host, so a broken pipeline leaves findings open and \
  visible rather than producing a clean dashboard. \
  Needs no index scan and no set difference: a finding older than its host's last fold simply \
  was not produced by it. Why it closed is recorded separately from the fact that it closed, \
  because "the package was upgraded", "the package is gone" and "the feed no longer flags it" \
  are three different things and only the first is evidence of a fix.
search = | inputlookup riskability_findings_state_lookup where status="open" \
| lookup riskability_matchstate_lookup hostname OUTPUT folded_run AS host_folded_run \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan \
| where isnotnull(host_folded_run) AND host_folded_run != "" \
        AND last_match_run < tonumber(host_folded_run) - 300 \
| lookup riskability_invstate_lookup hostname, package, path OUTPUT current_version \
| eval status = case( \
      isnull(host_last_scan), "unknown", \
      isnotnull(current_version) AND current_version != last_version, "mitigated", \
      isnull(current_version), "removed", \
      1=1, "removed") \
| eval closure_reason = case( \
      status == "unknown", "host_silent", \
      status == "mitigated", "upgraded", \
      isnull(current_version), "uninstalled", \
      1=1, "feed_retracted") \
| eval mitigation = if(status == "mitigated", last_version . " -> " . current_version, null()) \
| eval closed_at = if(status != "open", now(), null()) \
| eval _key = finding_key \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 27 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - mark findings on silent hosts]
description = A host that has stopped reporting has findings nobody has confirmed either way. \
  They become "unknown" rather than staying "open", because asserting a state on evidence that \
  has stopped arriving is the failure this app exists to avoid, and silence is not health.
search = | inputlookup riskability_findings_state_lookup where status="open" \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan \
| eval silent_days = if(isnull(host_last_scan), null(), \
                        round((now() - host_last_scan) / 86400, 1)) \
| where silent_days > `riskability_host_silent_days` \
| eval status = "unknown", closure_reason = "host_silent", closed_at = now() \
| eval _key = finding_key \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 35 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - archive expired findings]
description = Copies findings that have aged out of the state collection into the archive index \
  and marks them archived. It does NOT delete them: deletion is a separate step that only ever \
  removes rows already written to the archive, so a failed archive can never lose history. \
  Covers closed findings past their retention window and every finding of a host that has been \
  silent long enough to count as retired. \
  _time is set to the archive time on purpose: collect otherwise timestamps the event from the \
  row it came from, which put these a day in the past, outside the window the marker job reads \
  -- so nothing was ever stamped and the same rows were archived again on the next run.
search = | inputlookup riskability_findings_state_lookup \
| where isnull(archived) \
| eval rk_meta = "__meta" \
| lookup riskability_hoststate_lookup hostname AS rk_meta OUTPUT host_last_scan AS snap_built, \
    rows AS snap_rows \
| where isnotnull(snap_built) AND tonumber(snap_rows) > 0 \
        AND tonumber(snap_built) > relative_time(now(), `riskability_snapshot_max_age`) \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan \
| eval silent_days = if(isnull(host_last_scan), null(), \
                        round((now() - host_last_scan) / 86400, 1)) \
| eval closed_days = if(isnull(closed_at), null(), round((now() - closed_at) / 86400, 1)) \
| eval expire_reason = case( \
      isnotnull(silent_days) AND silent_days > `riskability_host_retire_days`, "host_retired", \
      status != "open" AND closed_days > `riskability_retain_closed_days`, "closed_aged_out", \
      1=1, null()) \
| where isnotnull(expire_reason) \
| eval archived_at = now() \
| eval _time = archived_at \
| fields - archived \
| collect index=`riskability_index_archive` sourcetype=riskability:findings:archive
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 45 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - mark archived findings for deletion]
description = Flags the state rows that the archive job has just written, so the feed worker can \
  delete them. Deleting from a KV Store collection with outputlookup means rewriting the whole \
  collection, and during that rewrite dashboards read an empty or partial result -- a security \
  UI reporting no vulnerabilities. The worker deletes by query instead, which touches only the \
  rows concerned. \
  It starts from the collection rather than from the index because a KV upsert REPLACES the \
  document: writing just the key and the stamp reduced a 24-field finding to three fields, which \
  only went unnoticed because those rows were about to be deleted anyway.
search = | inputlookup riskability_findings_state_lookup \
| join type=inner finding_key \
    [ search index=`riskability_index_archive` sourcetype=riskability:findings:archive \
        earliest=-2h latest=now \
    | stats max(archived_at) AS archived BY finding_key ] \
| eval _key = finding_key \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -2h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 50 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - reconcile accepted risks]
description = Stamps the accepted flag onto findings covered by an active exception, and clears \
  it from findings no longer covered. Rules live in the exception register; this materialises \
  them onto the finding rows so the read path stays a single KV predicate and no future panel \
  can forget a join. Only findings that actually change are written, so the cost is proportional \
  to decisions made rather than to fleet size. \
  The flag is written as the STRING "1" or "0", because that is how KV Store stores it and the \
  read macros have to quote it to match -- an unquoted comparison excludes nothing at all.
search = | inputlookup riskability_findings_state_lookup where status="open" \
| eval rk_find = "find|" . finding_key, \
       rk_host = "host|" . hostname . "|" . cve_id, \
       rk_fleet = "fleet|" . cve_id \
| lookup riskability_exception_match_lookup active_match_key AS rk_find \
    OUTPUT exception_key AS e_find, expires_at AS x_find, revoked_at AS r_find \
| lookup riskability_exception_match_lookup active_match_key AS rk_host \
    OUTPUT exception_key AS e_host, expires_at AS x_host, revoked_at AS r_host \
| lookup riskability_exception_match_lookup active_match_key AS rk_fleet \
    OUTPUT exception_key AS e_fleet, expires_at AS x_fleet, revoked_at AS r_fleet \
| eval ok_find = if(isnotnull(e_find) AND (isnull(r_find) OR r_find="") \
        AND (isnull(x_find) OR x_find="" OR tonumber(x_find) > now()), 1, 0) \
| eval ok_host = if(isnotnull(e_host) AND (isnull(r_host) OR r_host="") \
        AND (isnull(x_host) OR x_host="" OR tonumber(x_host) > now()), 1, 0) \
| eval ok_fleet = if(isnotnull(e_fleet) AND (isnull(r_fleet) OR r_fleet="") \
        AND (isnull(x_fleet) OR x_fleet="" OR tonumber(x_fleet) > now()), 1, 0) \
| eval new_accepted = if(ok_find=1 OR ok_host=1 OR ok_fleet=1, "1", "0") \
| eval new_exception = case(ok_find=1, e_find, ok_host=1, e_host, ok_fleet=1, e_fleet, 1=1, "") \
| eval new_expires = case(ok_find=1, x_find, ok_host=1, x_host, ok_fleet=1, x_fleet, 1=1, "") \
| where new_accepted != coalesce(accepted, "0") OR coalesce(exception_key, "") != new_exception \
| eval accepted = new_accepted, exception_key = new_exception, exception_expires_at = new_expires \
| fields - rk_find, rk_host, rk_fleet, e_find, e_host, e_fleet, x_find, x_host, x_fleet, \
    r_find, r_host, r_fleet, ok_find, ok_host, ok_fleet, new_accepted, new_exception, new_expires \
| eval _key = finding_key \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
# :40, after close at :27 and silent-host at :35. Running before those would
# stamp findings that are about to be closed, and an accepted finding that is
# actually already fixed is a stale decision sitting in the register.
cron_schedule = 40 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - record exception expiries]
description = Writes an audit event when an exception lapses. Expiry itself is derived from the \
  date, never from a stored flag a failed job could leave wrong -- but "it expired, and these \
  findings returned to the pool" is an event someone has to be able to point at, so it is \
  recorded rather than merely inferred.
search = | inputlookup riskability_exceptions_lookup \
| where (isnull(revoked_at) OR revoked_at="") AND isnotnull(expires_at) AND expires_at!="" \
| eval expires_num = tonumber(expires_at) \
| where expires_num <= now() AND expires_num > relative_time(now(), "-90m") \
| eval action = "expire", who = "scheduler", "when" = now() \
| table action, who, when, exception_key, scope_kind, hostname, cve_id, finding_key, \
    reason_kind, control, notes, expires_at \
| collect index=`riskability_index_audit` sourcetype=riskability:exception:audit
dispatch.earliest_time = -90m
dispatch.latest_time = now
enableSched = 1
cron_schedule = 38 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - acknowledge folded matches]
description = Writes folded_run for hosts whose match results demonstrably reached the state \
  collection. This is the fact the close job requires, and it is written on evidence rather than \
  on schedule: a host with a receipt saying it produced N findings must have at least N state \
  rows carrying that match_run, and a host whose receipt says it produced none needs only the \
  receipt. N rows, not one. Sampling the evidence with max(last_match_run) meant a single \
  refreshed row granted the acknowledgement for the whole host -- so a fold that delivered ten \
  findings out of eighty-seven unblocked closing, and the seventy-seven that never arrived were \
  closed as no longer reported while sitting on the host. Measured across every run on this \
  instance, events emitted, distinct finding keys and the receipt's own count agree exactly, so \
  counting is sound evidence rather than a heuristic. \
  It reads only the LATEST run's receipt rather than summing every receipt in the window: once \
  that window is measured in days a sum spans many runs and cannot be compared to the row count \
  of any one of them. \
  Nothing else may write folded_run. \
  The point is the asymmetry. A missing acknowledgement costs an hour of stale-high open counts; \
  a wrongly granted one closes findings that are still present and shows a clean fleet. One of \
  those is a nuisance and the other is the failure this app exists to avoid. \
  Evidence also requires the two inventory snapshots to be fresh. Both are full replaces, and \
  the close job reads a missing current_version as "the package is gone" and a missing \
  host_last_scan as "the host went quiet" -- so an empty snapshot would close the whole fleet \
  with a confident reason attached. Closing is withheld until they have been rebuilt.
search = index=`riskability_index_findings` sourcetype=riskability:findings \
    record_type="match_receipt" \
    earliest=0 latest=+10y \
    _index_earliest=`riskability_ack_window` _index_latest=now \
| eventstats max(match_run) AS latest_run BY hostname \
| where match_run == latest_run \
| stats sum(findings_produced) AS findings_produced, \
        sum(components_matched) AS components_matched, max(match_run) AS match_run \
        BY hostname \
| join type=left hostname \
    [| inputlookup riskability_findings_state_lookup \
     | eval rk_run = tonumber(last_match_run) \
     | eventstats max(rk_run) AS state_run BY hostname \
     | where rk_run == state_run \
     | stats count AS rows_at_run, max(state_run) AS state_run BY hostname] \
| eval folded = if(isnotnull(state_run) AND abs(tonumber(state_run) - match_run) < 300 \
        AND tonumber(rows_at_run) >= findings_produced, 1, 0) \
| eval evidence_ok = if(findings_produced == 0 OR folded == 1, 1, 0) \
| where evidence_ok == 1 \
| eval rk_meta = "__meta" \
| lookup riskability_invstate_lookup hostname AS rk_meta, package AS rk_meta, path AS rk_meta \
    OUTPUT inv_time AS invstate_built \
| lookup riskability_hoststate_lookup hostname AS rk_meta OUTPUT host_last_scan AS hoststate_built \
| eval snapshots_fresh = if(isnotnull(invstate_built) AND isnotnull(hoststate_built) \
        AND tonumber(invstate_built) > relative_time(now(), `riskability_snapshot_max_age`) \
        AND tonumber(hoststate_built) > relative_time(now(), `riskability_snapshot_max_age`), 1, 0) \
| where snapshots_fresh == 1 \
| fields - rk_meta, invstate_built, hoststate_built, snapshots_fresh \
| lookup riskability_matchstate_lookup hostname OUTPUT digest, feed_gen, matcher_version, \
    matched_at, n_components \
| eval folded_run = match_run, folded_at = now(), folded_findings = findings_produced \
| eval _key = hostname \
| table _key, hostname, digest, feed_gen, matcher_version, matched_at, n_components, \
    folded_run, folded_at, folded_findings \
| outputlookup append=true riskability_matchstate_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# :26, between fold-in at :25 and close at :27. If fold-in is still running the
# evidence is not there yet, no acknowledgement is written, and close does
# nothing for that host until the next hour. That is the safe direction.
cron_schedule = 26 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - pipeline did not complete]
description = Fires when the matcher reported finishing a host but its results never reached the \
  state collection. That combination is invisible in the data itself: the dashboards simply show \
  fewer findings, which reads as good news. It has to be said out loud, because the only other \
  symptom is a fleet that appears to have fixed everything at once. \
  Same window as the acknowledgement it is checking, deliberately. This used to look back three \
  hours while the acknowledgement looked back ninety minutes, so a receipt that landed in the \
  gap between them was one this alert would report and that job could never clear: any slipped \
  run produced a warning that stayed lit until the next match. An alert about a condition \
  nothing can resolve teaches people to ignore the alert.
search = index=`riskability_index_findings` sourcetype=riskability:findings \
    record_type="match_receipt" \
    earliest=0 latest=+10y \
    _index_earliest=`riskability_stuck_window` _index_latest=now \
| stats max(match_run) AS match_run, sum(findings_produced) AS findings_produced BY hostname \
| where findings_produced > 0 \
| lookup riskability_matchstate_lookup hostname OUTPUT folded_run \
| eval acknowledged = if(isnotnull(folded_run) AND abs(tonumber(folded_run) - match_run) < 300, 1, 0) \
| where acknowledged == 0 \
| eval problem = "the matcher finished this host but the fold-in never picked its findings up; \
open counts are stale and closing is withheld until it does" \
| table hostname, match_run, findings_produced, folded_run, problem
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
cron_schedule = 55 * * * *
alert.track = 1
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
counttype = number of events
relation = greater than
quantity = 0
request.ui_dispatch_app = riskability

[Riskability - backfill feed ecosystem summary]
description = Rebuilds the per-ecosystem package counts if the live feed has none. \
  The importer writes that summary as it streams the ranges in, which costs nothing because it \
  already has every row in hand. This search exists for feeds imported before it did so, and for \
  the case where the summary write failed while the import itself succeeded -- the importer \
  treats it as best effort on purpose, because a feed that works is worth more than a summary \
  that is complete. \
  The expensive part is behind a map that only runs when the summary is genuinely absent. That \
  matters: the search it runs is a dc(package) over the entire range table, measured at 36 \
  seconds and five million rows on a two-host development fleet, and it grows with the feed \
  rather than with the fleet. Running it on a schedule regardless would reintroduce, once a day \
  and for every install, exactly the cost this summary was added to remove.
search = | `riskability_feed_ecosystems` \
| stats count AS have \
| where have == 0 \
| map maxsearches=1 search="| inputlookup riskability_ranges_lookup \
    | stats dc(package) AS feed_packages, count AS feed_ranges BY ecosystem, gen \
    | eval exact = \"1\", _key = gen . \"|\" . ecosystem \
    | table _key, gen, ecosystem, feed_packages, feed_ranges, exact \
    | outputlookup append=true riskability_feedeco_lookup"
# No $token$ anywhere in the map body, deliberately. The generation comes out of
# the range rows themselves via "BY ecosystem, gen" rather than being passed in.
# A $live_gen$ there reads correctly to a human and dispatches correctly from
# the scheduler, but "| savedsearch" substitutes $...$ against its own argument
# map first and fails with "could not find variable in the argument map" -- so
# the one way an operator would run this by hand is the one way it breaks.
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# :05, clear of the hourly pipeline. Almost every run is a two-row lookup that
# finds the summary present and stops.
cron_schedule = 5 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot components by ecosystem]
description = Component counts per host per ecosystem, so the Hosts page can chart the whole \
  fleet without reading the inventory index. That index holds one event per component per scan \
  per host; charting it directly is affordable for two hosts and is the first thing to fall over \
  at five thousand, which is exactly the size this app is meant for. \
  It also carries the fleet-wide totals, on rows keyed __fleet__. Coverage asks three questions \
  about the whole fleet and the Overview asks a fourth, and every one of them was answered by \
  reading the raw inventory index on page load -- four raw searches for numbers this job already \
  has in hand. Two of them are summable across hosts and two are not: distinct package NAMES \
  fleet-wide is not the sum of distinct names per host, because the same package on two hosts is \
  one name and two instances. So the fleet figures are computed here, in the same pass, rather \
  than left for a reader to add up wrongly. \
  Full replace, deliberately: a host that stops reporting an ecosystem should stop having it \
  charted, and merging would keep it on screen forever. The cost is that an empty run would blank \
  the chart -- which is visibly wrong rather than quietly wrong, and the next hour repairs it.
search = `riskability_latest_inventory` \
| eval rk_ident = if((isnotnull(purl) AND purl!="") \
        OR (isnotnull(cpe_list) AND cpe_list!=""), 1, 0) \
| eval rk_cpe = if(isnotnull(cpe_list) AND cpe_list!="", 1, 0) \
| eventstats dc(name) AS f_components, count AS f_instances, \
        sum(rk_ident) AS f_with_identifier, sum(rk_cpe) AS f_cpe_ident BY type \
| stats dc(name) AS components, count AS instances, sum(rk_ident) AS with_identifier, \
        sum(rk_cpe) AS cpe_ident, max(f_components) AS f_components, \
        max(f_instances) AS f_instances, max(f_with_identifier) AS f_with_identifier, \
        max(f_cpe_ident) AS f_cpe_ident BY hostname, type \
| appendpipe \
    [| stats max(f_components) AS components, max(f_instances) AS instances, \
            max(f_with_identifier) AS with_identifier, max(f_cpe_ident) AS cpe_ident BY type \
     | eval hostname = "__fleet__"] \
| eval _key = hostname . "|" . type \
| table _key, hostname, type, components, instances, with_identifier, cpe_ident \
| appendpipe \
    [| stats count AS rows | eval _key = "__meta", hostname = "__meta", type = "__meta", \
        components = rows] \
| outputlookup riskability_hostecostate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
# :21, right after the host snapshot at :19 and off the matcher's back.
cron_schedule = 21 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - fold in findings the hourly window missed]
description = Repairs findings that were written to the index but never reached the state \
  collection. The hourly fold-in reads a ninety-minute window of index time, which is correct \
  and cheap while it runs every hour -- but the window moves on regardless. If the fold-in misses \
  a run, because Splunk was restarted or the scheduler slipped or the search was skipped under \
  load, the findings indexed during that gap fall out of every subsequent window and nothing \
  goes back for them. \
  What that looks like is worse than losing a run. The host keeps its receipt, so the \
  acknowledgement never arrives, so closing stays withheld for it forever and the pipeline \
  banner never goes out. Meanwhile its findings are absent from every dashboard: the host reads \
  as clean. Both symptoms are silent, and the fleet looks better than it is. \
  This is scoped to hosts the acknowledgement evidence says are actually behind, which is \
  normally none, so it normally costs one lookup and stops. The sentinel host in the subsearch \
  is load-bearing: an empty subsearch places no constraint at all, so without it a quiet fleet \
  would widen this to every host and seven days of the findings index. \
  Bounded to 2,000 hosts a run, most recently matched first. That bound is deliberate and it is \
  BELOW Splunk's own: a subsearch is silently truncated at [subsearch] maxout, 10,000 by default, \
  and a host dropped there is a host this repair job never reaches -- which is precisely the \
  failure it exists to fix, reproduced by the fix. Choosing a smaller number makes the limit ours: \
  the job drains its own backlog across successive hours instead of quietly abandoning the tail, \
  and the "pipeline did not complete" alert keeps reporting whatever is still waiting. \
  It refreshes rows the state already has rather than skipping them, and that is the whole point. \
  Insert-only looks safer and is not: a run the fold-in missed contains both findings the state \
  has never seen and findings it already knows about. Inserting only the new ones advances \
  max(last_match_run) to the missed run, which is exactly the evidence the acknowledgement wants \
  -- so closing is unblocked, and every finding this search skipped still carries the OLDER run \
  and is closed as no longer reported. They are all still present on the host. Repairing half a \
  fold is worse than repairing none of it. \
  times_seen is carried forward untouched rather than added to, so re-running this over an \
  overlapping range cannot inflate it. first_seen and the acceptance decision are preserved for \
  the same reason: this search is repairing a delivery failure, not observing a new finding.
search = index=`riskability_index_findings` sourcetype=riskability:findings \
    earliest=0 latest=+10y _index_earliest=-7d _index_latest=now \
    [| inputlookup riskability_matchstate_lookup \
     | where hostname!="__meta" \
     | where isnull(folded_run) OR folded_run="" \
             OR tonumber(folded_run) < tonumber(matched_at) - 300 \
     | sort 2000 - matched_at \
     | fields hostname \
     | append [| makeresults | eval hostname = "__no_such_host__" | fields hostname]] \
| where record_type != "match_receipt" \
| stats min(scan_time) AS first_seen, max(scan_time) AS last_seen, \
        max(match_run) AS last_match_run, \
        earliest(installed_version) AS first_version, \
        latest(installed_version) AS last_version, \
        latest(cve_id) AS cve_id, latest(hostname) AS hostname, latest(package) AS package, \
        latest(ecosystem) AS ecosystem, latest(path) AS path, latest(scope) AS scope, \
        latest(scope_id) AS scope_id, latest(fixed_version) AS fixed_version, \
        latest(confidence) AS confidence, latest(match_authority) AS match_authority, \
        latest(severity) AS severity, latest(epss) AS epss, latest(kev_added) AS kev_added, \
        latest(kev_due) AS kev_due, latest(url) AS url, latest(title) AS title, \
        dc(match_run) AS times_seen \
        BY finding_key \
| lookup riskability_findings_state_lookup finding_key OUTPUT first_seen AS prev_first_seen, \
    first_version AS prev_first_version, times_seen AS prev_times_seen, \
    accepted AS prev_accepted, exception_key AS prev_exception_key, \
    exception_expires_at AS prev_exception_expires \
| eval first_seen = coalesce(prev_first_seen, first_seen) \
| eval first_version = coalesce(prev_first_version, first_version) \
| eval times_seen = coalesce(prev_times_seen, times_seen) \
| eval age_days = round((now() - first_seen) / 86400, 1) \
| eval status = "open", closure_reason = null(), mitigation = null(), closed_at = null() \
| eval accepted = coalesce(prev_accepted, 0), exception_key = prev_exception_key, \
       exception_expires_at = prev_exception_expires \
| eval _key = finding_key \
| fields - prev_first_seen, prev_first_version, prev_times_seen, prev_accepted, \
    prev_exception_key, prev_exception_expires \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# :50, after the hour's fold-in, acknowledge and close have all had their turn.
# Anything still unacknowledged at :50 was not going to be picked up this hour.
cron_schedule = 50 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - reconcile the exception register's live key]
description = Keeps active_match_key equal to match_key on exceptions that are in force, and empty \
  on every other row. The REST endpoint maintains it on write; this is the self-heal, and it is \
  also the upgrade path for a register written by a version that had no such field. \
  Why the field exists at all: the reconciler resolves a finding to an exception with a KV lookup, \
  and match_key is deliberately NOT unique -- a scope can be accepted, withdrawn and accepted \
  again, and keeping all three entries on one key is what makes the history readable. But a Splunk \
  lookup that matches two documents returns every output field as a MULTIVALUE, and every guard \
  applied to those values then collapses to false. The result was an exception that read active in \
  the register, reported it covered zero findings, and left them in the risk pool: somebody \
  accepts a risk, is told it was accepted, and nothing happens, with no error anywhere to explain \
  it. Any scope that had ever been revoked was permanently unacceptable. \
  Expiry is the reason a scheduled sweep is needed rather than only the write path: a row lapses \
  because a timestamp passed, with nothing touching it.
search = | inputlookup riskability_exceptions_lookup \
| eval rk_expired = if(isnotnull(expires_at) AND expires_at!="" \
        AND tonumber(expires_at) <= now(), 1, 0) \
| eval rk_revoked = if(isnotnull(revoked_at) AND revoked_at!="", 1, 0) \
| eval want = if(rk_expired == 0 AND rk_revoked == 0, match_key, "") \
| where coalesce(active_match_key, "") != want \
| eval active_match_key = want \
| fields - rk_expired, rk_revoked, want \
| eval _key = exception_key \
| outputlookup append=true riskability_exceptions_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# :39, after expiries are audited at :38 and before the reconciler reads the
# register at :40.
cron_schedule = 39 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - roll up open findings per host]
description = One row per host with what its open findings add up to: how many, how many distinct \
  CVEs, how many are known-exploited, the highest EPSS, and how many are accepted. \
  This exists so the Hosts page does not compute those numbers inside a join subsearch. A join \
  subsearch is bounded at 50,000 rows and 60 seconds and neither bound says anything when it is \
  hit -- and the page then applies `fillnull value=0`, so a host whose row was dropped renders as \
  "0 open findings, 0 CVEs, 0 KEV". A clean bill of health for a machine nobody counted, which is \
  the failure this app exists to avoid. A lookup against this collection has no subsearch bound. \
  Full replace, deliberately: a host with no open findings should have no row rather than keep \
  yesterday's, and the reader can tell "not rolled up yet" from "nothing to report" because the \
  Hosts page distinguishes a missing row from a zero.
search = | `riskability_open_findings` \
| stats count AS findings, dc(cve_id) AS cves, \
        sum(eval(if(isnotnull(kev_added) AND kev_added!="", 1, 0))) AS kev, \
        max(epss) AS top_epss BY hostname \
| join type=left hostname \
    [| `riskability_accepted_findings` | stats count AS accepted BY hostname] \
| fillnull value=0 accepted \
| eval rolled_at = now() \
| eval _key = hostname \
| table _key, hostname, findings, cves, kev, top_epss, accepted, rolled_at \
| outputlookup riskability_openstate_host_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# :42, after the reconciler at :40 has settled which findings count as accepted.
cron_schedule = 42 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - roll up exception coverage]
description = How many findings and hosts each exception actually covers. \
  The register used to compute this in a join subsearch that scanned the entire finding state to \
  produce two integer columns. That subsearch is bounded at 50,000 rows and 60 seconds, and the \
  macro then does `coalesce(findings_covered, 0)` -- so a truncated subsearch renders an exception \
  that is genuinely in force as covering nothing, which is indistinguishable from the real bug \
  where an exception covers nothing because it never applied. \
  The read here is pushed down to the KV Store on accepted="1", which is a small fraction of the \
  collection rather than all of it, so this is cheap even before the rollup saves the dashboard \
  from doing it at all.
search = | inputlookup riskability_findings_state_lookup where accepted="1" \
| where isnotnull(exception_key) AND exception_key!="" \
| stats count AS findings_covered, dc(hostname) AS hosts_covered BY exception_key \
| eval rolled_at = now() \
| eval _key = exception_key \
| table _key, exception_key, findings_covered, hosts_covered, rolled_at \
| outputlookup riskability_exception_counts_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# :41, between the reconciler at :40 and the per-host rollup at :42.
cron_schedule = 41 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - roll up open findings by dimension]
description = Open findings summarised along each dimension the fleet-wide dashboards group by: \
  package, confidence, severity, ecosystem and filesystem root. One row per (dim, value). \
  Every one of those panels was a full read of the finding state, and an inputlookup is \
  single-threaded on the search head -- so at twelve million rows it is minutes per panel on any \
  hardware, and a page that fires six of them at once is worse than that. Large machines make more \
  panels run at once; they do not make one panel read fewer rows. This is the change that alters \
  the shape rather than the constant. \
  multireport is what makes it one pass. The obvious alternative -- building a multivalue field of \
  "dim:value" pairs and mvexpanding it -- multiplies the row count by the number of dimensions and \
  walks straight into [mvexpand] max_mem_usage_mb, which is the exact silent truncation the ATT&CK \
  chain was just rewritten to escape. Six separate searches would read the collection six times. \
  Age percentiles are stored rather than counts alone, because a percentile cannot be recomputed \
  from an aggregate: the remediation boxplot needs them per severity and there is no way to derive \
  them later. \
  NOTE for anyone testing this by hand: "| savedsearch" returns zero results for this search, \
  while the scheduler runs it correctly and so does pasting the search into a search bar -- \
  multireport and that dispatch path do not agree. Verify it through the endpoint the scheduler \
  itself uses, saved/searches/<name>/dispatch. Time went into concluding the job was broken when \
  the test was.
search = | `riskability_open_findings` \
| eval rk_root = if(scope_id!="", scope_id, "host") \
| eval rk_sev = coalesce(severity, "unrated") \
| multireport \
    [| stats count AS findings, dc(cve_id) AS cves, dc(hostname) AS hosts, \
            max(epss) AS top_epss, min(age_days) AS age_lo, perc25(age_days) AS age_q1, \
            median(age_days) AS age_med, perc75(age_days) AS age_q3, max(age_days) AS age_hi \
            BY package \
     | eval dim = "package" | rename package AS value] \
    [| stats count AS findings, dc(cve_id) AS cves, dc(hostname) AS hosts, \
            max(epss) AS top_epss, min(age_days) AS age_lo, perc25(age_days) AS age_q1, \
            median(age_days) AS age_med, perc75(age_days) AS age_q3, max(age_days) AS age_hi \
            BY confidence \
     | eval dim = "confidence" | rename confidence AS value] \
    [| stats count AS findings, dc(cve_id) AS cves, dc(hostname) AS hosts, \
            max(epss) AS top_epss, min(age_days) AS age_lo, perc25(age_days) AS age_q1, \
            median(age_days) AS age_med, perc75(age_days) AS age_q3, max(age_days) AS age_hi \
            BY rk_sev \
     | eval dim = "severity" | rename rk_sev AS value] \
    [| stats count AS findings, dc(cve_id) AS cves, dc(hostname) AS hosts, \
            max(epss) AS top_epss, min(age_days) AS age_lo, perc25(age_days) AS age_q1, \
            median(age_days) AS age_med, perc75(age_days) AS age_q3, max(age_days) AS age_hi \
            BY ecosystem \
     | eval dim = "ecosystem" | rename ecosystem AS value] \
    [| stats count AS findings, dc(cve_id) AS cves, dc(hostname) AS hosts, \
            max(epss) AS top_epss, min(age_days) AS age_lo, perc25(age_days) AS age_q1, \
            median(age_days) AS age_med, perc75(age_days) AS age_q3, max(age_days) AS age_hi \
            BY rk_root \
     | eval dim = "root" | rename rk_root AS value] \
| where isnotnull(value) AND value!="" \
| eval rolled_at = now() \
| eval _key = dim . "|" . value \
| table _key, dim, value, findings, cves, hosts, top_epss, age_lo, age_q1, age_med, age_q3, \
    age_hi, rolled_at \
| outputlookup riskability_openstate_dim_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# :43, after the per-host rollup at :42.
cron_schedule = 43 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - roll up open findings per host and dimension]
description = Open findings per host, summarised along the dimensions the per-host charts group \
  by: filesystem root, ecosystem, severity and confidence. \
  The fleet-wide rollup cannot answer these -- distinct CVEs on one host is not derivable from a \
  fleet total, and summing per-host counts double-counts anything two hosts share. A few tens of \
  rows per host replaces a scan of that host's findings.
search = | `riskability_open_findings` \
| eval rk_root = if(scope_id!="", scope_id, "host") \
| eval rk_sev = coalesce(severity, "unrated") \
| multireport \
    [| stats count AS findings, dc(cve_id) AS cves, dc(package) AS packages, \
            max(epss) AS top_epss BY hostname, rk_root \
     | eval dim = "root" | rename rk_root AS value] \
    [| stats count AS findings, dc(cve_id) AS cves, dc(package) AS packages, \
            max(epss) AS top_epss BY hostname, ecosystem \
     | eval dim = "ecosystem" | rename ecosystem AS value] \
    [| stats count AS findings, dc(cve_id) AS cves, dc(package) AS packages, \
            max(epss) AS top_epss BY hostname, rk_sev \
     | eval dim = "severity" | rename rk_sev AS value] \
    [| stats count AS findings, dc(cve_id) AS cves, dc(package) AS packages, \
            max(epss) AS top_epss BY hostname, confidence \
     | eval dim = "confidence" | rename confidence AS value] \
| where isnotnull(value) AND value!="" \
| eval rolled_at = now() \
| eval _key = hostname . "|" . dim . "|" . value \
| table _key, hostname, dim, value, findings, cves, packages, top_epss, rolled_at \
| outputlookup riskability_openstate_host_dim_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
cron_schedule = 44 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - roll up open findings per CVE]
description = One row per open CVE: how many findings carry it, how many hosts, which packages, \
  the highest EPSS, and its KEV dates. \
  Distinct-CVE questions are the most common shape on these dashboards, and the CVE catalogue is \
  tens of thousands of rows where the finding state is millions. \
  Hosts are stored as a COUNT, not as names. A CVE present on five thousand machines would \
  otherwise carry five thousand values on one row and the summary would be bigger than the thing \
  it summarises. Anything needing the actual host names has to read the findings, which is what \
  the per-host rollup and the pushed-down per-host reads are for.
search = | `riskability_open_findings` \
| eval tlen = len(title) \
| eventstats min(tlen) AS shortest BY cve_id \
| eval short_title = if(tlen == shortest, title, null()) \
| stats count AS findings, dc(hostname) AS hosts, values(package) AS packages, \
        max(epss) AS top_epss, values(severity) AS severity, \
        values(kev_added) AS kev_added, values(kev_due) AS kev_due, \
        values(short_title) AS title BY cve_id \
| eval title = mvindex(title, 0), severity = mvindex(severity, 0), \
       kev_added = mvindex(kev_added, 0), kev_due = mvindex(kev_due, 0) \
| eval rolled_at = now() \
| eval _key = cve_id \
| table _key, cve_id, findings, hosts, packages, top_epss, severity, kev_added, kev_due, \
    title, rolled_at \
| outputlookup riskability_openstate_cve_lookup
