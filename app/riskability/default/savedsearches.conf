# Riskability scheduled searches.
[Riskability - materialise findings]
description = Runs the matcher against the inventory of hosts that actually need it, and writes \
  one event per finding \
  into the riskability_findings index. Dashboards read the materialised findings rather than \
  re-running the match, so a dashboard load costs a search over a small index instead of a \
  version comparison across every installed package in the fleet.
search = `riskability_dirty_inventory` \
| riskabilitymatch include_informational=true \
| eval scan_time = scanned_at \
| eval _time = scanned_at \
| eval match_run = now() \
| fields match_run, finding_key, cve_id, advisory_id, hostname, package, ecosystem, path, scope, scope_id, \
         installed_version, fixed_version, introduced_version, last_affected, confidence, \
         confidence_reason, match_authority, match_method, distro, distro_release, feed_source, \
         severity, cvss_vector, epss, epss_percentile, kev_added, kev_due, kev_ransomware, \
         title, url, purl, os_id, os_version_id, scan_time, also_reported_as, _time \
| collect index=riskability_findings sourcetype=riskability:findings
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
# Hourly rather than continuously: the feed changes at most daily and inventory
# arrives on the forwarder's schedule, so a tighter loop would burn search
# capacity to re-derive an identical answer.
cron_schedule = 17 * * * *
alert.track = 0
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_findings

[Riskability - newly exploited vulnerabilities present in the fleet]
description = Alerts when a CVE that is present on at least one host appears in the CISA KEV \
  catalogue. KEV membership is the single strongest prioritisation signal available offline: \
  it means the vulnerability is being exploited in the wild, not merely that it scores highly.
search = | `riskability_open_findings` \
| where kev_added!="" AND confidence="high" \
| stats dc(hostname) AS hosts, values(hostname) AS host_list, values(package) AS packages \
        BY cve_id, kev_added, kev_due \
| where hosts > 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 40 7 * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_findings

[Riskability - feed is stale]
description = An air-gapped feed does not refresh itself. Without this, a forgotten import \
  degrades silently: the dashboards keep showing a falling finding count, which reads as \
  improvement rather than as blindness.
search = | inputlookup riskability_feedstate_lookup \
| where isnotnull(imported_at) \
| eval age_days = round((now() - imported_at)/86400, 1) \
| where age_days > 30 \
| table bundle_version, imported_at, age_days, advisory_count
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
cron_schedule = 0 8 * * 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_admin

[Riskability - snapshot inventory state]
description = Writes the current version of every package at every path that has ever produced \
  a finding, plus each host's last scan time, into KV Store lookups. The finding lifecycle reads \
  those instead of joining against the raw inventory index: the join it replaces had to return \
  one row per (host, package, path) in the fleet, which is 7,266 rows per host, so Splunk's \
  50,000-row subsearch cap was reached at about seven hosts -- and truncation is silent, which \
  made open findings look "removed".
search = search (index=riskability_findings sourcetype=riskability:findings) \
    OR (index=riskability_inventory sourcetype=riskability:swinv) \
| eval pkg = coalesce(package, name) \
| eval p = coalesce(path, mvindex(locations, 0), "") \
| stats latest(eval(if(sourcetype=="riskability:swinv", version, null()))) AS current_version, \
        max(eval(if(sourcetype=="riskability:swinv", _time, null()))) AS inv_time, \
        count(eval(sourcetype=="riskability:findings")) AS finding_events \
        BY hostname, pkg, p \
| where finding_events > 0 AND isnotnull(current_version) \
| rename pkg AS package, p AS path \
| eval _key = hostname . "|" . package . "|" . path \
| table _key, hostname, package, path, current_version, inv_time \
| outputlookup riskability_invstate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
# Twenty past the hour: after the matcher at :17, so a finding written this hour
# is resolvable against the inventory that produced it.
cron_schedule = 20 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot host scan times]
description = One row per host recording when it last reported inventory. The lifecycle needs \
  this to tell "the host has not reported since" from "the package is gone", and a lookup avoids \
  a subsearch on every dashboard load.
search = search index=riskability_inventory sourcetype=riskability:swinv \
| stats max(_time) AS host_last_scan BY hostname \
| eval _key = hostname \
| table _key, hostname, host_last_scan \
| outputlookup riskability_hoststate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
cron_schedule = 19 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot finding lifecycle]
description = Computes each finding's lifecycle state once an hour and writes it to a KV Store \
  collection that every dashboard reads. The computation is a stats over every finding event ever \
  written and must span all history to be correct -- first_seen and "mitigated" mean nothing over \
  a 24-hour window -- so it is not something a dashboard panel should inherit a time range for, \
  nor pay for on every load. Measured at 30s for a two-host fleet before this existed.
search = `riskability_finding_lifecycle` \
| eval _key = finding_key \
| outputlookup riskability_findings_state_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
# DISABLED, and it must stay that way while the incremental jobs are running.
#
# This is a full REPLACE of the state collection, and it only knows the fields
# riskability_finding_lifecycle computes. It does not produce closure_reason,
# closed_at or archived, so running it on a schedule silently erased the archive
# stamps every hour -- the worker then had nothing to delete and archived
# findings came back as live ones. It was also scheduled at :25, the same minute
# as "fold in new findings", so the two raced for the same collection.
#
# Kept as a repair tool: run it by hand to rebuild state from the findings index
# after an upgrade or a KV Store restore. Re-run the archive jobs afterwards,
# because a rebuild will resurrect anything that had been archived.
enableSched = 0
cron_schedule = 25 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - checkpoint matched hosts]
description = Records the inventory digest, feed generation and matcher version each host was \
  last matched against, so the next run can skip hosts where none of the three has changed. On a \
  fleet that is not being patched every hour that is most of them, which is what turns the hourly \
  cost from O(fleet) into O(changed). Runs after the matcher; if the matcher failed, the daily \
  floor in riskability_dirty_inventory brings the host back within a day. \
  matched_at only advances for hosts that were actually re-matched: the finding lifecycle uses \
  it to decide which findings are still current, so advancing it for a host nobody looked at \
  would age out that host\'s open findings and report them as removed.
search = `riskability_inventory_digest` \
| stats first(digest) AS digest, first(n_components) AS n_components BY hostname \
| eval rk_join = "current" \
| lookup riskability_feedstate_lookup _key AS rk_join OUTPUT generation AS feed_gen \
| lookup riskability_matchstate_lookup hostname OUTPUT digest AS prev_digest, \
    feed_gen AS prev_gen, matcher_version AS prev_mv, matched_at AS prev_matched_at \
| eval matcher_version = `riskability_matcher_version` \
| eval was_dirty = if(isnull(prev_digest) OR prev_digest != digest OR prev_gen != feed_gen \
        OR prev_mv != matcher_version OR isnull(prev_matched_at) \
        OR prev_matched_at < relative_time(now(), "-1d"), 1, 0) \
| eval matched_at = if(was_dirty == 1, now(), prev_matched_at) \
| eval _key = hostname \
| table _key, hostname, digest, feed_gen, matcher_version, matched_at, n_components \
| outputlookup riskability_matchstate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
# :30, after the matcher at :17 has had time to finish on a small fleet. On a
# large one the matcher may still be running, in which case the hosts it has
# not reached keep their old checkpoint and are picked up next hour.
cron_schedule = 30 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - fold in new findings]
description = Folds findings produced since the last run into the state collection. Replaces a \
  stats over the entire findings index, whose cost grew with every change ever recorded. \
  first_seen and first_version are carried forward from the existing row, so no history is \
  needed to compute them, and the collection is upserted by finding_key rather than rewritten. \
  It carries the accepted flag forward explicitly: a KV upsert REPLACES the document rather than \
  merging into it, so any field this search does not name is erased. Writing a partial row here \
  wiped an accepted risk back into the open pool once an hour.
search = search index=riskability_findings sourcetype=riskability:findings \
    earliest=0 latest=+10y \
    _index_earliest=`riskability_lifecycle_window` _index_latest=now \
| stats min(scan_time) AS win_first_seen, max(scan_time) AS last_seen, \
        max(match_run) AS last_match_run, \
        earliest(installed_version) AS win_first_version, \
        latest(installed_version) AS last_version, \
        latest(cve_id) AS cve_id, latest(hostname) AS hostname, latest(package) AS package, \
        latest(ecosystem) AS ecosystem, latest(path) AS path, latest(scope) AS scope, \
        latest(scope_id) AS scope_id, latest(fixed_version) AS fixed_version, \
        latest(confidence) AS confidence, latest(match_authority) AS match_authority, \
        latest(severity) AS severity, latest(epss) AS epss, latest(kev_added) AS kev_added, \
        latest(kev_due) AS kev_due, latest(url) AS url, latest(title) AS title, \
        count AS win_seen \
        BY finding_key \
| lookup riskability_findings_state_lookup finding_key OUTPUT first_seen AS prev_first_seen, \
    first_version AS prev_first_version, times_seen AS prev_times_seen, status AS prev_status, \
    accepted AS prev_accepted, exception_key AS prev_exception_key, \
    exception_expires_at AS prev_exception_expires \
| eval first_seen = coalesce(prev_first_seen, win_first_seen) \
| eval first_version = coalesce(prev_first_version, win_first_version) \
| eval times_seen = coalesce(prev_times_seen, 0) + win_seen \
| eval age_days = round((now() - first_seen) / 86400, 1) \
| eval status = "open", closure_reason = null(), mitigation = null(), closed_at = null() \
| eval accepted = coalesce(prev_accepted, 0), exception_key = prev_exception_key, \
       exception_expires_at = prev_exception_expires \
| eval _key = finding_key \
| fields - prev_first_seen, prev_first_version, prev_times_seen, prev_status, win_first_seen, \
    win_first_version, win_seen, prev_accepted, prev_exception_key, prev_exception_expires \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -90m
dispatch.latest_time = now
enableSched = 1
cron_schedule = 25 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - close findings the matcher no longer reports]
description = Closes findings whose host has been re-matched since they were last produced. \
  Needs no index scan and no set difference: a finding older than its host's last match simply \
  was not produced by it. Why it closed is recorded separately from the fact that it closed, \
  because "the package was upgraded", "the package is gone" and "the feed no longer flags it" \
  are three different things and only the first is evidence of a fix.
search = | inputlookup riskability_findings_state_lookup where status="open" \
| lookup riskability_matchstate_lookup hostname OUTPUT matched_at AS host_last_matched \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan \
| where isnotnull(host_last_matched) AND last_match_run < host_last_matched - 300 \
| lookup riskability_invstate_lookup hostname, package, path OUTPUT current_version \
| eval status = case( \
      isnull(host_last_scan), "unknown", \
      isnotnull(current_version) AND current_version != last_version, "mitigated", \
      isnull(current_version), "removed", \
      1=1, "removed") \
| eval closure_reason = case( \
      status == "unknown", "host_silent", \
      status == "mitigated", "upgraded", \
      isnull(current_version), "uninstalled", \
      1=1, "feed_retracted") \
| eval mitigation = if(status == "mitigated", last_version . " -> " . current_version, null()) \
| eval closed_at = if(status != "open", now(), null()) \
| eval _key = finding_key \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 27 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - mark findings on silent hosts]
description = A host that has stopped reporting has findings nobody has confirmed either way. \
  They become "unknown" rather than staying "open", because asserting a state on evidence that \
  has stopped arriving is the failure this app exists to avoid, and silence is not health.
search = | inputlookup riskability_findings_state_lookup where status="open" \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan \
| eval silent_days = round((now() - coalesce(host_last_scan, 0)) / 86400, 1) \
| where silent_days > `riskability_host_silent_days` \
| eval status = "unknown", closure_reason = "host_silent", closed_at = now() \
| eval _key = finding_key \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 35 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - archive expired findings]
description = Copies findings that have aged out of the state collection into the archive index \
  and marks them archived. It does NOT delete them: deletion is a separate step that only ever \
  removes rows already written to the archive, so a failed archive can never lose history. \
  Covers closed findings past their retention window and every finding of a host that has been \
  silent long enough to count as retired. \
  _time is set to the archive time on purpose: collect otherwise timestamps the event from the \
  row it came from, which put these a day in the past, outside the window the marker job reads \
  -- so nothing was ever stamped and the same rows were archived again on the next run.
search = | inputlookup riskability_findings_state_lookup \
| where isnull(archived) \
| lookup riskability_hoststate_lookup hostname OUTPUT host_last_scan \
| eval silent_days = round((now() - coalesce(host_last_scan, 0)) / 86400, 1) \
| eval closed_days = if(isnull(closed_at), null(), round((now() - closed_at) / 86400, 1)) \
| eval expire_reason = case( \
      silent_days > `riskability_host_retire_days`, "host_retired", \
      status != "open" AND closed_days > `riskability_retain_closed_days`, "closed_aged_out", \
      1=1, null()) \
| where isnotnull(expire_reason) \
| eval archived_at = now() \
| eval _time = archived_at \
| fields - archived \
| collect index=riskability_findings_archive sourcetype=riskability:findings:archive
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 45 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - mark archived findings for deletion]
description = Flags the state rows that the archive job has just written, so the feed worker can \
  delete them. Deleting from a KV Store collection with outputlookup means rewriting the whole \
  collection, and during that rewrite dashboards read an empty or partial result -- a security \
  UI reporting no vulnerabilities. The worker deletes by query instead, which touches only the \
  rows concerned. \
  It starts from the collection rather than from the index because a KV upsert REPLACES the \
  document: writing just the key and the stamp reduced a 24-field finding to three fields, which \
  only went unnoticed because those rows were about to be deleted anyway.
search = | inputlookup riskability_findings_state_lookup \
| join type=inner finding_key \
    [ search index=riskability_findings_archive sourcetype=riskability:findings:archive \
        earliest=-2h latest=now \
    | stats max(archived_at) AS archived BY finding_key ] \
| eval _key = finding_key \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -2h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 50 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - reconcile accepted risks]
description = Stamps the accepted flag onto findings covered by an active exception, and clears \
  it from findings no longer covered. Rules live in the exception register; this materialises \
  them onto the finding rows so the read path stays a single KV predicate and no future panel \
  can forget a join. Only findings that actually change are written, so the cost is proportional \
  to decisions made rather than to fleet size. \
  The flag is written as the STRING "1" or "0", because that is how KV Store stores it and the \
  read macros have to quote it to match -- an unquoted comparison excludes nothing at all.
search = | inputlookup riskability_findings_state_lookup where status="open" \
| eval rk_find = "find|" . finding_key, \
       rk_host = "host|" . hostname . "|" . cve_id, \
       rk_fleet = "fleet|" . cve_id \
| lookup riskability_exception_match_lookup match_key AS rk_find \
    OUTPUT exception_key AS e_find, expires_at AS x_find, revoked_at AS r_find \
| lookup riskability_exception_match_lookup match_key AS rk_host \
    OUTPUT exception_key AS e_host, expires_at AS x_host, revoked_at AS r_host \
| lookup riskability_exception_match_lookup match_key AS rk_fleet \
    OUTPUT exception_key AS e_fleet, expires_at AS x_fleet, revoked_at AS r_fleet \
| eval ok_find = if(isnotnull(e_find) AND (isnull(r_find) OR r_find="") \
        AND (isnull(x_find) OR x_find="" OR tonumber(x_find) > now()), 1, 0) \
| eval ok_host = if(isnotnull(e_host) AND (isnull(r_host) OR r_host="") \
        AND (isnull(x_host) OR x_host="" OR tonumber(x_host) > now()), 1, 0) \
| eval ok_fleet = if(isnotnull(e_fleet) AND (isnull(r_fleet) OR r_fleet="") \
        AND (isnull(x_fleet) OR x_fleet="" OR tonumber(x_fleet) > now()), 1, 0) \
| eval new_accepted = if(ok_find=1 OR ok_host=1 OR ok_fleet=1, "1", "0") \
| eval new_exception = case(ok_find=1, e_find, ok_host=1, e_host, ok_fleet=1, e_fleet, 1=1, "") \
| eval new_expires = case(ok_find=1, x_find, ok_host=1, x_host, ok_fleet=1, x_fleet, 1=1, "") \
| where new_accepted != coalesce(accepted, "0") OR coalesce(exception_key, "") != new_exception \
| eval accepted = new_accepted, exception_key = new_exception, exception_expires_at = new_expires \
| fields - rk_find, rk_host, rk_fleet, e_find, e_host, e_fleet, x_find, x_host, x_fleet, \
    r_find, r_host, r_fleet, ok_find, ok_host, ok_fleet, new_accepted, new_exception, new_expires \
| eval _key = finding_key \
| outputlookup append=true riskability_findings_state_lookup
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
# :40, after close at :27 and silent-host at :35. Running before those would
# stamp findings that are about to be closed, and an accepted finding that is
# actually already fixed is a stale decision sitting in the register.
cron_schedule = 40 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - record exception expiries]
description = Writes an audit event when an exception lapses. Expiry itself is derived from the \
  date, never from a stored flag a failed job could leave wrong -- but "it expired, and these \
  findings returned to the pool" is an event someone has to be able to point at, so it is \
  recorded rather than merely inferred.
search = | inputlookup riskability_exceptions_lookup \
| where (isnull(revoked_at) OR revoked_at="") AND isnotnull(expires_at) AND expires_at!="" \
| eval expires_num = tonumber(expires_at) \
| where expires_num <= now() AND expires_num > relative_time(now(), "-90m") \
| eval action = "expire", who = "scheduler", "when" = now() \
| table action, who, when, exception_key, scope_kind, hostname, cve_id, finding_key, \
    reason_kind, control, notes, expires_at \
| collect index=riskability_audit sourcetype=riskability:exception:audit
dispatch.earliest_time = -90m
dispatch.latest_time = now
enableSched = 1
cron_schedule = 38 * * * *
alert.track = 0
request.ui_dispatch_app = riskability
