# Riskability scheduled searches.
[Riskability - materialise findings]
description = Runs the matcher against the latest inventory and writes one event per finding \
  into the riskability_findings index. Dashboards read the materialised findings rather than \
  re-running the match, so a dashboard load costs a search over a small index instead of a \
  version comparison across every installed package in the fleet.
search = `riskability_latest_inventory` \
| riskabilitymatch include_informational=true \
| eval scan_time = scanned_at \
| eval _time = scanned_at \
| fields finding_key, cve_id, advisory_id, hostname, package, ecosystem, path, scope, scope_id, \
         installed_version, fixed_version, introduced_version, last_affected, confidence, \
         confidence_reason, match_authority, match_method, distro, distro_release, feed_source, \
         severity, cvss_vector, epss, epss_percentile, kev_added, kev_due, kev_ransomware, \
         title, url, purl, os_id, os_version_id, scan_time, also_reported_as, _time \
| collect index=riskability_findings sourcetype=riskability:findings
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
# Hourly rather than continuously: the feed changes at most daily and inventory
# arrives on the forwarder's schedule, so a tighter loop would burn search
# capacity to re-derive an identical answer.
cron_schedule = 17 * * * *
alert.track = 0
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_findings

[Riskability - newly exploited vulnerabilities present in the fleet]
description = Alerts when a CVE that is present on at least one host appears in the CISA KEV \
  catalogue. KEV membership is the single strongest prioritisation signal available offline: \
  it means the vulnerability is being exploited in the wild, not merely that it scores highly.
search = | `riskability_open_findings` \
| where kev_added!="" AND confidence="high" \
| stats dc(hostname) AS hosts, values(hostname) AS host_list, values(package) AS packages \
        BY cve_id, kev_added, kev_due \
| where hosts > 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 40 7 * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_findings

[Riskability - feed is stale]
description = An air-gapped feed does not refresh itself. Without this, a forgotten import \
  degrades silently: the dashboards keep showing a falling finding count, which reads as \
  improvement rather than as blindness.
search = | inputlookup riskability_feedstate_lookup \
| where isnotnull(imported_at) \
| eval age_days = round((now() - imported_at)/86400, 1) \
| where age_days > 30 \
| table bundle_version, imported_at, age_days, advisory_count
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
cron_schedule = 0 8 * * 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
request.ui_dispatch_app = riskability
request.ui_dispatch_view = riskability_admin

[Riskability - snapshot inventory state]
description = Writes the current version of every package at every path that has ever produced \
  a finding, plus each host's last scan time, into KV Store lookups. The finding lifecycle reads \
  those instead of joining against the raw inventory index: the join it replaces had to return \
  one row per (host, package, path) in the fleet, which is 7,266 rows per host, so Splunk's \
  50,000-row subsearch cap was reached at about seven hosts -- and truncation is silent, which \
  made open findings look "removed".
search = search (index=riskability_findings sourcetype=riskability:findings) \
    OR (index=riskability_inventory sourcetype=riskability:swinv) \
| eval pkg = coalesce(package, name) \
| eval p = coalesce(path, mvindex(locations, 0), "") \
| stats latest(eval(if(sourcetype=="riskability:swinv", version, null()))) AS current_version, \
        max(eval(if(sourcetype=="riskability:swinv", _time, null()))) AS inv_time, \
        count(eval(sourcetype=="riskability:findings")) AS finding_events \
        BY hostname, pkg, p \
| where finding_events > 0 AND isnotnull(current_version) \
| rename pkg AS package, p AS path \
| eval _key = hostname . "|" . package . "|" . path \
| table _key, hostname, package, path, current_version, inv_time \
| outputlookup riskability_invstate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
# Twenty past the hour: after the matcher at :17, so a finding written this hour
# is resolvable against the inventory that produced it.
cron_schedule = 20 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot host scan times]
description = One row per host recording when it last reported inventory. The lifecycle needs \
  this to tell "the host has not reported since" from "the package is gone", and a lookup avoids \
  a subsearch on every dashboard load.
search = search index=riskability_inventory sourcetype=riskability:swinv \
| stats max(_time) AS host_last_scan BY hostname \
| eval _key = hostname \
| table _key, hostname, host_last_scan \
| outputlookup riskability_hoststate_lookup
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 1
cron_schedule = 19 * * * *
alert.track = 0
request.ui_dispatch_app = riskability

[Riskability - snapshot finding lifecycle]
description = Computes each finding's lifecycle state once an hour and writes it to a KV Store \
  collection that every dashboard reads. The computation is a stats over every finding event ever \
  written and must span all history to be correct -- first_seen and "mitigated" mean nothing over \
  a 24-hour window -- so it is not something a dashboard panel should inherit a time range for, \
  nor pay for on every load. Measured at 30s for a two-host fleet before this existed.
search = `riskability_finding_lifecycle` \
| eval _key = finding_key \
| outputlookup riskability_findings_state_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
# :25, after the matcher at :17 and the inventory snapshots at :19 and :20, so
# each hour's state is built from that hour's data rather than the last one's.
cron_schedule = 25 * * * *
alert.track = 0
request.ui_dispatch_app = riskability
