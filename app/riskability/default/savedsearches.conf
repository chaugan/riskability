[Riskability - roll up reachability per package]
description = One row per (host, package) saying how far the network reaches it. \
  The listener is named by its systemd unit where there is one and by the executable's base \
  name otherwise -- "svchost.exe", not the full Windows path. The full path is kept alongside \
  it for the detail table: a graph node labelled with 60 characters of "C:\\Program Files\\..." \
  is unreadable, and its backslashes are escape characters everywhere they are later quoted. \
  The collapse happens here rather than at read time, and that is the whole point of the search. \
  riskability_exposure holds one row per PORT, so a package bound to both 0.0.0.0:22/tcp and \
  [::]:22/tcp6 matches two documents -- and a Splunk lookup matching more than one document \
  returns every output field as MULTIVALUE, which makes an eval comparing it to a string false. \
  The finding would come back classified "no listening port" while the service answers the \
  internet. Silent, and in the one direction this app exists to prevent. \
  max(reach_rank) is deliberate: a package on both a loopback and a wildcard port is reported as \
  wildcard. The strongest binding wins, never the weakest.
search = | inputlookup riskability_exposure_lookup \
| where isnotnull(package) AND package!="" \
| eval reach_rank = case(bind_scope=="wildcard", 3, bind_scope=="specific", 2, \
                         bind_scope=="loopback", 1, 1=1, -1) \
| eval endpoint = address . ":" . port . "/" . protocol \
| eval exe_base = replace(coalesce(executable, ""), "^.*[\\\\/]", "") \
| eval listener = replace(coalesce(unit, if(exe_base=="", null(), exe_base), \
    "unidentified listener"), "[|;]", "_") \
| eval cname = replace(coalesce(container_name, ""), "[|;]", "_") \
| eval hop = endpoint . "|" . listener . "|" . cname \
| stats max(reach_rank) AS reach_rank, max(scanned_at) AS exposure_scanned_at, \
        dc(endpoint) AS listeners, values(endpoint) AS ep, values(listener) AS li, \
        values(cname) AS co, values(hop) AS hops, values(executable) AS ex \
        BY hostname, package \
| eval ports_text = mvjoin(mvdedup(ep), ", "), listener_text = mvjoin(mvdedup(li), ", "), \
       container_text = mvjoin(mvdedup(co), ", "), chain_text = mvjoin(mvdedup(hops), ";"), \
       listener_path_text = mvjoin(mvdedup(ex), ", ") \
| eval reach_class = case(reach_rank==3, "answers any address", \
                          reach_rank==2, "answers one address", \
                          reach_rank==1, "loopback only", 1=1, "no listening port") \
| eval rolled_at = now(), _key = hostname . "|" . package \
| table _key, hostname, package, reach_class, reach_rank, listeners, ports_text, \
        listener_text, listener_path_text, container_text, chain_text, exposure_scanned_at, \
        rolled_at \
| outputlookup riskability_reach_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
cron_schedule = 27 * * * *
alert.track = 0
