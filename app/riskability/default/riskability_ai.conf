# AI analysis pipeline connection, written by the Riskability Configuration
# app. The one secret -- the endpoint's API key or proxy password -- does NOT
# live here: it lives in Splunk's encrypted storage-password store, reached
# through this app's REST handler only. A secret in a conf file would be
# readable by btool, backed up in plaintext and greppable forever.
#
# Sites may edit this file by hand; the schema every field must satisfy is in
# bin/riskability/ai_config.py FIELD_SPECS, and the admin endpoint validates
# against the same table.
#
# Two of these numbers are mirrored into macros, because a saved search can
# expand a macro and cannot read a conf file: candidate_cap into
# riskability_ai_candidate_cap, and model into riskability_ai_sig_salt. The
# admin endpoint re-stamps both on every save. Hand editing this file leaves
# the macros stating the previous values until someone presses Save, so a
# hand edit of either field should be followed by an edit of the macro.
#
# t2_concurrency describes the MODEL SERVER, not this app's appetite. See the
# measurements against it below.

[connection]
endpoint_url =
auth_type = none
username =
model = foundation-sec-8b
bert_url =
enabled = 0
verify_tls = 1
request_timeout = 120
# How many analysis calls the search command has in flight at once. It must
# match what the server actually serves in parallel, which is Ollama's
# OLLAMA_NUM_PARALLEL or vLLM's batching configuration. Raising it past that
# does not make the card do more work; it makes requests queue inside the
# server, where nothing can see them.
#
# Measured on the reference box (RTX 3060 12GB, Ollama,
# Foundation-Sec-1.1-8B-Instruct Q4_K_M): a single request answers in
# 3,142 ms, while the median across 21 real verdicts at t2_concurrency 8 is
# 23,419 ms. Aggregate throughput is about 0.34 CVEs per second at 8 threads
# against about 0.32 single threaded, so eight threads bought roughly six per
# cent of throughput and made each individual verdict seven times slower to
# arrive. The setting is kept because a server configured for real
# parallelism will use it, and shipped at 1 because a number above the
# server's own is a queue that looks like concurrency.
t2_concurrency = 1
t2_max_tokens = 400
t3_max_tokens = 1200
t3_deep_threshold = 70
# Distinct CVEs one run may send to the model. 1000 is the reference box's
# hourly capacity with headroom; the reasoning and the measurements are in
# macros.conf under riskability_ai_candidate_cap, which must hold the same
# number.
candidate_cap = 1000
last_test =
