# Search head cluster replication for this app's own conf files.
#
# The four Administration pages write their settings through splunkd's
# configuration service, which a cluster replicates only for conf files named
# here. Without this stanza an administrator saves the model endpoint, or a
# firewall source, or switches an escalation rule on, and the change reaches
# the member they happened to be logged in to and no other: the pipeline then
# behaves differently depending on which search head ran it, which is worse
# than not replicating at all because nothing reports a disagreement.
#
# AppInspect asks for it too (check_custom_conf_replication). Only the three
# confs a person edits are listed; everything else in default/ ships with the
# app and arrives on every member through the deployer.
[shclustering]
conf_replication_include.riskability_ai = true
conf_replication_include.riskability_escalations = true
conf_replication_include.riskability_firewall = true
