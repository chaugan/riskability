# The worker that performs feed imports and online fetches.
#
# This work cannot live in the REST handler that requests it: importing a full
# bundle takes minutes, and splunkd shuts down the persistent-script pool when
# it goes idle, killing any thread running there. A modular input is the
# mechanism Splunk provides for long-running work -- splunkd keeps it alive and
# restarts it if it dies.
#
# It does nothing at all until an admin queues a request from the app, so an
# enabled input costs one KV Store read a minute.
# The scheme stanza. python.required must be set HERE as well as on the
# instance, or splunkd introspects the script with one interpreter and runs it
# with another and says so in a startup warning.
[riskability_feedworker]
python.version = python3
python.required = 3.9, 3.13

[riskability_feedworker://main]
interval = 60
disabled = 0
python.version = python3
python.required = 3.9, 3.13
