# Deterministic escalation rules. One stanza per rule.
#
# The priority score is computed from five measured signals: KEV listing, EPSS
# band, CVSS band, measured network exposure, and version match confidence.
# That is a deliberately small set, and it is small because it has to be
# defensible: nothing a model says can move an ordering, and every number in it
# comes from something the app measured.
#
# The app measures far more than five things. Loader accurate link records, the
# listening process behind each open port, cron and systemd and scheduled tasks
# and SUID binaries carrying ATT&CK technique ids, end of life status per
# product. None of it can influence a priority, because there is no rule that
# combines any of it with the flaw.
#
# This file is that rule language. A rule is a boolean predicate over measured
# fields, and its only power is to raise one finding by one tier.
#
#
# THE FOUR KEYS
#
#   description   What the rule catches, and why the five scoring signals
#                 cannot catch it. Both halves are required. A rule whose
#                 description cannot answer the second half is a sixth scoring
#                 weight wearing a rule's clothes, and it belongs in the scorer
#                 where it can be reasoned about against the other five, not
#                 here where it fires on a subset and looks like an exception.
#   when          A Splunk eval boolean expression. SPL evaluates it natively.
#                 There is no new interpreter and no new language, which is the
#                 point: the search head already has one, it is already the
#                 thing every other calculation in this app is written in, and
#                 an operator reading a rule is reading SPL they can test in a
#                 search bar.
#   bump          1. A rule raises the finding by exactly one tier. It cannot
#                 raise by two, and it cannot produce P0. P0 stays the
#                 deterministic scorer's to give, so the top of the queue is
#                 always something the five signals agreed on rather than
#                 something a local rule decided.
#   enabled       0 in this file, for every rule, always. See below.
#
#
# WHY EVERY RULE SHIPS enabled = 0
#
# An escalation rule that arrives switched on is an ordering change the site
# did not ask for. Somebody upgrades the app on a Tuesday and their queue is
# different on Wednesday, with no ticket, no decision and nothing to point at.
# This app's whole posture is that nothing changes a risk number without a
# person deciding it should, which is why the model driven priority was thrown
# out in the first place. Shipping these on would be the same mistake in a
# smaller box.
#
# So these are worked examples with the reasoning attached, not defaults. Read
# one, decide whether it describes your estate, and switch that one on.
#
#
# THE FIELD ALLOWLIST, AND WHY A TYPO MUST FAIL LOUDLY
#
# "when" is an SPL fragment read out of a conf file and expanded into a
# scheduled search. An unvalidated one is SPL injection into this app's own
# pipeline, so the validator is not a tidiness check, it is the control.
#
# It accepts an allowlist and nothing else: allowlisted field identifiers,
# numeric literals, double quoted string literals, the operators = == != < <=
# > >= AND OR NOT, and matched parentheses. Everything else is rejected,
# including backticks, pipes, commas, subsearch brackets, single quotes,
# semicolons, dollar signs, and any function call at all. Rejection is by
# allowlist rather than by blocklist, because a blocklist is a list of the
# attacks somebody thought of.
#
# The allowlist is also what makes a typo survivable. In SPL an unknown field
# is null, and a comparison against null is false, so a rule reading
# rk_esc_load_rnak would simply never fire: no error, no log line, no result,
# and an operator who believes an escalation is running when nothing is. That
# failure is silent for ever. A rule naming a field outside the allowlist is
# therefore rejected outright rather than evaluated, so a misspelling is a
# loud failure at validation instead of a quiet nothing at every run.
#
#
# WORKED EXAMPLE: ADDING A RULE
#
# Say the estate has decided that a flaw in a library loaded by a listening
# process matters more when the host also has no supported release left,
# because there will be no patch to apply when the ticket is finally read.
#
#   1. Write the predicate against fields on the allowlist, and only those.
#      Check each identifier against the list below rather than trusting the
#      name to be what you remember.
#
#   2. Put it in a stanza in local/riskability_escalations.conf, not here.
#      default/ is replaced wholesale on upgrade.
#
#        [unpatchable_in_a_listener]
#        description = A flaw in a library a listening process loads, on a \
#          product whose vendor has no supported release left. Neither half \
#          is a scoring signal: the load record is measured hourly and the \
#          scorer never reads it, and lifecycle is measured per component \
#          and reaches no scoring input at all, so the score describes a \
#          flaw that can be reached and says nothing about there being \
#          nowhere to go once it is.
#        when = rk_esc_load_rank = 3 AND rk_esc_eol_support = "no supported release"
#        bump = 1
#        enabled = 0
#
#   3. Leave it enabled = 0 and let validation run. A rejected rule tells you
#      which identifier it refused.
#
#   4. Switch it on, and look at what moved. A rule that escalates a third of
#      the queue is not an escalation, it is a rescoring, and the honest place
#      for it is the scorer.
#
#
# THE FIELDS, AND WHERE EACH ONE COMES FROM
#
# Every field below is an rk_esc_ prefixed value the escalation stage computes
# on the finding before any rule is evaluated. The prefix exists so a rule can
# never accidentally read a raw lookup output whose type or vocabulary is not
# what the rule author assumed. world_writable is the case that proves it: it
# arrives from swinv as the string "true" on some hosts, as 1 on others, and
# blank on every Windows host, and two dashboard panels already test all three
# spellings. A rule must never be the fourth place that has to know that.
#
#   rk_esc_attack_vector   "N", "A", "L", "P" or "" from the advisory's CVSS
#                          v3 vector. Measured: riskability_advisory_lookup
#                          carries cvss_vector, and the extraction is already
#                          proven in [Riskability - roll up ATT&CK placement],
#                          including the mvindex guard that a CVE with several
#                          advisory rows needs.
#   rk_esc_impact_c        "N", "L", "H" or "", same vector, same extraction.
#   rk_esc_impact_i        As above.
#   rk_esc_impact_a        As above.
#   rk_esc_reach_rank      3, 2, 1, 0 or -1 from riskability_reach_lookup,
#                          keyed on hostname and the finding's scope. Measured
#                          hourly and already read by the expansion search.
#   rk_esc_load_rank       3 when a listener loads it, 2 when it is loaded and
#                          nothing listening loads it, 1 when link data exists
#                          for the host and the library is not in it, 0 when
#                          no link data exists or the ecosystem has no shared
#                          libraries. From the riskability_load_evidence macro,
#                          which is measured, cheap, and read by nothing in the
#                          prioritisation pipeline today.
#   rk_esc_eol_support     One of "supported", "vendor extended support",
#                          "supported by the distribution", "distribution
#                          lifecycle unknown", "no supported release", or ""
#                          when the component has no lifecycle row at all.
#                          From riskability_eolstate. Absence of a row means
#                          absence of lifecycle data and never evidence of
#                          support, so "" must not be read as good news.
#   rk_esc_has_fix         1 when the finding carries a fixed version, 0 when
#                          it does not. From the finding itself.
#   rk_esc_sole_listener   1 when this finding's package is the only thing
#                          answering its port anywhere in the assessed fleet.
#                          NOT MEASURED TODAY: nothing in the app groups
#                          exposure by port, and this field depends on a fleet
#                          wide rollup that has to settle what counts as one
#                          listener and which hosts count as assessed. Until
#                          that exists the rule below cannot fire, which is
#                          also why it ships off.
#   rk_esc_root_autorun_writable
#                          1 when the host has a scheduled or persistent
#                          mechanism whose target is world writable and which
#                          runs as root or SYSTEM. The mechanisms and their
#                          world_writable and user fields are measured in
#                          riskability_config; the per host rollup that reduces
#                          them to this one flag is NOT MEASURED TODAY.
#
#   rk_esc_route_evidence  One of "confirmed observed", "historically
#                          observed", "unknown" or "not observed". It says
#                          whether traffic to this finding's host and port was
#                          PERMITTED and OBSERVED at an enforcement point that
#                          logs, which is the one layer a collector running ON
#                          the host cannot see. It is not reachability and it
#                          must never be read as reachability: an observed
#                          edge proves a flow crossed that point at some time
#                          T, not that the rule still stands, that the path is
#                          bidirectional, that anything answered at L7, or
#                          that the host still holds the address.
#                          It is a string rather than a rank because the four
#                          grades are not a scale. "unknown" is the absence of
#                          the measurement, not a low reading of it, and the
#                          validator refuses < <= > >= on a string field so
#                          that no rule can put absence in an ordering. Every
#                          grade except "confirmed observed" must leave a
#                          finding where the five signals put it: a permitted
#                          rule nobody has used yet produces no record at all,
#                          so this evidence is systematically incomplete, and
#                          reading its silence as safety is false reassurance,
#                          which is a worse failure here than over claiming.
#                          NOT MEASURED TODAY: the per host and port rollup of
#                          permitted edges, and the identity guard that joins
#                          an address seen at time T to a host known to hold
#                          it, are both outside the escalation stage, and the
#                          facts macro assigns nothing to this field.
#
# What a rule cannot see: accepted risk. Findings reach this pipeline through
# the riskability_open_findings macro, which excludes accepted="1" at source,
# so an accepted finding is not escalated because it is not present. That is
# the right way round. An escalation that could reach past an acceptance would
# make the register advisory, and the register is the one place in this app
# where a human decision is final.
#
# ---------------------------------------------------------------------------


# The motivating case. A CVSS 5.3 availability only flaw in the sole process
# answering the only port 53 in the fleet stays P4 today, and every fact needed
# to say otherwise is already measured except the one this rule needs most.
[sole_listener_availability]
description = An availability affecting flaw in the one process answering a \
  port nothing else in the fleet answers. The five signals cannot reach this. \
  CVSS scores a denial of service low by construction and the CVSS band is \
  what carries that into the priority, which is correct for one of forty web \
  servers behind a balancer and wrong for the estate's only resolver. \
  Exposure is measured per host and per package, so it can say this package \
  answers a routable address; it has no vocabulary for nothing else does. \
  Uniqueness is a property of the fleet rather than of the finding, and not \
  one of the five signals is a fleet aggregate. The loss here is not the \
  service, it is everything that resolves through it, and no per finding \
  signal can express that.
when = rk_esc_impact_a != "N" AND rk_esc_sole_listener = 1
bump = 1
enabled = 0


# The second motivating case. The score has no term for the thing that turns a
# local flaw into a path.
[writable_root_autorun_local_flaw]
description = A locally exploitable flaw on a host whose scheduled or \
  persistent mechanisms already run a world writable target as root. The five \
  signals score locality DOWN and are right to: a local flaw on a host with \
  no listening port lands in the isolated exposure band and loses fifteen \
  points, because the only way to reach it is to be there already. That stops \
  being right the moment the host is configured so any local write becomes \
  root execution on a timer, at which point the local flaw is the first half \
  of a path and the timer is the second. Both halves are measured. The \
  configuration surface records the mechanism, its owner and whether its \
  target is world writable, and it is not an input to the score, so the app \
  knows both facts and has never once put them together. \
  This rule escalates every locally exploitable finding on such a host rather \
  than a chosen one, because the weakness belongs to the host and no measured \
  field says which flaw reaches the writable target. That is a blunter \
  instrument than the sole listener rule and should be read as one: switch it \
  on where the writable autorun is the thing you would fix first anyway.
when = rk_esc_attack_vector = "L" AND (rk_esc_impact_c != "N" OR rk_esc_impact_i != "N") AND rk_esc_root_autorun_writable = 1
bump = 1
enabled = 0


# The third case the score cannot see, and the one whose evidence comes from
# outside this app entirely. Exposure here is derived from local socket
# binding, and a socket cannot see what is in front of it.
[observed_route_the_binding_cannot_see]
description = A finding on a host and port where an enforcement point logged \
  traffic actually permitted to it from a declared entry point, while the \
  exposure signal reads the finding's own package as bound narrowly or as not \
  listening at all. The five signals cannot catch this because measured \
  exposure is derived entirely from LOCAL SOCKET BINDING. The collector runs \
  on the host, it records which address a process bound to, and it cannot \
  observe the NAT, the firewall rule, the security group, the reverse proxy \
  or the load balancer sitting in front of that socket. So a service bound to \
  one interface address reads as answering one address and is scored DOWN as \
  internal, at the same moment a log at the layer above says traffic to it \
  was permitted and seen. That log is measured by a different system, it is \
  the only record of the layer the collector is blind to, and no scoring \
  signal reads it. \
  The reach_rank term is what keeps this a rule rather than a sixth weight: \
  where the binding is already a wildcard the five signals have the finding \
  covered, and escalating there would be scoring exposure twice. \
  It fires on evidence and never on the absence of evidence. Only the \
  "confirmed observed" grade matches. "unknown", which is what every row \
  carries at a site that has not onboarded firewall logs, and "not observed", \
  which means a covered segment produced no edge, both leave the finding \
  exactly where the deterministic score put it. A permitted path nobody has \
  used yet produces no record at all, so this evidence is incomplete by \
  construction and its silence is not a measurement of safety. Missing \
  firewall data may cost confidence in a finding. It must never cost the \
  finding its priority.
when = rk_esc_route_evidence = "confirmed observed" AND rk_esc_reach_rank < 3
bump = 1
enabled = 0


# Every field this one needs is measured today, hourly, and read by nothing in
# the prioritisation pipeline.
[listener_loads_the_library]
description = A flaw in a library that a listening process actually loads, on \
  a host where the library's own package looks unexposed. The exposure signal \
  is keyed on the host and on the FINDING'S package, so libssl3t64 is given \
  the reach of libssl3t64, which owns no port, answers no address and reads \
  as no listening port. The process that does own the port is a different \
  package entirely, and the record joining the two is the loader accurate \
  link data, measured every hour and consulted by no scoring signal. So the \
  score steps this finding down for being isolated at the exact moment the \
  measured evidence says a listener has it mapped. \
  The reach_rank test is what keeps this a rule rather than a weight: where \
  the package is already scored as exposed the five signals have the finding \
  covered, and escalating there would be scoring exposure twice.
when = rk_esc_load_rank = 3 AND rk_esc_reach_rank < 1
bump = 1
enabled = 0


# Lifecycle is measured per component and reaches no scoring input at all.
[no_supported_release_no_fix]
description = A flaw in a component whose vendor has no supported release \
  left and for which no fixed version is known. The five signals describe the \
  flaw and the host it sits on. Not one of them describes whether a remedy \
  exists, because remediability is not a property of the vulnerability. A \
  finding with a fixed version is work, and it will close. A finding on a \
  product with no supported release is a decision about the product, and it \
  will sit at the same tier for ever while everything around it closes, which \
  is the exact shape of a queue that teaches people to ignore it. \
  The support value must be the measured "no supported release" and not merely \
  a missing lifecycle row: absence of a row means absence of lifecycle data, \
  never evidence of support, and reading a blank as end of life would escalate \
  every component the lifecycle feed has never heard of.
when = rk_esc_eol_support = "no supported release" AND rk_esc_has_fix = 0
bump = 1
enabled = 0
